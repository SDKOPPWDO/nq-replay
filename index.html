<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NQ 複盤">
<title>NQ 複盤</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{--bg:#0d0d0f;--bg2:#18181b;--bg3:#1f1f23;--b1:#2a2a30;--b2:#38383f;--t1:#fff;--t2:#b0b0c0;--t3:#707080;--up:#ef4444;--dn:#22c55e;--blue:#2563eb;--r:8px;--rs:6px;}
html,body{height:100%;background:var(--bg);color:var(--t1);font-family:-apple-system,BlinkMacSystemFont,sans-serif;overflow:hidden;}
.app{display:flex;flex-direction:column;height:100dvh;}
.topbar{display:flex;align-items:center;gap:6px;padding:7px 10px;background:var(--bg2);border-bottom:1px solid var(--b1);flex-shrink:0;}
.app-title{font-size:14px;font-weight:700;flex:1;}
.day-nav{display:flex;align-items:center;gap:3px;}
.day-btn{width:28px;height:28px;border-radius:var(--rs);border:1px solid var(--b2);background:var(--bg3);color:var(--t1);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.day-btn:active{opacity:.6;}
.date-display{padding:4px 9px;font-size:12px;font-weight:600;border-radius:var(--rs);border:1px solid var(--b2);background:var(--bg3);color:var(--t1);cursor:pointer;white-space:nowrap;}
.tf-wrap{display:flex;align-items:center;gap:4px;}
.tf-lbl{font-size:10px;color:var(--t3);}
.tf-btn{padding:4px 7px;font-size:11px;border-radius:var(--rs);border:1px solid var(--b2);background:var(--bg3);color:var(--t2);cursor:pointer;font-family:inherit;user-select:none;}
.tf-btn.on{background:var(--blue);border-color:var(--blue);color:#fff;}
.mode-wrap{display:flex;align-items:center;gap:3px;}
.mode-btn{padding:4px 8px;font-size:11px;border-radius:var(--rs);border:1px solid var(--b2);background:var(--bg3);color:var(--t2);cursor:pointer;font-family:inherit;font-weight:500;}
.mode-btn.on{background:#7c3aed;border-color:#7c3aed;color:#fff;}
.cal-popup{position:fixed;z-index:9999;background:var(--bg2);border:1px solid var(--b2);border-radius:12px;padding:12px;box-shadow:0 12px 40px rgba(0,0,0,.8);display:none;}
.cal-popup.show{display:block;}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.cal-month{font-size:13px;font-weight:600;}
.cal-nav{width:26px;height:26px;border-radius:6px;border:1px solid var(--b2);background:var(--bg3);color:var(--t1);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;}
.cal-grid{display:grid;grid-template-columns:repeat(7,30px);gap:3px;}
.cal-dow{font-size:10px;color:var(--t3);text-align:center;padding:2px 0;}
.cal-day{width:30px;height:30px;border-radius:6px;border:none;background:transparent;color:var(--t3);font-size:11px;cursor:default;display:flex;align-items:center;justify-content:center;}
.cal-day.has-data{background:var(--bg3);color:var(--t1);cursor:pointer;border:1px solid var(--b2);}
.cal-day.selected{background:var(--blue);border-color:var(--blue);color:#fff;}
.infobar{display:flex;align-items:stretch;background:var(--bg2);border-bottom:1px solid var(--b1);min-height:34px;flex-shrink:0;}
.info-time-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 10px;border-right:1px solid var(--b1);min-width:68px;gap:1px;}
.info-time{font-size:11px;font-weight:700;color:#fff;}
.info-chg-val{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;}
.info-ohlc{display:flex;flex:1;}
.info-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 6px;border-right:1px solid var(--b1);flex:1;}
.info-cell:last-child{border-right:none;}
.info-cell-lbl{font-size:8px;color:var(--t3);letter-spacing:.5px;margin-bottom:1px;}
.info-cell-val{font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;color:#fff;}
.up{color:var(--up);}.dn{color:var(--dn);}
.prog{height:2px;background:var(--b1);flex-shrink:0;}
.pbar{height:100%;background:var(--blue);transition:width .1s;}
.main-content{display:flex;flex:1;min-height:0;overflow:hidden;}
.charts-col{display:flex;flex-direction:column;flex:1;min-width:0;overflow:hidden;}
.ccol{display:flex;flex-direction:column;flex:1;border-bottom:1px solid var(--b1);overflow:hidden;min-height:0;}
.ccol:last-child{border-bottom:none;}
.chdr{padding:3px 8px;background:var(--bg2);border-bottom:1px solid var(--b1);display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
.chdr-l{font-weight:700;color:var(--t1);font-size:11px;}
.chdr-r{color:var(--t3);font-size:10px;}
.zoom-btn{width:20px;height:20px;border-radius:4px;border:1px solid var(--b2);background:var(--bg3);color:var(--t1);font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;line-height:1;}
.chdr-price{display:flex;align-items:center;gap:4px;padding:2px 8px;border-radius:10px;font-size:11px;font-variant-numeric:tabular-nums;}
.chdr-price-lbl{font-size:9px;color:rgba(255,255,255,0.6);font-weight:500;}
.chdr-price-val{font-size:12px;font-weight:800;}
.chdr-price.up{background:rgba(239,68,68,0.15);}
.chdr-price.dn{background:rgba(34,197,94,0.15);}
.chdr-wick{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;}
.chdr-wick-item{display:flex;align-items:center;gap:3px;padding:2px 7px;border-radius:10px;font-size:11px;background:rgba(255,255,255,0.05);}
.chdr-wick-lbl{font-size:9px;color:rgba(255,255,255,0.55);font-weight:500;}
.chdr-wick-val{font-size:11px;font-weight:800;color:#facc15;}
.zoom-btn:active{opacity:.6;}
.cwrap{flex:1;min-height:0;position:relative;cursor:crosshair;}
canvas{display:block;width:100%;height:100%;position:absolute;top:0;left:0;}
canvas.cross{pointer-events:none;}
.mabar{display:flex;gap:6px;padding:2px 8px;background:var(--bg2);border-top:1px solid var(--b1);flex-shrink:0;flex-wrap:wrap;}
.matag{display:flex;align-items:center;gap:2px;font-size:9px;color:var(--t2);}
.maln{width:10px;height:2px;border-radius:1px;}
.btn-col{width:100px;flex-shrink:0;background:var(--bg2);border-left:1px solid var(--b1);display:flex;flex-direction:column;align-items:stretch;padding:8px 6px;gap:6px;overflow-y:auto;}
.cbtn{border-radius:var(--r);border:1px solid var(--b2);background:var(--bg3);color:var(--t1);font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:14px 4px;user-select:none;-webkit-user-select:none;font-family:inherit;text-align:center;width:100%;}
.cbtn:active{opacity:.6;transform:scale(.97);}
.cbtn.next{background:var(--blue);border-color:var(--blue);font-size:13px;}
.cbtn.dim{color:var(--t2);font-size:11px;font-weight:500;}
.btn-sep{height:1px;background:var(--b1);margin:2px 0;}
.cfg-section{display:flex;flex-direction:column;gap:4px;}
.cfg-lbl{font-size:9px;color:var(--t3);text-align:center;margin-top:2px;}
.macfg{display:flex;align-items:center;gap:3px;}
.sw{width:12px;height:12px;border-radius:2px;flex-shrink:0;cursor:pointer;border:1px solid rgba(255,255,255,0.2);}
.cinp{flex:1;height:22px;font-size:10px;text-align:center;border-radius:4px;border:1px solid var(--b2);background:var(--bg3);color:var(--t1);font-family:inherit;min-width:0;}
.poslbl{font-size:9px;color:var(--t3);text-align:center;}
.cpopup{position:fixed;background:var(--bg2);border:1px solid var(--b2);border-radius:10px;padding:10px;z-index:9999;display:none;flex-direction:column;gap:8px;box-shadow:0 12px 40px rgba(0,0,0,.8);}
.cpopup.show{display:flex;}
.cpopup-title{font-size:11px;font-weight:600;}
.cpalette{display:grid;grid-template-columns:repeat(5,26px);gap:5px;}
.cpal-dot{width:26px;height:26px;border-radius:5px;cursor:pointer;border:2px solid transparent;}
.cpal-dot.sel{border-color:#fff;}
.cpopup-close{font-size:10px;color:var(--t3);text-align:center;cursor:pointer;}
/* TRADE SYSTEM */
.trade-toggle-wrap{display:flex;align-items:center;justify-content:space-between;padding:4px 2px;}
.trade-toggle-lbl{font-size:10px;color:var(--t2);font-weight:600;}
.trade-switch{position:relative;width:34px;height:18px;background:var(--b2);border-radius:9px;cursor:pointer;transition:background .2s;flex-shrink:0;}
.trade-switch.on{background:#7c3aed;}
.trade-switch-knob{position:absolute;top:2px;left:2px;width:14px;height:14px;background:#fff;border-radius:50%;transition:left .2s;}
.trade-switch.on .trade-switch-knob{left:18px;}
.trade-panel{display:flex;flex-direction:column;gap:5px;}
.trade-qty-row{display:flex;align-items:center;gap:4px;}
.trade-qty-lbl{font-size:9px;color:var(--t3);white-space:nowrap;}
.trade-qty-inp{flex:1;height:24px;font-size:11px;text-align:center;border-radius:4px;border:1px solid var(--b2);background:var(--bg3);color:var(--t1);font-family:inherit;min-width:0;}
.trade-action-btn{width:100%;padding:12px 4px;font-size:12px;font-weight:700;border-radius:var(--r);border:none;cursor:pointer;font-family:inherit;color:#fff;}
.trade-action-btn:active{opacity:.7;transform:scale(.97);}
.trade-buy{background:var(--up);}
.trade-sell{background:var(--dn);}
.trade-flat{background:#7c3aed;}
.trade-settle{background:#f59e0b;}
.trade-pos-info{font-size:9px;color:var(--t3);text-align:center;line-height:1.5;padding:2px 0;min-height:14px;}
.trade-pnl-live{font-size:12px;font-weight:800;text-align:center;}
.trade-cur-qty{font-size:11px;font-weight:700;text-align:center;color:#fff;background:var(--bg3);border:1px solid var(--b2);border-radius:6px;padding:5px 0;}
.trade-pos-box{display:flex;flex-direction:column;gap:5px;max-height:200px;overflow-y:auto;}
.trade-pos-empty{font-size:10px;color:var(--t3);text-align:center;padding:10px 0;}
.trade-pos-card{border-radius:8px;padding:7px 8px;position:relative;overflow:hidden;}
.trade-pos-card.long{background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.35);}
.trade-pos-card.short{background:rgba(34,197,94,0.12);border:1px solid rgba(34,197,94,0.35);}
.trade-pos-card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px;}
.trade-pos-dir-badge{font-size:10px;font-weight:800;padding:1px 7px;border-radius:5px;color:#fff;letter-spacing:.5px;}
.trade-pos-dir-badge.long{background:var(--up);}
.trade-pos-dir-badge.short{background:var(--dn);}
.trade-pos-qty{font-size:11px;font-weight:700;color:#fff;}
.trade-pos-card-row{display:flex;justify-content:space-between;font-size:9.5px;color:var(--t2);line-height:1.5;}
.trade-pos-card-row b{color:#fff;font-variant-numeric:tabular-nums;}
.trade-pos-pnl-row{display:flex;justify-content:space-between;align-items:center;margin-top:3px;padding-top:3px;border-top:1px solid rgba(255,255,255,0.08);font-size:10px;}
.trade-pos-pnl-val{font-weight:800;font-variant-numeric:tabular-nums;}
/* RESULT MODAL */
.tresult-overlay{position:fixed;inset:0;background:radial-gradient(ellipse at top, #14141a 0%, #050508 70%);z-index:600;display:none;flex-direction:column;align-items:center;padding:24px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
.tresult-overlay.show{display:flex;}
.tresult-card{width:100%;max-width:1200px;}
.tresult-header{text-align:center;margin-bottom:24px;}
.tresult-title{font-size:26px;font-weight:800;color:#fff;margin-bottom:6px;letter-spacing:.3px;}
.tresult-sub{font-size:13px;color:var(--t2);font-weight:500;}
.tresult-hero{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:20px;}
.tresult-hero-sub{font-size:9.5px;color:var(--t3);margin-top:3px;}
.tresult-hero-card{background:linear-gradient(145deg,var(--bg2),var(--bg3));border:1px solid var(--b1);border-radius:18px;padding:22px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,0.3);}
.tresult-hero-lbl{font-size:12px;color:var(--t3);margin-bottom:8px;letter-spacing:1px;font-weight:600;text-transform:uppercase;}
.tresult-hero-val{font-size:36px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-0.5px;}
.tresult-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px;}
.tresult-stat{background:var(--bg2);border:1px solid var(--b1);border-radius:12px;padding:14px 8px;text-align:center;transition:border-color .15s;}
.tresult-stat-lbl{font-size:10px;color:var(--t3);margin-bottom:6px;font-weight:600;letter-spacing:.3px;}
.tresult-stat-val{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;}
.tresult-section{background:var(--bg2);border:1px solid var(--b1);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 4px 16px rgba(0,0,0,0.2);}
.tresult-section-title{font-size:14px;font-weight:700;color:#fff;margin-bottom:14px;display:flex;align-items:center;gap:7px;letter-spacing:.2px;}
.tresult-ls-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.tresult-ls-card{border-radius:14px;padding:16px;}
.tresult-ls-card.long{background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.3);}
.tresult-ls-card.short{background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.3);}
.tresult-ls-title{font-size:13px;font-weight:700;margin-bottom:10px;text-align:center;letter-spacing:.2px;}
.tresult-ls-row{display:flex;justify-content:space-between;font-size:11.5px;color:var(--t2);padding:4px 2px;font-weight:500;}
.tresult-ls-row b{color:#fff;font-weight:700;}
.tresult-ls-divider{height:1px;background:rgba(255,255,255,0.12);margin:8px 0;}
.ls-metric-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-top:4px;}
.ls-metric-grid.cols2{grid-template-columns:1fr 1fr;}
.ls-metric{background:rgba(0,0,0,0.2);border-radius:8px;padding:8px 6px;text-align:center;}
.ls-metric-lbl{display:block;font-size:9px;color:var(--t3);margin-bottom:4px;font-weight:600;}
.ls-metric b{font-size:13px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums;}
.ls-subgroup-lbl{font-size:10px;color:var(--t3);font-weight:700;margin:12px 0 6px;text-align:center;letter-spacing:.5px;position:relative;}
.ls-subgroup-lbl::before,.ls-subgroup-lbl::after{content:'';display:inline-block;width:30px;height:1px;background:rgba(255,255,255,0.15);vertical-align:middle;margin:0 6px;}

.tresult-eff-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.eff-card{background:var(--bg3);border:1px solid var(--b1);border-radius:14px;padding:18px;min-width:0;}
.eff-card-title{font-size:14px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:6px;}
.eff-row{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid rgba(255,255,255,0.06);}
.eff-row:last-child{border-bottom:none;padding-bottom:0;}
.eff-row-icon{font-size:14px;width:22px;text-align:center;flex-shrink:0;margin-top:1px;}
.eff-row-body{flex:1;}
.eff-row-lbl{font-size:11px;color:var(--t2);font-weight:600;margin-bottom:3px;}
.eff-row-val{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;margin-bottom:2px;}
.eff-row-sub{font-size:9.5px;color:var(--t3);}
.eff-chart-wrap{margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,0.1);}
.eff-chart-title{font-size:11px;font-weight:700;color:var(--t2);margin-bottom:8px;}
.scatter-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.scatter-card{background:var(--bg3);border:1px solid var(--b1);border-radius:12px;padding:14px;}
.scatter-card-title{font-size:12px;font-weight:700;margin-bottom:10px;}
.tresult-log{max-height:280px;overflow-y:auto;}
.tresult-log-row{display:grid;grid-template-columns:60px 55px 38px 70px 70px 40px 75px;gap:6px;font-size:11px;padding:8px 6px;border-bottom:1px solid var(--b1);align-items:center;border-radius:6px;font-weight:500;}
.tresult-log-row.hdr{color:var(--t3);font-weight:700;border-bottom:1px solid var(--b2);font-size:10px;letter-spacing:.3px;}
.tresult-log-row.win{background:rgba(34,197,94,0.07);}
.tresult-log-row.loss{background:rgba(239,68,68,0.07);}
.tresult-log-row:hover{background:rgba(255,255,255,0.06);}
.tresult-dir-tag{display:inline-block;padding:2px 7px;border-radius:5px;font-size:10px;font-weight:700;color:#fff;}
.tresult-dir-tag.long{background:var(--up);}
.tresult-dir-tag.short{background:var(--dn);}
.tresult-close-btn{width:100%;max-width:1200px;margin-top:8px;padding:15px;background:var(--blue);border:none;border-radius:14px;color:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 6px 20px rgba(37,99,235,0.4);}
.tresult-empty{text-align:center;color:var(--t2);padding:80px 20px;font-size:14px;font-weight:500;}
.tresult-curve-split{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
.butterfly-hdr{display:grid;grid-template-columns:1fr 70px 1fr;align-items:center;margin-bottom:8px;padding:0 4px;text-align:center;}
.butterfly-rows{display:flex;flex-direction:column;gap:4px;max-height:600px;overflow-y:auto;}
.butterfly-row{display:grid;grid-template-columns:1fr 70px 1fr;align-items:center;min-height:30px;}
.butterfly-side{display:flex;align-items:center;height:26px;}
.butterfly-side.left{justify-content:flex-end;gap:6px;}
.butterfly-side.right{justify-content:flex-start;gap:6px;}
.butterfly-bar{height:100%;border-radius:4px;min-width:4px;cursor:pointer;}
.butterfly-count{font-size:10px;font-weight:700;color:#fff;min-width:14px;text-align:center;}
.butterfly-count.dim{color:var(--t3);font-weight:400;}
.butterfly-label{text-align:center;font-size:10px;font-weight:700;font-variant-numeric:tabular-nums;padding:2px 6px;border-radius:5px;background:var(--bg3);}
.butterfly-label.pos{color:#22c55e;}
.butterfly-label.neg{color:#ef4444;}
.tresult-daterange{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:14px;padding:8px;background:var(--bg2);border-radius:10px;border:1px solid var(--b1);flex-wrap:wrap;}
.tresult-daterange-lbl{font-size:11px;color:var(--t2);font-weight:600;}
.tresult-date-inp{padding:5px 8px;font-size:11px;border-radius:6px;border:1px solid var(--b2);background:var(--bg3);color:var(--t1);font-family:inherit;}
.tresult-apply-btn{padding:5px 12px;font-size:11px;border-radius:6px;border:none;background:var(--blue);color:#fff;font-weight:600;cursor:pointer;font-family:inherit;}
.tresult-reset-range-btn{padding:5px 12px;font-size:11px;border-radius:6px;border:1px solid var(--b2);background:var(--bg3);color:var(--t2);cursor:pointer;font-family:inherit;}
.tresult-daylog-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;font-size:12px;padding:10px 8px;border-bottom:1px solid var(--b1);align-items:center;border-radius:6px;font-weight:600;}
.tresult-daylog-row.hdr{color:var(--t3);font-weight:700;border-bottom:1px solid var(--b2);font-size:10px;letter-spacing:.3px;}
.tresult-daylog-row.win{background:rgba(34,197,94,0.07);}
.tresult-daylog-row.loss{background:rgba(239,68,68,0.07);}
.tresult-daylog-row:not(.hdr){cursor:pointer;}
.tresult-daylog-row:not(.hdr):hover{background:rgba(255,255,255,0.08);}
/* Day lots detail modal */
.day-lots-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:9998;display:none;align-items:center;justify-content:center;padding:20px;}
.day-lots-modal-overlay.show{display:flex;}
.day-lots-modal{background:var(--bg2);border:1px solid var(--b2);border-radius:14px;width:100%;max-width:800px;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.6);}
.day-lots-modal-hdr{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--b1);flex-shrink:0;gap:10px;}
.day-lots-nav-btn{flex-shrink:0;width:34px;height:34px;border-radius:8px;background:var(--bg3);border:1px solid var(--b2);color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;}
.day-lots-nav-btn:hover{background:var(--b2);}
.day-lots-nav-btn:disabled{opacity:0.3;cursor:not-allowed;}
.day-lots-modal-hdr-mid{flex:1;min-width:0;text-align:center;}
.day-lots-modal-title{font-size:15px;font-weight:800;color:#fff;}
.day-lots-modal-sub{font-size:11px;color:var(--t3);margin-top:2px;}
.day-lots-modal-close{cursor:pointer;font-size:18px;color:var(--t3);padding:4px 8px;}
.day-lots-modal-close:hover{color:#fff;}
.day-lots-modal-body{overflow-y:auto;overflow-x:auto;padding:10px 14px 16px;flex:1;min-height:0;}
.day-lots-row{display:grid;grid-template-columns:32px 32px 52px 58px 52px 58px 42px 55px 48px 48px;gap:5px;font-size:10px;padding:8px 5px;border-bottom:1px solid var(--b1);align-items:center;font-variant-numeric:tabular-nums;white-space:nowrap;}
.day-lots-row.hdr{color:var(--t3);font-weight:700;font-size:9.5px;border-bottom:1px solid var(--b2);}
.day-lots-row.win{background:rgba(34,197,94,0.06);}
.day-lots-row.loss{background:rgba(239,68,68,0.06);}
/* Clickable trade detail popup */
.trade-detail-popover{position:fixed;background:var(--bg2);border:1px solid var(--b2);border-radius:10px;padding:12px;z-index:9999;box-shadow:0 12px 40px rgba(0,0,0,.8);display:none;max-width:300px;max-height:80vh;overflow-y:auto;font-size:11px;}
.trade-detail-popover.show{display:block;}
.trade-detail-row{display:flex;justify-content:space-between;padding:3px 0;color:var(--t2);}
.trade-detail-row b{color:#fff;}
.trade-detail-close{text-align:center;font-size:9px;color:var(--t3);margin-top:8px;cursor:pointer;}
.trade-detail-legs-title{font-size:10px;color:var(--t3);font-weight:700;margin:10px 0 4px;padding-top:8px;border-top:1px solid var(--b1);}
.trade-detail-leg-row{display:flex;justify-content:space-between;align-items:center;font-size:10px;padding:4px 6px;border-radius:5px;background:var(--bg3);margin-bottom:3px;}
.trade-detail-leg-row.entry{border-left:3px solid var(--up);}
.trade-detail-leg-row.exit{border-left:3px solid #a855f7;}
.trade-detail-leg-tag{font-weight:700;font-size:9.5px;flex-shrink:0;width:34px;}
.trade-detail-leg-tag.entry{color:var(--up);}
.trade-detail-leg-tag.exit{color:#a855f7;}
.simple-tip-box{position:fixed;transform:translate(-50%,-100%);background:rgba(20,20,24,0.97);color:#fff;font-size:11px;font-weight:600;padding:7px 12px;border-radius:8px;z-index:10000;display:none;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.15);pointer-events:none;}
.simple-tip-box.show{display:block;animation:tipFadeIn .15s ease-out;}
.chart-info-panel{background:rgba(250,204,21,0.08);border:1px solid rgba(250,204,21,0.3);border-radius:8px;padding:8px 12px;font-size:11.5px;color:var(--t2);margin-bottom:8px;font-weight:600;min-height:16px;}
.chart-info-panel.active{color:#fff;border-color:rgba(250,204,21,0.55);}
.chart-info-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;}
.chart-info-stat{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.08);border-radius:6px;padding:5px 11px;}
.chart-info-lbl{font-size:9.5px;font-weight:700;letter-spacing:.3px;}
.chart-info-val{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;}
@keyframes tipFadeIn{from{opacity:0;transform:translate(-50%,-95%);}to{opacity:1;transform:translate(-50%,-100%);}}
/* Ranking page */
.ranking-section{margin-bottom:18px;}
.ranking-section-title{font-size:13px;font-weight:700;color:var(--t1);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.ranking-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.ranking-card{background:var(--bg2);border:1px solid var(--b1);border-radius:10px;padding:12px;position:relative;cursor:pointer;}
.ranking-card:hover{border-color:var(--blue);}
.ranking-medal{font-size:18px;position:absolute;top:8px;right:10px;}
.ranking-rank{font-size:10px;color:var(--t3);margin-bottom:4px;}
.ranking-val{font-size:18px;font-weight:800;margin-bottom:6px;}
.ranking-meta{font-size:9.5px;color:var(--t2);line-height:1.5;}
.ranking-zone{border-radius:18px;padding:18px;margin-bottom:18px;}
.ranking-zone.zone-profit{background:rgba(239,68,68,0.06);border:1.5px solid rgba(239,68,68,0.25);}
.ranking-zone.zone-loss{background:rgba(34,197,94,0.06);border:1.5px solid rgba(34,197,94,0.25);}
.ranking-zone.zone-qty{background:rgba(255,255,255,0.03);border:1.5px solid rgba(255,255,255,0.1);}
.ranking-zone.zone-risk{background:rgba(245,158,11,0.07);border:1.5px solid rgba(245,158,11,0.28);}
.ranking-zone.zone-giveback{background:rgba(168,85,247,0.07);border:1.5px solid rgba(168,85,247,0.28);}
.ranking-zone.zone-notrade{background:rgba(255,255,255,0.03);border:1.5px solid rgba(255,255,255,0.1);}
.ranking-zone-title{font-size:15px;font-weight:800;color:#fff;margin-bottom:14px;letter-spacing:.3px;}
.ranking-zone .ranking-section{background:rgba(0,0,0,0.2);box-shadow:none;}
.ranking-zone .ranking-section:last-child{margin-bottom:0;}
.ranking-pnl-sub{font-size:10px;margin-top:5px;font-weight:700;}
.notrade-days-wrap{display:flex;flex-direction:column;gap:8px;}
.notrade-days-summary{font-size:12px;color:var(--t2);}
.notrade-days-summary b{color:#fff;font-size:15px;}
.notrade-days-list{display:flex;flex-wrap:wrap;gap:6px;max-height:180px;overflow-y:auto;}
.notrade-day-chip{background:var(--bg2);border:1px solid var(--b1);border-radius:8px;padding:6px 10px;font-size:11px;color:var(--t2);font-weight:600;}
/* Trade markers on chart */
.trade-marker-tip{position:absolute;background:rgba(255,255,255,0.95);color:#000;font-size:9px;font-weight:700;padding:3px 6px;border-radius:4px;pointer-events:none;z-index:50;white-space:nowrap;display:none;}
/* Result tabs */
.tresult-tabs{display:flex;gap:8px;margin-bottom:18px;justify-content:center;}
.tresult-tab{padding:10px 22px;border-radius:10px;border:1px solid var(--b2);background:var(--bg3);color:var(--t2);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s;}
.tresult-tab.on{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(37,99,235,0.4);}
.tresult-page{display:none;}
.tresult-page.show{display:block;}
/* Trade replay list+detail */
.treplay-layout{display:grid;grid-template-columns:220px 1fr;gap:12px;align-items:stretch;height:70vh;min-height:400px;max-height:900px;}
.treplay-left{width:220px;flex-shrink:0;display:flex;flex-direction:column;gap:10px;min-height:0;height:100%;}
.treplay-list{flex:1 1 auto;min-height:80px;overflow-y:auto;background:var(--bg2);border:1px solid var(--b1);border-radius:10px;padding:6px;}
.treplay-item{padding:8px 8px;border-radius:6px;cursor:pointer;margin-bottom:3px;font-size:10px;}
.treplay-item:hover{background:var(--bg3);}
.treplay-item.sel{background:rgba(37,99,235,0.25);border:1px solid var(--blue);}
.treplay-item-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;}
.treplay-item-idx{font-size:9px;color:var(--t3);font-weight:700;}
.treplay-item-date{color:var(--t3);font-size:9px;}
.treplay-item-pnl{font-weight:700;}
.treplay-detail{flex:1;min-width:0;background:var(--bg2);border:1px solid var(--b1);border-radius:10px;padding:12px;height:100%;display:flex;flex-direction:column;min-height:0;}
.treplay-detail-hdr{font-size:13px;font-weight:800;color:#facc15;}
.treplay-canvas-multi{display:flex;flex-direction:column;gap:10px;flex:1;min-height:0;}
.treplay-canvas-wrap{position:relative;width:100%;flex:1;min-height:0;background:#0d0d0f;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;}
.treplay-canvas-hdr{padding:4px 8px;background:var(--bg2);border-bottom:1px solid var(--b1);display:flex;justify-content:space-between;align-items:center;flex-shrink:0;gap:8px;flex-wrap:wrap;}
.treplay-canvas-body{position:relative;flex:1;min-height:0;cursor:crosshair;}
.treplay-canvas-zoom{display:flex;gap:4px;flex-shrink:0;}
.treplay-canvas-zoom .zoom-btn{width:22px;height:22px;font-size:10px;background:rgba(255,255,255,0.06);}
.treplay-empty{text-align:center;color:var(--t3);padding:100px 20px;font-size:12px;}
.treplay-day-group{margin-bottom:6px;}
.treplay-day-hdr{display:flex;justify-content:space-between;align-items:center;padding:8px 6px;background:var(--bg3);border-radius:6px;cursor:pointer;font-size:10px;font-weight:700;color:#fff;margin-bottom:3px;}
.treplay-day-hdr.sel{background:rgba(37,99,235,0.3);border:1px solid var(--blue);}
.treplay-day-items{display:flex;flex-direction:column;gap:3px;}
.treplay-day-items.collapsed{display:none;}
.treplay-day-summary{flex-shrink:0;background:var(--bg2);border:1px solid var(--b1);border-radius:10px;padding:12px;}
.treplay-day-summary-title{font-size:11px;font-weight:800;color:#fff;margin-bottom:10px;}
.treplay-day-summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;}
.treplay-day-stat{background:rgba(0,0,0,0.2);border-radius:8px;padding:6px 8px;}
.treplay-day-stat-lbl{font-size:9px;color:var(--t3);margin-bottom:2px;}
.treplay-day-stat-val{font-size:12px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums;}
#loading{position:fixed;inset:0;background:#0d0d0f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:200;}
.ltxt{color:var(--t2);font-size:14px;}
.lbar{width:200px;height:3px;background:var(--b1);border-radius:2px;overflow:hidden;}
.lfill{height:100%;background:var(--blue);animation:ld 1.5s ease-in-out infinite;}
@keyframes ld{0%{width:0}50%{width:70%}100%{width:100%}}

/* ===== STORY LINE PANEL ===== */
.story-col{width:236px;flex-shrink:0;background:var(--bg2);border-left:1px solid var(--b1);display:flex;flex-direction:column;min-height:0;overflow:hidden;}
.story-col.hidden{display:none;}
.story-hdr{padding:7px 10px;border-bottom:1px solid var(--b1);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.story-hdr-title{font-size:12px;font-weight:700;color:#facc15;}
.story-scope{display:flex;gap:3px;}
.story-scope-btn{padding:3px 8px;font-size:10px;border-radius:5px;border:1px solid var(--b2);background:var(--bg3);color:var(--t2);cursor:pointer;font-family:inherit;}
.story-scope-btn.on{background:#facc15;border-color:#facc15;color:#000;font-weight:700;}
.story-input-area{padding:8px;border-bottom:1px solid var(--b1);display:flex;flex-direction:column;gap:6px;flex-shrink:0;}
.story-now-bar{display:flex;align-items:center;gap:4px;}
.story-now-chip{font-size:10px;font-weight:700;padding:3px 7px;border-radius:5px;background:var(--bg3);border:1px solid var(--b2);color:#fff;font-variant-numeric:tabular-nums;}
.story-now-chip.price{color:#facc15;}
.story-tf-sel{margin-left:auto;height:22px;font-size:10px;border-radius:5px;border:1px solid var(--b2);background:var(--bg3);color:var(--t1);font-family:inherit;padding:0 2px;}
.story-textarea{width:100%;min-height:58px;max-height:120px;resize:vertical;border-radius:7px;border:1px solid var(--b2);background:var(--bg3);color:var(--t1);font-family:inherit;font-size:12px;padding:7px 8px;line-height:1.45;}
.story-textarea:focus{outline:none;border-color:#facc15;}
.story-save-btn{width:100%;padding:8px 4px;border-radius:7px;border:none;background:#facc15;color:#000;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;}
.story-save-btn:active{opacity:.7;}
.story-timeline{flex:1;min-height:0;overflow-y:auto;padding:8px 8px 8px 6px;}
.story-empty{text-align:center;color:var(--t3);font-size:11px;padding:26px 8px;line-height:1.7;}
.story-day-lbl{font-size:10px;font-weight:700;color:var(--t3);padding:6px 2px 4px;letter-spacing:.5px;}
.story-note{position:relative;padding-left:14px;margin-bottom:8px;}
.story-note::before{content:'';position:absolute;left:3px;top:12px;width:7px;height:7px;border-radius:50%;background:#facc15;box-shadow:0 0 6px rgba(250,204,21,.6);}
.story-note::after{content:'';position:absolute;left:6px;top:22px;bottom:-10px;width:1px;background:var(--b2);}
.story-note:last-child::after{display:none;}
.story-note-card{background:var(--bg3);border:1px solid var(--b2);border-radius:8px;padding:6px 8px;cursor:pointer;}
.story-note-card:active{opacity:.75;}
.story-note-meta{display:flex;align-items:center;gap:5px;margin-bottom:3px;flex-wrap:wrap;}
.story-note-time{font-size:10px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums;}
.story-tf-badge{font-size:8.5px;font-weight:800;color:#fff;background:var(--blue);border-radius:4px;padding:1px 4px;letter-spacing:.3px;}
.story-note-price{font-size:10px;font-weight:700;color:#facc15;font-variant-numeric:tabular-nums;}
.story-note-acts{margin-left:auto;display:flex;gap:3px;}
.story-note-act{width:20px;height:20px;border-radius:4px;border:1px solid var(--b2);background:var(--bg2);color:var(--t2);font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
.story-note-text{font-size:11px;color:var(--t1);line-height:1.5;white-space:pre-wrap;word-break:break-word;}
.story-note-folder-tag{font-size:8.5px;color:#c4b5fd;background:rgba(124,58,237,.18);border:1px solid rgba(124,58,237,.45);border-radius:4px;padding:1px 5px;}
.story-backup-bar{display:flex;gap:6px;padding:7px 8px;border-top:1px solid var(--b1);flex-shrink:0;}
.story-backup-btn{flex:1;padding:6px 2px;font-size:10px;border-radius:6px;border:1px solid var(--b2);background:var(--bg3);color:var(--t2);cursor:pointer;font-family:inherit;}
/* ===== CLASSIFY MODAL ===== */
.scls-overlay{position:fixed;inset:0;background:radial-gradient(ellipse at top, #14141a 0%, #050508 70%);z-index:700;display:none;flex-direction:column;align-items:center;padding:18px 14px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
.scls-overlay.show{display:flex;}
.scls-card{width:100%;max-width:1200px;display:flex;flex-direction:column;min-height:0;flex:1;}
.scls-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-shrink:0;}
.scls-title{font-size:16px;font-weight:800;color:#fff;}
.scls-close{margin-left:auto;padding:7px 18px;border-radius:8px;border:1px solid var(--b2);background:var(--bg3);color:var(--t1);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.scls-back{padding:7px 14px;border-radius:8px;border:1px solid var(--b2);background:var(--bg3);color:var(--t1);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;display:none;}
.scls-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;flex-shrink:0;align-items:center;}
.scls-chip{display:flex;align-items:center;gap:5px;padding:5px 11px;border-radius:16px;border:1px solid var(--b2);background:var(--bg3);color:var(--t2);font-size:11px;font-weight:700;cursor:pointer;user-select:none;}
.scls-chip.on{background:#7c3aed;border-color:#7c3aed;color:#fff;}
.scls-chip-x{width:15px;height:15px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;line-height:1;}
.scls-chip-x:hover{background:#ef4444;}
.scls-newfolder{padding:5px 11px;border-radius:16px;border:1px dashed var(--b2);background:transparent;color:var(--t3);font-size:11px;cursor:pointer;font-family:inherit;}
.scls-page{flex:1;min-height:0;display:none;flex-direction:column;}
.scls-page.show{display:flex;}
.scls-list{flex:1;min-height:0;overflow-y:auto;background:var(--bg2);border:1px solid var(--b1);border-radius:10px;padding:10px;}
.scls-day-hdr{font-size:11px;font-weight:800;color:#facc15;padding:8px 2px 6px;letter-spacing:.5px;}
.scls-note-row{display:flex;align-items:flex-start;gap:8px;background:var(--bg3);border:1px solid var(--b2);border-radius:8px;padding:8px 10px;margin-bottom:6px;}
.scls-note-main{flex:1;min-width:0;cursor:pointer;}
.scls-note-side{display:flex;flex-direction:column;gap:5px;align-items:flex-end;flex-shrink:0;}
.scls-folder-sel{height:24px;font-size:10px;border-radius:5px;border:1px solid var(--b2);background:var(--bg2);color:var(--t1);font-family:inherit;max-width:120px;}
.scls-chart-btn{padding:4px 10px;font-size:10px;border-radius:5px;border:1px solid #7c3aed;background:rgba(124,58,237,.2);color:#c4b5fd;cursor:pointer;font-family:inherit;font-weight:700;}
/* ===== 📖 故事線 · 詳細編輯視窗 ===== */
.sne-ov{position:fixed;inset:0;z-index:900;display:none;flex-direction:column;background:rgba(4,4,8,.78);backdrop-filter:blur(5px);padding:14px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
.sne-ov.show{display:flex;}
.sne-shell{flex:1;min-height:0;width:100%;max-width:2200px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg2);border:1px solid var(--b1);border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.8);overflow:hidden;}
.sne-hdr{display:flex;align-items:center;gap:9px;padding:10px 14px;background:linear-gradient(90deg,rgba(250,204,21,.10),transparent 55%);border-bottom:1px solid var(--b1);flex-shrink:0;flex-wrap:wrap;}
.sne-hdr-title{font-size:14px;font-weight:800;color:#facc15;letter-spacing:.5px;}
.sne-chip{font-size:11px;font-weight:700;padding:4px 9px;border-radius:6px;background:var(--bg3);border:1px solid var(--b2);color:#fff;font-variant-numeric:tabular-nums;}
.sne-chip.price{color:#facc15;}
.sne-sel{height:26px;font-size:11px;border-radius:6px;border:1px solid var(--b2);background:var(--bg3);color:var(--t1);font-family:inherit;padding:0 4px;max-width:150px;}
.sne-lbl-sm{font-size:10px;color:var(--t3);}
.sne-dots{display:flex;gap:5px;align-items:center;}
.sne-dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--b2);background:transparent;transition:background .15s,border-color .15s,box-shadow .15s;}
.sne-hdr-acts{margin-left:auto;display:flex;gap:6px;}
.sne-btn{padding:6px 13px;border-radius:7px;border:1px solid var(--b2);background:var(--bg3);color:var(--t1);font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;}
.sne-btn:hover{border-color:#facc15;}
.sne-btn.primary{background:#facc15;border-color:#facc15;color:#000;}
.sne-btn.primary:hover{filter:brightness(1.08);}
.sne-bar{display:none;align-items:center;gap:9px;padding:7px 14px;background:rgba(250,204,21,.09);border-bottom:1px solid var(--b1);font-size:11px;color:#facc15;flex-shrink:0;}
.sne-bar.show{display:flex;}
.sne-bar.ok{background:rgba(56,189,248,.12);color:#38bdf8;}
.sne-status{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:20px;border:1px solid;letter-spacing:.3px;}
.sne-status.live{color:#38bdf8;border-color:rgba(56,189,248,.45);background:rgba(56,189,248,.12);}
.sne-status.lock{color:#facc15;border-color:rgba(250,204,21,.45);background:rgba(250,204,21,.12);}
.sne-status.edit{color:#a78bfa;border-color:rgba(167,139,250,.45);background:rgba(167,139,250,.12);}
.sne-btn.sm{padding:4px 10px;font-size:10.5px;}
.story-open-btn{width:100%;padding:9px 4px;border-radius:7px;border:1px solid #facc15;background:rgba(250,204,21,.14);color:#facc15;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;}
.story-open-btn.on{background:#facc15;color:#000;}

<script>
// ============================================================
// 資料來源設定：改成外部檔案 + Service Worker 本機快取，不再把資料塞進HTML本身
// 避免 GitHub Pages 部署67MB內嵌資料逾時的問題，也讓平板上第二次打開能瞬間載入
// ============================================================
const DATA_REPO_BASE = "https://raw.githubusercontent.com/sdkoppwdo/nq-replay/main/";
const DATA_BIN_URL = DATA_REPO_BASE + "data.bin";
const DATA_VERSION_URL = DATA_REPO_BASE + "version.json";
const UP='#ef4444',DN='#22c55e',CW=6,CG=2,PADDING_BARS=2;
let zoomLevel={'1k':1,'5k':1,'15k':1,'60k':1}; // multiplier: >1 = more bars (smaller), <1 = fewer bars (bigger)
let maConfig=[{p:5,c:'#f97316',on:true},{p:10,c:'#00bfff',on:true},{p:20,c:'#ff69b4',on:true},{p:60,c:'#ffff00',on:true}];
const PALETTE=['#ef4444','#fb923c','#f5c842','#22c55e','#14b8a6','#38bdf8','#3b82f6','#a78bfa','#ec4899','#ffffff','#fca5a5','#fdba74','#fde68a','#86efac','#99f6e4','#7dd3fc','#93c5fd','#c4b5fd','#f9a8d4','#94a3b8'];
const TF_ORDER=['1k','5k','15k','60k'];
const TF_LABELS={'1k':'1 分 K','5k':'5 分 K','15k':'15 分 K','60k':'60 分 K'};
const TF_STEP={'1k':10,'5k':6,'15k':4,'60k':5};
const TF_UNIT={'5k':5,'15k':15,'60k':60};

let DATA={},DAYS=[],DAYS_SET=new Set(),cur1=0,allBars={},mode1kBars=[],hoverBar=null,pickerIdx=-1,currentDay='';
let panOffset={};
let calYear=0,calMonth=0;
let selectedTFs=['1k'];

function setLoadingText(msg){
  const el = document.querySelector('#loading .ltxt');
  if(el) el.textContent = msg;
}

// 向 Service Worker 要求「強制重新抓資料、更新本機快取」，等它回報完成才 resolve
function requestDataRefresh(){
  return new Promise((resolve) => {
    if(!navigator.serviceWorker || !navigator.serviceWorker.controller){ resolve(false); return; }
    const handler = (e) => {
      if(e.data === 'DATA_REFRESHED'){
        navigator.serviceWorker.removeEventListener('message', handler);
        resolve(true);
      }
    };
    navigator.serviceWorker.addEventListener('message', handler);
    navigator.serviceWorker.controller.postMessage('REFRESH_DATA');
    setTimeout(() => resolve(false), 120000); // 120秒保底逾時，避免卡死
  });
}

async function loadData(){
  // 註冊 Service Worker（本機快取），失敗也不影響主流程，只是沒有離線/瞬間載入的效果
  if('serviceWorker' in navigator){
    try { await navigator.serviceWorker.register('./service-worker.js'); } catch(e){ console.warn('[SW] 註冊失敗，將直接用瀏覽器預設快取', e); }
  }

  // 檢查是否有新版本資料（這個檔案很小，每次都直接打網路，不走快取）
  let remoteVersion = null;
  try {
    setLoadingText('檢查資料版本...');
    const vResp = await fetch(DATA_VERSION_URL, {cache:'no-store'});
    if(vResp.ok){
      const vJson = await vResp.json();
      remoteVersion = vJson.version;
    }
  } catch(e){
    console.warn('[版本檢查] 無法連線，將使用本機快取的資料', e);
  }

  const cachedVersion = localStorage.getItem('nq_data_version');

  if(remoteVersion && cachedVersion && remoteVersion !== cachedVersion){
    setLoadingText('偵測到新資料，下載中...（第一次可能較久，之後會秒開）');
    const ok = await requestDataRefresh();
    if(ok) localStorage.setItem('nq_data_version', remoteVersion);
  } else if(remoteVersion && !cachedVersion){
    localStorage.setItem('nq_data_version', remoteVersion);
  }

  // 實際載入資料本體（有 Service Worker 時，這裡有快取會直接秒回，沒有才會真的打網路）
  setLoadingText('載入K棒資料中...（第一次載入可能需要一點時間）');
  const dataResp = await fetch(DATA_BIN_URL);
  if(!dataResp.ok) throw new Error('資料下載失敗：' + dataResp.status);
  const buf = await dataResp.arrayBuffer();
  setLoadingText('解壓縮資料中...');
  const jsonStr = pako.inflate(new Uint8Array(buf), {to:'string'});
  DATA = JSON.parse(jsonStr);
  DAYS = Object.keys(DATA).sort();
  DAYS_SET = new Set(DAYS);
  if(remoteVersion) localStorage.setItem('nq_data_version', remoteVersion);
}

async function manualRefreshData(){
  const btn = document.getElementById('btnRefreshData');
  if(btn){ btn.disabled = true; btn.textContent = '更新中...'; }
  try {
    await requestDataRefresh();
    localStorage.removeItem('nq_data_version'); // 強制下次版本檢查一定會重新比對
    alert('資料已更新，即將重新整理頁面');
    location.reload();
  } catch(e){
    alert('更新失敗，請檢查網路連線：' + e.message);
    if(btn){ btn.disabled = false; btn.textContent = '🔄 更新資料'; }
  }
}


function isDST(dateStr){
  const d=new Date(dateStr+'T12:00:00'),y=d.getFullYear();
  const mar=new Date(y,2,1);
  const dstStart=new Date(y,2,8+((7-mar.getDay())%7));
  const nov=new Date(y,10,1);
  const dstEnd=new Date(y,10,(7-nov.getDay())%7+1);
  return d>=dstStart&&d<dstEnd;
}
function getOpenTW(dateStr){return isDST(dateStr)?'21:00':'22:00';}
function getPreOpenTW(dateStr){return isDST(dateStr)?'16:00':'17:00';}

// Find 1K bar index for a given idx value
function idx1kFromGlobal(globalIdx){
  // binary search in mode1kBars
  let lo=0,hi=mode1kBars.length-1;
  while(lo<=hi){
    const mid=(lo+hi)>>1;
    const v=mode1kBars[mid].idx;
    if(v===globalIdx) return mid;
    if(v<globalIdx) lo=mid+1; else hi=mid-1;
  }
  // return closest
  return Math.min(lo,mode1kBars.length-1);
}

// Get live nK bar array using idx-based matching
function getLive(baseAll,cur1Bars,cur1Idx,unit){
  if(!baseAll.length||!cur1Bars.length) return baseAll;
  const cb=cur1Bars[cur1Idx];
  const cbIdx=cb.idx;
  let ci=-1;
  for(let i=0;i<baseAll.length;i++){
    const b=baseAll[i];
    if(b.idx<=cbIdx && cbIdx<=b.idx_end){ci=i;break;}
    if(b.idx>cbIdx){ci=Math.max(0,i-1);break;}
  }
  if(ci<0) ci=baseAll.length-1;
  const bucket=baseAll[ci];
  const win=cur1Bars.slice(0,cur1Idx+1).filter(b=>b.idx>=bucket.idx&&b.idx<=bucket.idx_end);
  if(!win.length) return baseAll.slice(0,ci);
  const liveClose=win[win.length-1].c;
  const lb={
    ts:bucket.ts,idx:bucket.idx,idx_end:bucket.idx_end,
    o:win[0].o,h:Math.max(...win.map(b=>b.h)),
    l:Math.min(...win.map(b=>b.l)),c:liveClose,
  };
  // 即時重算 MA
  const prev=baseAll.slice(0,ci);
  const closes=[...prev.map(b=>b.c),liveClose];
  const n=closes.length;
  const periods=[5,10,20,60];
  const keys=['m5','m10','m20','m60'];
  periods.forEach((p,mi)=>{
    if(n>=p){
      const sum=closes.slice(n-p).reduce((a,v)=>a+v,0);
      lb[keys[mi]]=Math.round(sum/p*1000)/1000;
    }
  });
  return [...prev,lb];
}

function findOpenIdx(bars,dateStr){
  const tw=getOpenTW(dateStr);
  const todayStartIdx=mode1kBars.length>0?mode1kBars[0].idx:0;
  let best=-1,bestDiff=Infinity;
  bars.forEach((b,i)=>{
    if(b.ts===tw){
      const diff=Math.abs(b.idx-todayStartIdx);
      if(diff<bestDiff){bestDiff=diff;best=i;}
    }
  });
  // 往前一根，讓起始點停在bucket邊界的最後一根（例如21:00前一根=20:59）
  // 這樣60K單獨播放下一根時，剛好是完整收盤的bucket
  if(best>0) best=best-1;
  return best>=0?best:0;
}

function loadDay(day){
  if(!DAYS_SET.has(day)) return;
  currentDay=day;
  const d=DATA[day]||{};
  allBars={'1k':d['1k']||[],'5k':d['5k']||[],'15k':d['15k']||[],'60k':d['60k']||[]};
  mode1kBars=allBars['1k'];
  cur1=0; // will be set after mode check
  hoverBar=null;panOffset={};
  selectedTFs.forEach(tf=>{panOffset[tf]=0;});
  updateDateDisplay();buildUI();
  cur1=getModeStartIdx();
  renderAll();
}

function updateDateDisplay(){
  document.getElementById('dateDisplay').textContent=
    new Date(currentDay+'T12:00:00').toLocaleDateString('zh-TW',{month:'2-digit',day:'2-digit'});
}
function goPrevDay(){const i=DAYS.indexOf(currentDay);if(i>0)loadDay(DAYS[i-1]);}
function goNextDay(){const i=DAYS.indexOf(currentDay);if(i<DAYS.length-1)loadDay(DAYS[i+1]);}

function toggleCal(){
  const popup=document.getElementById('calPopup');
  if(popup.classList.contains('show')){popup.classList.remove('show');return;}
  const d=new Date(currentDay+'T12:00:00');calYear=d.getFullYear();calMonth=d.getMonth();
  renderCal();
  const r=document.getElementById('dateDisplay').getBoundingClientRect();
  popup.style.left=Math.min(r.left,window.innerWidth-220)+'px';
  popup.style.top=(r.bottom+6)+'px';

}
function renderCal(){
  const months=['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  document.getElementById('calMonth').textContent=`${calYear} ${months[calMonth]}`;
  const grid=document.getElementById('calGrid');grid.innerHTML='';
  ['日','一','二','三','四','五','六'].forEach(d=>{const el=document.createElement('div');el.className='cal-dow';el.textContent=d;grid.appendChild(el);});
  const first=new Date(calYear,calMonth,1).getDay();
  const dim=new Date(calYear,calMonth+1,0).getDate();
  for(let i=0;i<first;i++){const el=document.createElement('div');el.className='cal-day';grid.appendChild(el);}
  for(let d=1;d<=dim;d++){
    const ds=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const el=document.createElement('div');el.textContent=d;
    let cls='cal-day';

      el.addEventListener('click',()=>{loadDay(ds);document.getElementById('calPopup').classList.remove('show');});}
    el.className=cls;grid.appendChild(el);
  }

document.getElementById('calPrev').addEventListener('click',()=>{calMonth--;if(calMonth<0){calMonth=11;calYear--;}renderCal();});
document.getElementById('calNext').addEventListener('click',()=>{calMonth++;if(calMonth>11){calMonth=0;calYear++;}renderCal();});
document.addEventListener('click',e=>{

function renderAll(){

    drawChart('cv_'+tf,bars,cursor,TF_STEP[tf],panOffset[tf]||0);

function drawChart(id,bars,cursor,timeStep,pan){
  const cv=document.getElementById(id);
  if(!cv||!bars.length) return;
  const tfKey=id.replace('cv_','');
  const zoom=zoomLevel[tfKey]||1;
  const CW2=Math.max(2,Math.round(6*zoom)), CG2=Math.max(1,Math.round(2*zoom)), CS=CW2+CG2;
  const wrap=cv.parentElement;
  const dpr=window.devicePixelRatio||2;
  const W=wrap.clientWidth||200,H=wrap.clientHeight||200;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
  const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
  ctx.fillStyle='#0d0d0f';ctx.fillRect(0,0,W,H);
  const vis=bars.slice(0,cursor+1);
  if(!vis.length) return;
  const P={t:10,r:62,b:22,l:2};
  const cW2=W-P.l-P.r,cH=H-P.t-P.b;
  const mxC=Math.floor(cW2/CS)-PADDING_BARS;
  const panC=Math.max(0,Math.min(pan,vis.length-1));
  const endIdx=Math.max(0,vis.length-1-panC);
  const startIdx=Math.max(0,endIdx-mxC+1);
  const view=vis.slice(startIdx,endIdx+1);
  if(!view.length) return;

  const allP=view.flatMap(b=>[b.h,b.l]);
  let lo=Math.min(...allP),hi=Math.max(...allP);
  const pd=(hi-lo)*0.08||1;lo-=pd;hi+=pd;
  const rng=hi-lo||1;
  const Y=p=>P.t+cH*(1-(p-lo)/rng);
  // Anchor: rightmost bar at fixed X position
  const rightAnchorX=W-P.r-PADDING_BARS*CS-CW2/2;
  const X=i=>rightAnchorX-(view.length-1-i)*CS;
  cv._layout={P,W,H,lo,hi,rng,startIdx,endIdx,view,vis,Y,X,cH,timeStep,pan:panC};

  // grid
  for(let i=0;i<=4;i++){
    const y=P.t+cH*i/4,price=hi-rng*i/4;
    ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.lineWidth=1;ctx.setLineDash([4,5]);
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(W-P.r,y);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='#d0d0e0';ctx.font='10px monospace';ctx.textAlign='left';
    ctx.fillText(price.toFixed(1),W-P.r+4,y+4);
  }

  // Day separator: draw line at EVERY session boundary
  const todayFirstIdx=mode1kBars.length>0?mode1kBars[0].idx:0;
  let todayMarked=false;
  for(let i=1;i<view.length;i++){
    const prevIdx=view[i-1].idx_end||view[i-1].idx;
    const currIdx=view[i].idx;
    if(currIdx-prevIdx>2){
      const sx=X(i);
      const isToday=currIdx>=todayFirstIdx&&!todayMarked;
      ctx.strokeStyle=isToday?'rgba(100,180,255,0.6)':'rgba(255,255,255,0.2)';
      ctx.lineWidth=isToday?1.5:1;ctx.setLineDash([5,4]);
      ctx.beginPath();ctx.moveTo(sx,P.t);ctx.lineTo(sx,H-P.b);ctx.stroke();ctx.setLineDash([]);
      if(isToday){
        ctx.fillStyle='rgba(100,180,255,0.9)';ctx.font='bold 9px sans-serif';ctx.textAlign='center';
        ctx.fillText('今日',sx,P.t+10);
        todayMarked=true;
      }
    }
  }

  const dst=isDST(currentDay);
  // 盤前箭頭
  const preOpenTW=getPreOpenTW(currentDay);
  // find today's preopen bar using idx
  const todayStart=mode1kBars.length>0?mode1kBars[0].idx:0;
  const poi=view.findIndex(b=>b.ts===preOpenTW&&b.idx>=todayStart);
  if(poi>=0){
    const px=X(poi),barTopY=Y(view[poi].h);
    const tip=barTopY-14,base=barTopY-4;
    ctx.fillStyle='#f5a623';
    ctx.beginPath();ctx.moveTo(px,base);ctx.lineTo(px-5,tip);ctx.lineTo(px+5,tip);ctx.closePath();ctx.fill();
    ctx.fillStyle='#f5a623';ctx.font='bold 8px sans-serif';ctx.textAlign='center';
    ctx.fillText('盤前',px,tip-3);
  }
  // 開盤箭頭
  const mktOpenTW=getOpenTW(currentDay);
  const moi=view.findIndex(b=>b.ts===mktOpenTW&&b.idx>=todayStart);
  if(moi>=0){
    const mx=X(moi),barTopY=Y(view[moi].h);
    const tip=barTopY-14,base=barTopY-4;
    ctx.fillStyle='#ffffff';
    ctx.beginPath();ctx.moveTo(mx,base);ctx.lineTo(mx-5,tip);ctx.lineTo(mx+5,tip);ctx.closePath();ctx.fill();
    ctx.fillStyle='#ffffff';ctx.font='bold 8px sans-serif';ctx.textAlign='center';
    ctx.fillText('開盤',mx,tip-3);
  }

  // K棒
  view.forEach((b,i)=>{
    const x=X(i),up=b.c>=b.o,col=up?UP:DN;
    ctx.strokeStyle=col;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x,Y(b.h));ctx.lineTo(x,Y(b.l));ctx.stroke();
    const t=Math.min(Y(b.o),Y(b.c)),bh=Math.max(Math.abs(Y(b.c)-Y(b.o)),1.5);
    ctx.fillStyle=col;ctx.fillRect(x-CW2/2,t,CW2,bh);
  });

  // MA (4 lines, with on/off toggle)
  const mk=['m5','m10','m20','m60'];
  maConfig.forEach((ma,mi)=>{
    if(!ma.on) return;
    ctx.strokeStyle=ma.c;ctx.lineWidth=mi===3?2:1.5;ctx.beginPath();
    let st=false;
    view.forEach((b,i)=>{
      const v=b[mk[mi]]??null;if(v==null) return;
      st?(ctx.lineTo(X(i),Y(v))):(ctx.moveTo(X(i),Y(v)),st=true);
    });
    ctx.stroke();
  });

  // current price tag
  if(panC===0){
    const last=view[view.length-1],ly=Y(last.c);
    ctx.strokeStyle='rgba(255,255,255,0.1)';ctx.lineWidth=1;ctx.setLineDash([3,3]);
    ctx.beginPath();ctx.moveTo(P.l,ly);ctx.lineTo(W-P.r,ly);ctx.stroke();ctx.setLineDash([]);
    const pc=last.c>=last.o?UP:DN;
    ctx.fillStyle=pc;ctx.fillRect(W-P.r+1,ly-9,P.r-3,18);
    ctx.fillStyle='#fff';ctx.font='bold 10px monospace';ctx.textAlign='left';
    ctx.fillText(last.c.toFixed(1),W-P.r+4,ly+4);
  }

  // time labels
  ctx.fillStyle='#d0d0e0';ctx.font='10px sans-serif';ctx.textAlign='center';
  view.forEach((b,i)=>{if((startIdx+i)%timeStep===0)ctx.fillText(b.ts,X(i),H-3);});

  // 交易進出場箭頭 (所有格局都顯示)
  if(tradeSystemOn && typeof getDayMarkers==='function'){
    const markers = getDayMarkers();
    const curTf = id.replace('cv_','');
    markers.forEach(m => {
      // 找出此markers的idx對應到當前格局的哪一根bar
      let vi = -1;
      if(curTf === '1k'){
        vi = view.findIndex(b => b.idx === m.idx);
      } else {
        // 對於5K/15K/60K，找idx落在該bucket範圍內的那根
        vi = view.findIndex(b => b.idx <= m.idx && m.idx <= (b.idx_end||b.idx));
      }
      if(vi < 0) return;
      const bar = view[vi];
      const x = X(vi);
      const label = m.type==='buy' ? '買進' : '賣出';
      if(m.type === 'buy'){
        const by = Y(bar.l) + 16;
        ctx.fillStyle = UP;
        ctx.beginPath();
        ctx.moveTo(x, by); ctx.lineTo(x-5, by+9); ctx.lineTo(x+5, by+9);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle='#fff';ctx.font='bold 8px sans-serif';ctx.textAlign='center';
        ctx.fillText(label,x,by+18);
      } else if(m.type === 'sell'){
        const sy = Y(bar.h) - 16;
        ctx.fillStyle = DN;
        ctx.beginPath();
        ctx.moveTo(x, sy); ctx.lineTo(x-5, sy-9); ctx.lineTo(x+5, sy-9);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle='#fff';ctx.font='bold 8px sans-serif';ctx.textAlign='center';
        ctx.fillText(label,x,sy-12);
      }
    });
  }

  // ✨ 故事線筆記（有筆記的K棒發亮）
  if(typeof storyNotes!=='undefined' && storyNotes[currentDay] && storyNotes[currentDay].length){
    const stf = id.replace('cv_','');
    const drawn = new Set();
    storyNotes[currentDay].forEach(n=>{
      let vi=-1;
      if(stf==='1k') vi=view.findIndex(b=>b.idx===n.idx);
      else vi=view.findIndex(b=>b.idx<=n.idx && n.idx<=(b.idx_end||b.idx));
      if(vi<0 || drawn.has(vi)) return;
      drawn.add(vi);
      const bar=view[vi], x=X(vi);
      const up=bar.c>=bar.o, col=up?UP:DN;
      const t=Math.min(Y(bar.o),Y(bar.c)), bh=Math.max(Math.abs(Y(bar.c)-Y(bar.o)),1.5);
      ctx.save();
      // 金色光暈：重繪這根K棒並加上發光效果（畫兩次讓光暈更明顯）
      ctx.shadowColor='#facc15';
      ctx.shadowBlur=14;
      for(let g=0; g<2; g++){
        ctx.strokeStyle=col;ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(x,Y(bar.h));ctx.lineTo(x,Y(bar.l));ctx.stroke();
        ctx.fillStyle=col;ctx.fillRect(x-CW2/2,t,CW2,bh);
      }
      // 外框描一圈金色，讓亮起的K棒更清楚
      ctx.shadowBlur=8;
      ctx.strokeStyle='rgba(250,204,21,0.9)';ctx.lineWidth=1.2;
      ctx.strokeRect(x-CW2/2-1,t-1,CW2+2,bh+2);
      ctx.restore();
    });
  }
}

function drawCrossOnChart(cvId,bi){
  const cv=document.getElementById(cvId+'_cross'),main=document.getElementById(cvId);
  if(!cv||!main||!main._layout) return;
  const L=main._layout,dpr=window.devicePixelRatio||2;
  cv.width=main.width;cv.height=main.height;cv.style.width=main.style.width;cv.style.height=main.style.height;
  const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);ctx.clearRect(0,0,L.W,L.H);
  const{P,W,H,view,X,Y}=L;
  if(bi<0||bi>=view.length) return;
  const bar=view[bi],sx=X(bi),closeY=Y(bar.c);
  ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=1;ctx.setLineDash([4,4]);
  ctx.beginPath();ctx.moveTo(sx,P.t);ctx.lineTo(sx,H-P.b);ctx.stroke();
  ctx.beginPath();ctx.moveTo(P.l,closeY);ctx.lineTo(W-P.r,closeY);ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='rgba(255,255,255,0.95)';ctx.fillRect(W-P.r+1,closeY-9,P.r-3,18);
  ctx.fillStyle='#000';ctx.font='bold 10px monospace';ctx.textAlign='left';
  ctx.fillText(bar.c.toFixed(1),W-P.r+4,closeY+4);
  const tlW=36,tlH=14,tlX=Math.max(tlW/2+P.l,Math.min(W-P.r-tlW/2,sx));
  ctx.fillStyle='rgba(255,255,255,0.95)';ctx.fillRect(tlX-tlW/2,H-P.b,tlW,tlH);
  ctx.fillStyle='#000';ctx.font='bold 9px sans-serif';ctx.textAlign='center';
  ctx.fillText(bar.ts,tlX,H-P.b+10);
}

// Cross sync using idx
function syncCrossFromIdx(globalIdx){
  // find 1K bar
  const i1k=idx1kFromGlobal(globalIdx);
  const bar1=mode1kBars[i1k];if(!bar1) return;

  // draw on 1K
  const main0=document.getElementById('cv_1k');
  if(main0&&main0._layout){
    const{startIdx,view}=main0._layout;
    const ri=i1k-startIdx;
    if(ri>=0&&ri<view.length) drawCrossOnChart('cv_1k',ri);
  }

  // sync to 5K/15K: find bar where idx <= globalIdx <= idx_end
  selectedTFs.filter(tf=>tf!=='1k').forEach(tf=>{
    const main=document.getElementById('cv_'+tf);
    if(!main||!main._layout) return;
    const{view}=main._layout;
    let best=view.length-1;
    for(let i=0;i<view.length;i++){
      const b=view[i];
      const bEnd=b.idx_end||b.idx;
      if(b.idx<=globalIdx&&globalIdx<=bEnd){best=i;break;}
      if(b.idx>globalIdx){best=Math.max(0,i-1);break;}
    }
    drawCrossOnChart('cv_'+tf,best);
  });

  hoverBar=bar1;updateInfoBar(bar1);
}

function updateChdrPrice(tf, bar){
  const priceEl=document.getElementById('price_'+tf);
  const priceValEl=document.getElementById('priceVal_'+tf);
  if(!priceEl||!priceValEl||!bar) return;
  const chg=bar.c-bar.o;
  const up=chg>=0;
  priceEl.className='chdr-price '+(up?'up':'dn');
  priceValEl.textContent=(up?'+':'')+chg.toFixed(2);
  priceValEl.style.color=up?'var(--up)':'var(--dn)';
  const wickUpEl=document.getElementById('wickUp_'+tf);
  const wickDnEl=document.getElementById('wickDn_'+tf);
  if(wickUpEl&&wickDnEl){
    const upperWick=Math.max(0, bar.h-Math.max(bar.o,bar.c));
    const lowerWick=Math.max(0, Math.min(bar.o,bar.c)-bar.l);
    wickUpEl.textContent=upperWick.toFixed(1);
    wickDnEl.textContent=lowerWick.toFixed(1);
  }
}

function handleCross(tf,xFrac){
  const main=document.getElementById('cv_'+tf);
  if(!main||!main._layout) return;
  const{W,view,X}=main._layout;
  const mx=xFrac*W;
  let bi=0,bd=1e9;
  view.forEach((_,i)=>{const d=Math.abs(X(i)-mx);if(d<bd){bd=d;bi=i;}});
  const bar=view[bi];if(!bar) return;
  // get globalIdx: for 1K use bar.idx, for 5K/15K use bar.idx (start of bucket)
  syncCrossFromIdx(bar.idx);

  // 更新所有顯示中格局的漲跌幅為對應十字線位置的bar
  selectedTFs.forEach(otherTf=>{
    const m=document.getElementById('cv_'+otherTf);
    if(!m||!m._layout) return;
    const{view:v}=m._layout;
    // find which bar in this tf's view corresponds to current crosshair position
    let targetBar=null;
    if(otherTf===tf){
      targetBar=bar;
    } else {
      // find bar whose idx range contains bar.idx
      for(let i=0;i<v.length;i++){
        const b=v[i];
        const bEnd=b.idx_end||b.idx;
        if(b.idx<=bar.idx&&bar.idx<=bEnd){targetBar=b;break;}
      }
      if(!targetBar) targetBar=v[v.length-1];
    }
    if(targetBar) updateChdrPrice(otherTf, targetBar);
  });
}

function clearAllCross(){
  selectedTFs.forEach(tf=>{
    const cv=document.getElementById('cv_'+tf+'_cross');
    if(cv) cv.getContext('2d').clearRect(0,0,cv.width,cv.height);
    // 恢復顯示各格局最新K棒的漲跌幅
    const bars=getBarsForTF(tf);
    const cursor=tf==='1k'?cur1:bars.length-1;
    if(bars[cursor]) updateChdrPrice(tf, bars[cursor]);
  });
  hoverBar=null;if(mode1kBars.length)updateInfoBar(mode1kBars[cur1]);
}

function xFracTo1kAbs(xFrac){
  const main=document.getElementById('cv_1k');
  if(!main||!main._layout) return -1;
  const{W,view,X,startIdx}=main._layout;
  const mx=xFrac*W;
  let bi=0,bd=1e9;
  view.forEach((_,i)=>{const d=Math.abs(X(i)-mx);if(d<bd){bd=d;bi=i;}});
  return startIdx+bi;
}

function attachEvents(wrap,tf){
  let rDrag=false,startX=0,startPan=0;
  wrap.addEventListener('contextmenu',e=>e.preventDefault());
  wrap.addEventListener('mousedown',e=>{if(e.button===2){rDrag=true;startX=e.clientX;startPan=panOffset[tf]||0;wrap.style.cursor='ew-resize';}});
  window.addEventListener('mousemove',e=>{if(!rDrag)return;panOffset[tf]=Math.max(0,startPan+Math.round((e.clientX-startX)/((6+2)*(zoomLevel[tf]||1))));renderAll();});
  window.addEventListener('mouseup',e=>{if(e.button===2&&rDrag){rDrag=false;wrap.style.cursor='crosshair';}});
  let tStartX=0,tStartPan=0,tTwo=false;
  wrap.addEventListener('touchstart',e=>{if(e.touches.length===2){tTwo=true;tStartX=(e.touches[0].clientX+e.touches[1].clientX)/2;tStartPan=panOffset[tf]||0;}},{passive:true});
  wrap.addEventListener('touchmove',e=>{
    if(tTwo&&e.touches.length===2){e.preventDefault();const cx=(e.touches[0].clientX+e.touches[1].clientX)/2;panOffset[tf]=Math.max(0,tStartPan+Math.round((cx-tStartX)/((6+2)*(zoomLevel[tf]||1))));renderAll();}
    else if(!tTwo&&e.touches.length===1){e.preventDefault();const t=e.touches[0],r=wrap.getBoundingClientRect();handleCross(tf,(t.clientX-r.left)/r.width);}
  },{passive:false});
  wrap.addEventListener('touchend',()=>{tTwo=false;wrap._panStart=null;clearAllCross();});
  wrap.addEventListener('mousemove',e=>{if(rDrag)return;const r=wrap.getBoundingClientRect();handleCross(tf,(e.clientX-r.left)/r.width);});
  wrap.addEventListener('mouseleave',()=>clearAllCross());
}

function toggleTF(tf,btn){
  if(currentMode==='browse'){
    // browse: only single TF, replace current
    selectedTFs=[tf];
    document.querySelectorAll('.tf-btn').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
    buildUI();
    if(mode1kBars.length) renderAll();
    return;
  }
  if(selectedTFs.includes(tf)){
    if(selectedTFs.length===1) return;
    selectedTFs=selectedTFs.filter(t=>t!==tf);
    btn.classList.remove('on');
  } else {
    if(selectedTFs.length>=4) return;
    selectedTFs.push(tf);
    btn.classList.add('on');
  }
  selectedTFs.sort((a,b)=>TF_ORDER.indexOf(a)-TF_ORDER.indexOf(b));
  buildUI();
  if(mode1kBars.length) renderAll();
}

const TF_UNITS_MAP={'1k':1,'5k':5,'15k':15,'60k':60};
function getSmallestTF(){
  const sorted=[...selectedTFs].sort((a,b)=>TF_UNITS_MAP[a]-TF_UNITS_MAP[b]);
  return sorted[0];
}
function step1kPerTFBar(tf){
  // how many 1K bars = 1 bar of tf
  return TF_UNITS_MAP[tf]||1;
}
// 找到 cur1 所在bar，往後跳到下N個「tf完整收盤」的位置
function moveNext(n){
  if(!mode1kBars.length) return;
  const tf=getSmallestTF();
  if(tf==='1k'){
    cur1=Math.min(cur1+n,mode1kBars.length-1);
  } else {
    const bars=allBars[tf];
    // find current bucket index in bars that contains cur1's idx
    const curIdxVal=mode1kBars[cur1].idx;
    let bucketPos=bars.findIndex(b=>b.idx<=curIdxVal && curIdxVal<=(b.idx_end||b.idx));
    if(bucketPos<0) bucketPos=0;
    const targetBucketPos=Math.min(bucketPos+n, bars.length-1);
    const targetBucket=bars[targetBucketPos];
    // move cur1 to the LAST 1K bar within that bucket (so it's fully closed)
    const targetIdxEnd=targetBucket.idx_end||targetBucket.idx;
    let newCur1=mode1kBars.findIndex(b=>b.idx===targetIdxEnd);
    if(newCur1<0){
      // fallback: find closest bar with idx<=targetIdxEnd
      for(let i=mode1kBars.length-1;i>=0;i--){
        if(mode1kBars[i].idx<=targetIdxEnd){newCur1=i;break;}
      }
    }
    cur1=Math.min(Math.max(newCur1,0),mode1kBars.length-1);
  }
  hoverBar=null;renderAll();
}
function movePrev(n){
  if(!mode1kBars.length) return;
  const tf=getSmallestTF();
  if(tf==='1k'){
    cur1=Math.max(0,cur1-n);
  } else {
    const bars=allBars[tf];
    const curIdxVal=mode1kBars[cur1].idx;
    let bucketPos=bars.findIndex(b=>b.idx<=curIdxVal && curIdxVal<=(b.idx_end||b.idx));
    if(bucketPos<0) bucketPos=0;
    const targetBucketPos=Math.max(bucketPos-n, 0);
    const targetBucket=bars[targetBucketPos];
    const targetIdxEnd=targetBucket.idx_end||targetBucket.idx;
    let newCur1=mode1kBars.findIndex(b=>b.idx===targetIdxEnd);
    if(newCur1<0){
      for(let i=mode1kBars.length-1;i>=0;i--){
        if(mode1kBars[i].idx<=targetIdxEnd){newCur1=i;break;}
      }
    }
    cur1=Math.min(Math.max(newCur1,0),mode1kBars.length-1);
  }
  hoverBar=null;renderAll();
}

  const tw = getPreOpenTW(dateStr);

  let best = 0;
  for(let i = 0; i < bars.length; i++) {

// 模擬單交易系統 (Day-trade only, resets each day)
// ============================================================
let tradeSystemOn = false;
let tradeQty = 1;
const TRADE_PT_VALUE = 2; // MNQ $2/point
const TRADE_COMMISSION_PER_LOT = 1; // 手續費：每口一買一賣(來回)共$1，即每邊$0.5
let dayPositions = {}; // {dateStr: [{dir,qty,entryPrice,entryTime,entryIdx}]}
let dayClosedTrades = {}; // {dateStr: [{dir,qty,entryPrice,exitPrice,entryTime,exitTime,pnl}]}
let tradeUndoStack = []; // 每次下單前的狀態快照，供「上一步」復原用
const TRADE_UNDO_MAX = 50; // 最多保留50步，避免無限增長

function zoomTF(tf, dir){
  // dir=1: 放大(較少K棒,CW變大), dir=-1: 縮小(較多K棒,CW變小)
  let z = zoomLevel[tf] || 1;
  z = dir === 1 ? z * 1.25 : z / 1.25;
  z = Math.max(0.3, Math.min(z, 3));
  zoomLevel[tf] = z;
  renderAll();
}

  if(tradeSystemOn) refreshTradePosDisplay();
}

function getDayPositions(){
  if(!dayPositions[currentDay]) dayPositions[currentDay] = [];
  return dayPositions[currentDay];
}
function getDayClosed(){
  if(!dayClosedTrades[currentDay]) dayClosedTrades[currentDay] = [];
  return dayClosedTrades[currentDay];
}

function getTradePrice(){
  if(!mode1kBars.length || cur1 < 0) return 0;

let dayMarkers = {}; // {dateStr: [{type:'buy'/'sell', idx, ts, price}]}
function getDayMarkers(){

  return dayMarkers[currentDay];
}

// 進行中的交易週期：累積加碼，直到完全平倉才產生一筆完整交易記錄
let dayActiveTrade = {}; // {dateStr: {dir, totalQty, weightedEntrySum, firstEntryTime, firstEntryIdx, legs:[{qty,price,time,idx,action}]}}

function getActiveTrade(){
  return dayActiveTrade[currentDay] || null;
}
function setActiveTrade(t){
  dayActiveTrade[currentDay] = t;
}
function clearActiveTrade(){
  delete dayActiveTrade[currentDay];
}

function tradeAction(action){
  if(!mode1kBars.length) return;

  // ★ 新增：下單前先存一份狀態快照，供「上一步」復原用
  tradeUndoStack.push(JSON.stringify({dayPositions, dayClosedTrades, dayMarkers, dayActiveTrade}));
  if(tradeUndoStack.length > TRADE_UNDO_MAX) tradeUndoStack.shift();

  const price = getTradePrice();
  const time = mode1kBars[cur1].ts;
  const idx = mode1kBars[cur1].idx;
  const qty = Math.max(1, parseInt(document.getElementById('tradeQty').value) || 1);

  if(action === 'buy' || action === 'sell'){
    getDayMarkers().push({type: action, idx, ts: time, price});

    const newDir = action === 'buy' ? 'long' : 'short';
    const opDir = newDir === 'long' ? 'short' : 'long';
    let remaining = qty;
    const positions = getDayPositions();
    const closed = getDayClosed();
    let active = getActiveTrade();

    // 1. 先抵消反方向部位（FIFO）
    while(remaining > 0 && positions.length > 0 && positions[0].dir === opDir){
      const p = positions[0];
      const offsetQty = Math.min(remaining, p.qty);

      p.qty -= offsetQty;
      remaining -= offsetQty;
      if(p.qty <= 0) positions.shift();

      // 累積到 active trade 的平倉腳（反方向動作視為部分平倉）
      if(active){
        active.legs.push({type:'exit', qty: offsetQty, price, time, idx});
        active.exitQtyDone = (active.exitQtyDone||0) + offsetQty;
      }
    }

    // 若該方向的 active trade 已完全平倉（部位清空），結算成一筆交易記錄
    if(positions.length === 0 && active){
      finalizeActiveTrade(active, closed);
      active = null;
      clearActiveTrade();
    }

    // 2. 剩餘部分建立/累加新方向倉位
    if(remaining > 0){
      positions.push({dir: newDir, qty: remaining, entryPrice: price, entryTime: time, entryIdx: idx});

      if(!active || active.dir !== newDir){
        // 開始新的交易週期
        active = {dir: newDir, legs: [{type:'entry', qty: remaining, price, time, idx}], exitQtyDone: 0};
        setActiveTrade(active);
      } else {
        // 同方向加碼，累積進active trade
        active.legs.push({type:'entry', qty: remaining, price, time, idx});
      }
    }

  } else if(action === 'flat'){
    const positions = getDayPositions();
    if(!positions.length) return;
    const posDir = positions[0].dir;
    const markerType = posDir === 'long' ? 'sell' : 'buy';
    getDayMarkers().push({type: markerType, idx, ts: time, price, isFlat: true});
    const closed = getDayClosed();
    let active = getActiveTrade();

    positions.forEach(p => {
      if(active) active.legs.push({type:'exit', qty: p.qty, price, time, idx});
    });
    dayPositions[currentDay] = [];

    if(active){
      finalizeActiveTrade(active, closed);
      clearActiveTrade();
    }
  }
  refreshTradePosDisplay();
  renderAll();
}

function undoTradeAction(){
  if(!tradeUndoStack.length){
    alert('沒有可以復原的操作了');
    return;
  }
  const snap = JSON.parse(tradeUndoStack.pop());
  dayPositions = snap.dayPositions;
  dayClosedTrades = snap.dayClosedTrades;
  dayMarkers = snap.dayMarkers;
  dayActiveTrade = snap.dayActiveTrade;
  refreshTradePosDisplay();
  renderAll();
}

function finalizeActiveTrade(active, closed){
  const entryLegs = active.legs.filter(l => l.type === 'entry');
  const exitLegs = active.legs.filter(l => l.type === 'exit');
  const totalEntryQty = entryLegs.reduce((a,l)=>a+l.qty,0);
  const totalExitQty = exitLegs.reduce((a,l)=>a+l.qty,0);
  if(totalEntryQty === 0) return;

  // 加權平均進場價
  const weightedEntryPrice = entryLegs.reduce((a,l)=>a+l.price*l.qty,0) / totalEntryQty;
  // 加權平均出場價
  const weightedExitPrice = totalExitQty > 0
    ? exitLegs.reduce((a,l)=>a+l.price*l.qty,0) / totalExitQty
    : weightedEntryPrice;

  const pts = active.dir === 'long' ? (weightedExitPrice - weightedEntryPrice) : (weightedEntryPrice - weightedExitPrice);
  const grossPnl = Math.round(pts * totalEntryQty * TRADE_PT_VALUE * 100) / 100;
  const commission = Math.round(totalEntryQty * TRADE_COMMISSION_PER_LOT * 100) / 100;
  const pnl = Math.round((grossPnl - commission) * 100) / 100;

  const firstEntry = entryLegs[0];
  const lastExit = exitLegs.length ? exitLegs[exitLegs.length-1] : firstEntry;

  closed.push({
    dir: active.dir,
    qty: totalEntryQty,
    entryPrice: weightedEntryPrice,
    entryTime: firstEntry.time,
    entryIdx: firstEntry.idx,
    exitPrice: weightedExitPrice,
    exitTime: lastExit.time,
    exitIdx: lastExit.idx,
    pnl, grossPnl, commission,
    date: currentDay,
    legs: active.legs // 保留腳位細節，供日後查看加碼明細
  });
}

function refreshTradePosDisplay(){
  if(!tradeSystemOn) return;
  const positions = getDayPositions();
  const qtyEl = document.getElementById('tradeCurQty');
  const pnlEl = document.getElementById('tradePnlLive');

  if(!positions.length){
    if(qtyEl){
      qtyEl.innerHTML = `口數：<span style="color:var(--t3)">0口</span>`;
    }
    if(pnlEl) pnlEl.textContent = '';
    return;
  }

  // 假設同一時間只會有單一方向(因為買賣會先互相抵消)，取第一筆的方向
  const dir = positions[0].dir;
  const totalQty = positions.reduce((a,p)=>a+p.qty,0);
  const qtyColor = dir === 'long' ? 'var(--up)' : 'var(--dn)';
  if(qtyEl){
    qtyEl.innerHTML = `口數：<span style="color:${qtyColor};font-weight:800;">+${totalQty}口</span>`;
  }

  const price = getTradePrice();
  let pnl = 0;
  positions.forEach(p => {
    const pts = p.dir === 'long' ? (price - p.entryPrice) : (p.entryPrice - price);
    pnl += pts * p.qty * TRADE_PT_VALUE;
  });
  if(pnlEl){
    pnlEl.textContent = `浮動 ${pnl>=0?'+':''}$${pnl.toFixed(0)}`;
    pnlEl.style.color = pnl >= 0 ? 'var(--up)' : 'var(--dn)';
  }
}

function buildRankingPage(){
  const page = document.getElementById('pageRanking');
  const trades = _allClosedTradesCache;
  if(!trades.length){
    page.innerHTML = '<div class="tresult-empty">尚無交易紀錄</div>';
    return;
  }

  const fmtFull = v => `${v>=0?'+':''}$${v.toFixed(0)}`;

  function rankCard(t, idx, valStr, valColor, opts){
    opts = opts || {};
    const medals = ['🥇','🥈','🥉'];
    const targetIdx = (t._origIdx !== undefined) ? t._origIdx : trades.indexOf(t);
    const pnlSub = opts.showPnl ? `<div class="ranking-pnl-sub" style="color:${t.pnl>=0?'var(--up)':'var(--dn)'}">損益 ${fmtFull(t.pnl)}</div>` : '';
    return `
    <div class="ranking-card" onclick="jumpToReplayTrade(${targetIdx})">
      <div class="ranking-medal">${medals[idx]||''}</div>
      <div class="ranking-rank">第 ${idx+1} 名</div>
      <div class="ranking-val" style="color:${valColor}">${valStr}</div>
      <div class="ranking-meta">
        ${t.date} ・ <span class="tresult-dir-tag ${t.dir}">${t.dir==='long'?'多':'空'}</span> ${t.qty}口<br>
        ${t.entryTime}@${t.entryPrice.toFixed(1)} → ${t.exitTime}@${t.exitPrice.toFixed(1)}
      </div>
      ${pnlSub}
    </div>`;
  }

  const tradesWithPerLot = trades.map((t,idx) => ({...t, perLot: t.pnl/t.qty, _origIdx: idx}));

  const topProfit = trades.slice().sort((a,b)=>b.pnl-a.pnl).slice(0,3);
  const topLoss = trades.slice().sort((a,b)=>a.pnl-b.pnl).slice(0,3);
  const topPerLotProfit = tradesWithPerLot.slice().sort((a,b)=>b.perLot-a.perLot).slice(0,3);
  const topPerLotLoss = tradesWithPerLot.slice().sort((a,b)=>a.perLot-b.perLot).slice(0,3);
  const topQtyMax = trades.slice().sort((a,b)=>b.qty-a.qty).slice(0,3);
  const topQtyMin = trades.slice().sort((a,b)=>a.qty-b.qty).slice(0,3);

  // 隱形風險：MAE（單筆持倉期間最大不利變動金額），不論最終輸贏，越負代表曾經扛過越大的帳面虧損
  const tradesWithMae = trades.map((t,idx) => ({...t, _origIdx: idx})).filter(t => (t.mae||0) < 0);
  const topMae = tradesWithMae.slice().sort((a,b)=>(a.mae||0)-(b.mae||0)).slice(0,3);

  // 回吐金額／回吐點數：只要求曾經有正向浮動獲利(MFE>0)，金額維持原邏輯不分輸贏
  const tradesWithGivebackAmt = trades.map((t,idx) => {
    const mfe = t.mfe || 0;
    const giveBackAmt = mfe > 0 ? (mfe - t.pnl) : 0;
    const giveBackPts = giveBackAmt / ((t.qty||1) * TRADE_PT_VALUE);
    return {...t, _origIdx: idx, giveBackAmt, giveBackPts, _mfe: mfe};
  }).filter(t => t._mfe > 0);
  const topGivebackAmt = tradesWithGivebackAmt.slice().sort((a,b)=>b.giveBackAmt-a.giveBackAmt).slice(0,3);
  const topGivebackPts = tradesWithGivebackAmt.slice().sort((a,b)=>b.giveBackPts-a.giveBackPts).slice(0,3);

  // 回吐比率：只看「最終有獲利出場」且曾經有正向浮動獲利(MFE>0)的單子，(MFE-實際損益)/MFE
  // 若混入最終虧損的單子，分母(MFE)可能很小、分子(MFE-pnl)因pnl為大負數而暴增，比率會失真超過100%甚至數百%
  const tradesWithGivebackRatio = trades.map((t,idx) => {
    const mfe = t.mfe || 0;
    const giveBackRatio = mfe > 0 ? ((mfe - t.pnl) / mfe * 100) : 0;
    return {...t, _origIdx: idx, giveBackRatio, _mfe: mfe};
  }).filter(t => t._mfe > 0 && t.pnl > 0);

  const tradeDates = new Set(trades.map(t=>t.date));

  }
}

// ★ 用JS精確計算「整個進場回顧區塊」在目前螢幕上還剩多少可用高度，直接設定給 .treplay-layout，
// 讓K線圖、當日統計、日期清單一次全部塞進同一screen，不用捲動外層對話框；
// 清單本身超出的部分才用自己的捲軸捲動（不會拖著圖表一起被捲走）
function syncReplayListHeight(){
  requestAnimationFrame(() => {
    const layout = document.querySelector('.treplay-layout');
    const summary = document.querySelector('.treplay-day-summary');
    const list = document.querySelector('.treplay-list');
    if(!layout) return;
    const rect = layout.getBoundingClientRect();
    const bottomMargin = 16; // 底部留一點空間，避免貼死邊緣
    const availableHeight = window.innerHeight - rect.top - bottomMargin;
    layout.style.height = Math.max(400, availableHeight) + 'px';
    // 清單本身也明確設定 max-height，確保捲動只發生在清單內部，不會撐開外層
    if(summary && list){
      const leftH = layout.clientHeight;
      const summaryH = summary.offsetHeight;
      const gap = 10;
      list.style.maxHeight = Math.max(80, leftH - summaryH - gap) + 'px';
    }
  });
}

function attachReplayCrosshair(tf){
  const bodyEl = document.getElementById('treplayCanvasBody_'+tf);
  if(!bodyEl) return;
  bodyEl.addEventListener('mousemove', e => {
    const r = bodyEl.getBoundingClientRect();
    handleReplayCross(tf, (e.clientX-r.left)/r.width);
  });
  bodyEl.addEventListener('mouseleave', () => clearAllReplayCross());
  bodyEl.addEventListener('touchmove', e => {
    if(e.touches.length!==1) return;
    e.preventDefault();
    const t = e.touches[0], r = bodyEl.getBoundingClientRect();
    handleReplayCross(tf, (t.clientX-r.left)/r.width);
  }, {passive:false});
  bodyEl.addEventListener('touchend', () => clearAllReplayCross());
}

function handleReplayCross(tf, xFrac){
  const main = document.getElementById('treplayCanvas_'+tf);
  if(!main || !main._layout) return;
  const {W, segment, X} = main._layout;
  const mx = xFrac*W;
  let bi=0, bd=1e9;
  segment.forEach((_,i)=>{const d=Math.abs(X(i)-mx); if(d<bd){bd=d;bi=i;}});
  const bar = segment[bi];
  if(!bar) return;
  // 用這根K棒的idx，同步到所有目前顯示中的格局（跟主面板十字線同步邏輯一樣）
  syncReplayCrossFromIdx(bar.idx);
}

function syncReplayCrossFromIdx(idx){
  selectedReplayTFs.forEach(otherTf => {
    const main = document.getElementById('treplayCanvas_'+otherTf);
    if(!main || !main._layout) return;
    const {segment} = main._layout;
    if(!segment.length) return;
    let best = segment.length-1;
    for(let i=0;i<segment.length;i++){
      const b = segment[i];
      const bEnd = b.idx_end||b.idx;
      if(b.idx<=idx && idx<=bEnd){ best=i; break; }
      if(b.idx>idx){ best=Math.max(0,i-1); break; }
    }
    drawReplayCross(otherTf, best);
    updateReplayChdrPrice(otherTf, segment[best]);
  });
}

function drawReplayCross(tf, bi){
  const main = document.getElementById('treplayCanvas_'+tf);
  const cv = document.getElementById('treplayCanvas_'+tf+'_cross');
  if(!cv || !main || !main._layout) return;
  const L = main._layout, dpr = window.devicePixelRatio||2;
  cv.width = main.width; cv.height = main.height; cv.style.width = main.style.width; cv.style.height = main.style.height;
  const ctx = cv.getContext('2d'); ctx.scale(dpr,dpr); ctx.clearRect(0,0,L.W,L.H);
  const {P,W,H,segment,X,Y} = L;
  if(bi<0 || bi>=segment.length) return;
  const bar = segment[bi], sx = X(bi), closeY = Y(bar.c);
  ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.lineWidth=1; ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.moveTo(sx,P.t); ctx.lineTo(sx,H-P.b); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(P.l,closeY); ctx.lineTo(W-P.r,closeY); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='rgba(255,255,255,0.95)'; ctx.fillRect(W-P.r+1,closeY-9,P.r-3,18);
  ctx.fillStyle='#000'; ctx.font='bold 10px monospace'; ctx.textAlign='left';
  ctx.fillText(bar.c.toFixed(1),W-P.r+4,closeY+4);
  const tlW=36, tlH=14, tlX=Math.max(tlW/2+P.l, Math.min(W-P.r-tlW/2, sx));
  ctx.fillStyle='rgba(255,255,255,0.95)'; ctx.fillRect(tlX-tlW/2,H-P.b,tlW,tlH);
  ctx.fillStyle='#000'; ctx.font='bold 9px sans-serif'; ctx.textAlign='center';
  ctx.fillText(bar.ts,tlX,H-P.b+10);
}

function clearAllReplayCross(){
  selectedReplayTFs.forEach(tf => {
    const cv = document.getElementById('treplayCanvas_'+tf+'_cross');
    if(cv) cv.getContext('2d').clearRect(0,0,cv.width,cv.height);
    const main = document.getElementById('treplayCanvas_'+tf);
    if(main && main._layout && main._layout.segment.length){
      updateReplayChdrPrice(tf, main._layout.segment[main._layout.segment.length-1]);
    }
  });
}

function updateReplayChdrPrice(tf, bar){
  const priceEl = document.getElementById('rprice_'+tf);
  const priceValEl = document.getElementById('rpriceVal_'+tf);
  if(!priceEl || !priceValEl || !bar) return;
  const chg = bar.c-bar.o, up = chg>=0;
  priceEl.className = 'chdr-price '+(up?'up':'dn');
  priceValEl.textContent = (up?'+':'')+chg.toFixed(2);
  priceValEl.style.color = up?'var(--up)':'var(--dn)';
  const wickUpEl = document.getElementById('rwickUp_'+tf);
  const wickDnEl = document.getElementById('rwickDn_'+tf);
  if(wickUpEl && wickDnEl){
    const upperWick = Math.max(0, bar.h-Math.max(bar.o,bar.c));
    const lowerWick = Math.max(0, Math.min(bar.o,bar.c)-bar.l);
    wickUpEl.textContent = upperWick.toFixed(1);
    wickDnEl.textContent = lowerWick.toFixed(1);
  }
}

function toggleReplayTF(tf){
  if(selectedReplayTFs.includes(tf)){
    if(selectedReplayTFs.length === 1) return; // 至少留一個
    selectedReplayTFs = selectedReplayTFs.filter(x=>x!==tf);
  } else {
    if(selectedReplayTFs.length >= 2) return; // 最多兩個同時顯示
    selectedReplayTFs.push(tf);

  selectedReplayTFs.sort((a,b)=>TF_ORDER.indexOf(a)-TF_ORDER.indexOf(b));
  document.querySelectorAll('#replayTFButtons .tresult-tab').forEach(el=>{

  if(sel){
