function addStoryFolder(){
  const name=prompt('新分類名稱（例如：開盤急殺V轉）：');
  if(name===null) return;
  const nn=name.trim();
  if(!nn) return;
  if(storyFolders.includes(nn)){alert('已有同名分類');return;}
  storyFolders.push(nn);
  saveStoryStorage();
  renderStoryClsChips(); renderStoryClsList();
}
function deleteStoryFolderByIdx(i){
  const name=storyFolders[i];
  if(name===undefined) return;
  let cnt=0;
  Object.keys(storyNotes).forEach(d=>storyNotes[d].forEach(n=>{if(noteInFolder(n,name))cnt++;}));
  const kids=childrenOf(name);
  let msg='確定刪除分類「'+name+'」？\n裡面的 '+cnt+' 個時間點會移出這個分類（筆記本身與其他分類不受影響）';
  if(kids.length) msg+='\n\n它底下的 '+kids.length+' 個子分類不會被刪除，會自動變成最上層分類。';
  if(!confirm(msg)) return;
  Object.keys(storyNotes).forEach(d=>storyNotes[d].forEach(n=>{
    if(noteInFolder(n,name)) setNoteFoldersArr(n, noteFolders(n).filter(f=>f!==name));
  }));
  if(clsReplayActive && clsReplayFolder===name){ exitClsReplay(); }
  // 子分類提升為最上層
  kids.forEach(k=>{ delete folderParents[k]; });
  storyFolders.splice(i,1);
  delete folderColors[name];
  delete folderParents[name];   // 自己若是某人的子分類，一併清掉
  delete folderCollapsed[name];
  // 篩選索引修正
  if(sclsFilter==='f:'+i) sclsFilter='__all__';
  else if(sclsFilter.startsWith('f:')){
    const fi=parseInt(sclsFilter.slice(2));
    if(fi>i) sclsFilter='f:'+(fi-1);
  }
  saveStoryStorage();
  renderStoryClsChips(); renderStoryClsList(); renderSmktList(); renderStoryTimeline();
}
function setSclsFilter(v){
  sclsFilter=v;
  renderStoryClsChips();
  if(document.getElementById('sclsPageMkt').classList.contains('show')) renderSmktList();
  else renderStoryClsList();
}
function renderStoryClsChips(){
  const el=document.getElementById('sclsSidebar');
  const cur=document.getElementById('sclsCurFolder');
  if(cur){
    let label='全部';
    if(sclsFilter==='__none__') label='未分類';
    else if(sclsFilter.startsWith('f:')){ const f=storyFolders[parseInt(sclsFilter.slice(2))]; label='📁 '+(f||'?'); }
    cur.textContent=label;
  }
  if(!el) return;
  // 全部 / 未分類（單行、無操作）
  const topItem=(active,label,onclick)=>
    '<div class="scls-side-item'+(active?' on':'')+'" onclick="'+onclick+'">'
    +'<div class="scls-side-row1"><span class="scls-side-caret blank"></span>'
    +'<span class="scls-side-label">'+label+'</span></div></div>';
  let top='';
  top+=topItem(sclsFilter==='__all__','全部',"setSclsFilter('__all__')");
  top+=topItem(sclsFilter==='__none__','未分類',"setSclsFilter('__none__')");
  // 資料夾樹（母 → 子，最多兩層）
  const renderFolderRow=(name,isChild)=>{
    const i=storyFolders.indexOf(name);
    const col=folderColor(name);
    const kids=childrenOf(name);
    const isParent=kids.length>0;
    // 摺疊箭頭（只有母分類有）
    const caret = isParent
      ? '<span class="scls-side-caret" title="'+(isCollapsed(name)?'展開':'收合')+'" onclick="event.stopPropagation();toggleFolderCollapse('+i+')">'+(isCollapsed(name)?'▶':'▼')+'</span>'
      : '<span class="scls-side-caret blank"></span>';
    const dot='<span class="scls-side-dot" style="background:'+col+'" title="設定顏色" onclick="event.stopPropagation();openFolderColorPicker('+i+',this)"></span>';
    const cntBadge = isParent ? '<span class="scls-side-cnt" title="'+kids.length+' 個子分類">'+kids.length+'</span>' : '';
    const label='<span class="scls-side-label">📁 '+escapeHtml(name)+'</span>';
    const row1='<div class="scls-side-row1">'+caret+dot+label+cntBadge+'</div>';
    // 上下移動：只在同一層（兄弟）之間
    const sibs=siblingsOf(name), si=sibs.indexOf(name);
    const canUp=si>0, canDown=si<sibs.length-1;
    let acts='<div class="scls-side-acts">';
    if(!isChild) acts+='<button class="scls-side-act" title="新增子分類" onclick="event.stopPropagation();addChildFolder('+i+')">＋子</button>';
    acts+='<button class="scls-side-act" title="移動到…（設為某分類的子分類，或移回最上層）" onclick="event.stopPropagation();openFolderParentPicker('+i+',this)">⤴</button>'
      +'<button class="scls-side-act" title="上移" '+(canUp?'':'disabled ')+'onclick="event.stopPropagation();moveStoryFolder('+i+',-1)">▲</button>'
      +'<button class="scls-side-act" title="下移" '+(canDown?'':'disabled ')+'onclick="event.stopPropagation();moveStoryFolder('+i+',1)">▼</button>'
      +'<button class="scls-side-act" title="修改名稱" onclick="event.stopPropagation();renameStoryFolderByIdx('+i+')">✎</button>'
      +'<button class="scls-side-act del" title="刪除分類" onclick="event.stopPropagation();deleteStoryFolderByIdx('+i+')">✕</button>'
      +'</div>';
    const on=sclsFilter==='f:'+i;
    return '<div class="scls-side-item'+(on?' on':'')+(isChild?' child':'')+'" onclick="setSclsFilter(\'f:'+i+'\')" '
      +(on?'':'style="border-left:3px solid '+col+'"')+'>'+row1+acts+'</div>';
  };
  let mid='';
  topFolders().forEach(pName=>{
    mid+=renderFolderRow(pName,false);
    if(!isCollapsed(pName)) childrenOf(pName).forEach(cName=>{ mid+=renderFolderRow(cName,true); });
  });
  if(!storyFolders.length) mid='<div class="scls-side-empty">還沒有分類<br>按下方＋新增</div>';
  // 記住目前分類清單的捲動位置，重繪後還原，避免點一下就跳回最上面
  const prevScroll=(document.getElementById('sclsSideScroll')||{}).scrollTop||0;
  el.innerHTML='<div class="scls-side-fixed">'+top+'</div>'
    +'<div class="scls-side-scroll" id="sclsSideScroll">'+mid+'</div>'
    +'<button class="scls-side-newbtn" onclick="addStoryFolder()">＋ 新增分類</button>';
  const ns=document.getElementById('sclsSideScroll');
  if(ns) ns.scrollTop=prevScroll;
}
// 收合／展開母分類
function toggleFolderCollapse(i){
  const name=storyFolders[i];
  if(name===undefined) return;
  if(folderCollapsed[name]) delete folderCollapsed[name];
  else folderCollapsed[name]=true;
  saveStoryStorage();
  renderStoryClsChips();
}
function renameStoryFolderByIdx(i){
  const old=storyFolders[i];
  if(old===undefined) return;
  const name=prompt('修改分類名稱：', old);
  if(name===null) return;
  const nn=name.trim();
  if(!nn){ alert('名稱不能空白'); return; }
  if(nn===old) return;
  if(storyFolders.includes(nn)){ alert('已有同名分類'); return; }
  storyFolders[i]=nn;
  if(folderColors[old]!==undefined){ folderColors[nn]=folderColors[old]; delete folderColors[old]; }
  // 子母關係搬到新名稱：自己是別人的子分類
  if(folderParents[old]!==undefined){ folderParents[nn]=folderParents[old]; delete folderParents[old]; }
  // 自己是母分類 → 底下子分類指向的母名稱也要改
  Object.keys(folderParents).forEach(k=>{ if(folderParents[k]===old) folderParents[k]=nn; });
  // 摺疊狀態
  if(folderCollapsed[old]!==undefined){ folderCollapsed[nn]=folderCollapsed[old]; delete folderCollapsed[old]; }
  if(clsReplayActive && clsReplayFolder===old){ clsReplayFolder=nn; updateClsReplayBar(); }
  // 同步更新所有筆記裡的舊分類名稱
  Object.keys(storyNotes).forEach(d=>storyNotes[d].forEach(n=>{
    const arr=noteFolders(n);
    if(arr.includes(old)) setNoteFoldersArr(n, arr.map(f=>f===old?nn:f));
  }));
  saveStoryStorage();
  renderStoryClsChips(); renderStoryClsList(); renderSmktList(); renderStoryTimeline();
}

// ---- 分類排序：在「同一層」之間上移 / 下移 ----
function moveStoryFolder(i, dir){
  const name=storyFolders[i];
  if(name===undefined) return;
  const sibs=siblingsOf(name);
  const si=sibs.indexOf(name), tj=si+dir;
  if(tj<0 || tj>=sibs.length) return;
  const other=sibs[tj];
  const ai=storyFolders.indexOf(name), aj=storyFolders.indexOf(other);
  const tmp=storyFolders[ai]; storyFolders[ai]=storyFolders[aj]; storyFolders[aj]=tmp;
  // 篩選索引跟著換
  if(sclsFilter==='f:'+ai) sclsFilter='f:'+aj;
  else if(sclsFilter==='f:'+aj) sclsFilter='f:'+ai;
  saveStoryStorage();
  renderStoryClsChips();
  if(document.getElementById('sclsPageMkt').classList.contains('show')) renderSmktList();
  else renderStoryClsList();
}

// ---- 新增子分類（建立在某母分類底下）----
function addChildFolder(parentIdx){
  const parent=storyFolders[parentIdx];
  if(parent===undefined) return;
  if(folderParent(parent)!==null){ alert('只能有兩層。請先把「'+parent+'」移回最上層，才能在它底下建子分類。'); return; }
  const name=prompt('在「'+parent+'」底下新增子分類，名稱：');
  if(name===null) return;
  const nn=name.trim();
  if(!nn) return;
  if(storyFolders.includes(nn)){ alert('已有同名分類'); return; }
  storyFolders.push(nn);
  folderParents[nn]=parent;
  delete folderCollapsed[parent]; // 展開母分類讓新子分類看得到
  saveStoryStorage();
  renderStoryClsChips(); renderStoryClsList(); renderSmktList(); renderStoryTimeline();
}

    // 可選的母分類＝所有最上層分類（排除自己）

          +'<span class="fpar-opt-dot" style="background:'+folderColor(t)+'"></span>'
          +'📁 '+escapeHtml(t)+(isCur?'　目前':'')+'</div>';
      });
    }else{
      h+='<div class="fpar-hint">目前沒有其他最上層分類可當母分類。</div>';
    }
  }
  list.innerHTML=h;
  const r=el.getBoundingClientRect(), pw=230;

  if(left+pw>window.innerWidth-8) left=Math.max(8, r.left-pw-6);
  if(top+300>window.innerHeight) top=Math.max(8, window.innerHeight-310);
  pop.style.cssText='left:'+left+'px;top:'+top+'px;width:'+pw+'px;';
  pop.classList.add('show');
}
function setFolderParent(i, parentIdxOrNull){
  const name=storyFolders[i];
  if(name===undefined){ closeFparPop(); return; }
  if(parentIdxOrNull===null){
    delete folderParents[name];
  }else{
    const parent=storyFolders[parentIdxOrNull];
    if(parent===undefined || parent===name){ closeFparPop(); return; }
    if(folderParent(parent)!==null){ alert('只能有兩層，不能移到「子分類」底下。'); return; }
    if(hasChildren(name)){ alert('「'+name+'」底下還有子分類，不能再變成別人的子分類。'); return; }
    folderParents[name]=parent;
    delete folderCollapsed[parent];
  }
  // 移到陣列尾端 → 在新的同層裡排到最後（順序可預期）
  const ai=storyFolders.indexOf(name);
  if(ai>=0){ storyFolders.splice(ai,1); storyFolders.push(name); }
  // 篩選失效就重設，避免指到錯的分類
  sclsFilter='__all__';
  saveStoryStorage();
  closeFparPop();
  renderStoryClsChips(); renderStoryClsList(); renderSmktList(); renderStoryTimeline();
}
function closeFparPop(){
  const pop=document.getElementById('fparPop');

}

});

// ---- 篩選後的時間點清單 ----
function getFilteredStoryNotes(){
  const out=[];
  Object.keys(storyNotes).sort().reverse().forEach(d=>{
    storyNotes[d].slice().sort((a,b)=>a.idx-b.idx).forEach(n=>{
      if(sclsFilter==='__none__' && noteFolders(n).length) return;
      if(sclsFilter.startsWith('f:')){
        const names=filterFolderNames(parseInt(sclsFilter.slice(2)));  // 母分類→含所有子分類
        if(!noteFolders(n).some(f=>names.includes(f))) return;
      }
      out.push({d, n});
    });
  });
  return out;
}

function renderSmktChartOnCanvas(canvasId, date, note, tf){
  const canvas=document.getElementById(canvasId);
  if(!canvas) return;
  const dayData=DATA[date];
  const paint=(msg)=>{
    const ctx=canvas.getContext('2d');
    canvas.width=canvas.clientWidth||300; canvas.height=canvas.clientHeight||150;
    ctx.fillStyle='#0d0d0f';ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#666';ctx.font='12px sans-serif';ctx.textAlign='center';
    ctx.fillText(msg, canvas.width/2, canvas.height/2);
  };
  if(!dayData){ paint('此日無資料'); return; }
  const dayBars=dayData[tf];
  if(!dayBars||!dayBars.length){ paint('此日無 '+tf.toUpperCase()+' 資料'); return; }

  // 找到筆記時間點對應的K棒
  let pos;
  if(tf==='1k') pos=dayBars.findIndex(b=>b.idx===note.idx);
  else {
    pos=dayBars.findIndex(b=>b.idx<=note.idx && note.idx<=(b.idx_end||b.idx));
    if(pos<0) pos=dayBars.findIndex(b=>b.idx>=note.idx);
  }
  if(pos<0) pos=dayBars.length-1;

  const basePadBars = tf==='1k' ? 150 : (tf==='5k' ? 100 : (tf==='15k' ? 70 : 150));
  const padBars=Math.max(2, Math.round(basePadBars/(smktZoomByTF[tf]||1)));
  const startPos=Math.max(0,pos-padBars);
  const endPos=Math.min(dayBars.length-1,pos+padBars);
  const segment=dayBars.slice(startPos,endPos+1);

  const wrapEl=canvas.parentElement;
  const dpr=window.devicePixelRatio||2;
  const W=wrapEl.clientWidth,H=wrapEl.clientHeight;
  canvas.width=W*dpr;canvas.height=H*dpr;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.fillStyle='#0d0d0f';ctx.fillRect(0,0,W,H);

  const P={t:16,r:60,b:24,l:4};
  const cw=(W-P.l-P.r)/segment.length;
  const allP=segment.flatMap(b=>[b.h,b.l]);
  let lo=Math.min(...allP),hi=Math.max(...allP);
  const pad=(hi-lo)*0.1||1; lo-=pad; hi+=pad;
  const rng=hi-lo||1;
  const Y2=p=>P.t+(H-P.t-P.b)*(1-(p-lo)/rng);
  const X2=i=>P.l+i*cw+cw/2;
  canvas._layout={P,W,H,segment,X:X2,Y:Y2};

  for(let i=0;i<=4;i++){
    const y=P.t+(H-P.t-P.b)*i/4, price=hi-rng*i/4;
    ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(W-P.r,y);ctx.stroke();
    ctx.fillStyle='#999';ctx.font='9px monospace';ctx.textAlign='left';
    ctx.fillText(price.toFixed(1),W-P.r+4,y+3);
  }

  segment.forEach((b,i)=>{
    const x=X2(i),up=b.c>=b.o,col=up?UP:DN;
    ctx.strokeStyle=col;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x,Y2(b.h));ctx.lineTo(x,Y2(b.l));ctx.stroke();
    const ty=Math.min(Y2(b.o),Y2(b.c)),bh=Math.max(Math.abs(Y2(b.c)-Y2(b.o)),1.2);
    ctx.fillStyle=col;ctx.fillRect(x-Math.max(cw*0.35,2),ty,Math.max(cw*0.7,4),bh);
  });

  const rmk=['m5','m10','m20','m60'];
  maConfig.forEach((ma,mi)=>{
    if(!ma.on) return;
    ctx.strokeStyle=ma.c;ctx.lineWidth=mi===3?1.8:1.2;ctx.beginPath();
    let st=false;
    segment.forEach((b,i)=>{
      const v=b[rmk[mi]]??null;if(v==null)return;
      st?(ctx.lineTo(X2(i),Y2(v))):(ctx.moveTo(X2(i),Y2(v)),st=true);
    });
    ctx.stroke();
  });

  // 📌 筆記時間點標記：金黃虛線 + 圖釘 + 價格點
  const relPos=pos-startPos;
  if(relPos>=0 && relPos<segment.length){
    const b=segment[relPos], x=X2(relPos);
    ctx.strokeStyle='rgba(250,204,21,0.55)';ctx.lineWidth=1.2;ctx.setLineDash([5,4]);
    ctx.beginPath();ctx.moveTo(x,P.t);ctx.lineTo(x,H-P.b);ctx.stroke();
    ctx.setLineDash([]);
    const py=Y2(+note.price);
    ctx.fillStyle='#facc15';
    ctx.beginPath();ctx.arc(x,py,3.5,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#000';ctx.lineWidth=1;ctx.stroke();
    ctx.textAlign='center';
    const lblW=44,lblX=Math.max(lblW/2+P.l,Math.min(W-P.r-lblW/2,x));
    ctx.fillStyle='rgba(250,204,21,0.95)';ctx.fillRect(lblX-lblW/2,H-P.b,lblW,14);
    ctx.fillStyle='#000';ctx.font='bold 9px sans-serif';
    ctx.fillText(note.ts,lblX,H-P.b+10);
  }
}
function attachSmktCrosshair(tf){
  const bodyEl=document.getElementById('smktCanvasBody_'+tf);
  if(!bodyEl) return;
  bodyEl.addEventListener('mousemove',e=>{
    const r=bodyEl.getBoundingClientRect();
    handleSmktCross(tf,(e.clientX-r.left)/r.width);
  });
  bodyEl.addEventListener('mouseleave',()=>clearAllSmktCross());
  bodyEl.addEventListener('touchmove',e=>{
    if(e.touches.length!==1) return;
    e.preventDefault();
    const t=e.touches[0],r=bodyEl.getBoundingClientRect();
    handleSmktCross(tf,(t.clientX-r.left)/r.width);
  },{passive:false});
  bodyEl.addEventListener('touchend',()=>clearAllSmktCross());
}
function handleSmktCross(tf,xFrac){
  const main=document.getElementById('smktCanvas_'+tf);
  if(!main||!main._layout) return;
  const {W,segment,X}=main._layout;
  const mx=xFrac*W;
  let bi=0,bd=1e9;
  segment.forEach((_,i)=>{const dd=Math.abs(X(i)-mx);if(dd<bd){bd=dd;bi=i;}});
  const bar=segment[bi];
  if(!bar) return;
  syncSmktCrossFromIdx(bar.idx);
}
function syncSmktCrossFromIdx(idx){
  selectedSmktTFs.forEach(tf=>{
    const main=document.getElementById('smktCanvas_'+tf);
    if(!main||!main._layout) return;
    const {segment}=main._layout;
    if(!segment.length) return;
    let best=segment.length-1;
    for(let i=0;i<segment.length;i++){
      const b=segment[i], bEnd=b.idx_end||b.idx;
      if(b.idx<=idx && idx<=bEnd){best=i;break;}
      if(b.idx>idx){best=Math.max(0,i-1);break;}
    }
    drawSmktCross(tf,best);
    updateSmktChdrPrice(tf,segment[best]);
  });
}
function drawSmktCross(tf,bi){
  const main=document.getElementById('smktCanvas_'+tf);
  const cv=document.getElementById('smktCanvas_'+tf+'_cross');
  if(!cv||!main||!main._layout) return;
  const L=main._layout,dpr=window.devicePixelRatio||2;
  cv.width=main.width;cv.height=main.height;cv.style.width=main.style.width;cv.style.height=main.style.height;
  const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);ctx.clearRect(0,0,L.W,L.H);
  const {P,W,H,segment,X,Y}=L;
  if(bi<0||bi>=segment.length) return;
  const bar=segment[bi],sx=X(bi),closeY=Y(bar.c);
  ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=1;ctx.setLineDash([4,4]);
  ctx.beginPath();ctx.moveTo(sx,P.t);ctx.lineTo(sx,H-P.b);ctx.stroke();
  ctx.beginPath();ctx.moveTo(P.l,closeY);ctx.lineTo(W-P.r,closeY);ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='rgba(255,255,255,0.95)';ctx.fillRect(W-P.r+1,closeY-9,P.r-3,18);
  ctx.fillStyle='#000';ctx.font='bold 10px monospace';ctx.textAlign='left';
  ctx.fillText(bar.c.toFixed(1),W-P.r+4,closeY+4);
  const tlW=36,tlH=14,tlX=Math.max(tlW/2+P.l,Math.min(W-P.r-tlW/2,sx));
  ctx.fillStyle='rgba(255,255,255,0.95)';ctx.fillRect(tlX-tlW/2,H-P.b,tlW,tlH);
  ctx.fillStyle='#000';ctx.font='bold 9px sans-serif';ctx.textAlign='center';
  ctx.fillText(bar.ts,tlX,H-P.b+10);
}
function clearAllSmktCross(){
  selectedSmktTFs.forEach(tf=>{
    const cv=document.getElementById('smktCanvas_'+tf+'_cross');
    if(cv) cv.getContext('2d').clearRect(0,0,cv.width,cv.height);
    const main=document.getElementById('smktCanvas_'+tf);
    if(main&&main._layout&&main._layout.segment.length){
      updateSmktChdrPrice(tf,main._layout.segment[main._layout.segment.length-1]);
    }
  });
}
function updateSmktChdrPrice(tf,bar){
  const priceEl=document.getElementById('sprice_'+tf);
  const priceValEl=document.getElementById('spriceVal_'+tf);
  if(!priceEl||!priceValEl||!bar) return;
  const chg=bar.c-bar.o,up=chg>=0;
  priceEl.className='chdr-price '+(up?'up':'dn');
  priceValEl.textContent=(up?'+':'')+chg.toFixed(2);
  priceValEl.style.color=up?'var(--up)':'var(--dn)';
}

</script>
