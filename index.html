    renderReplayChart(i);

}

function computeDaySummary(dateStr){
  const dayTrades = _allClosedTradesCache.filter(t => t.date === dateStr);
  if(!dayTrades.length) return null;
  const count = dayTrades.length;
  const realizedPnl = dayTrades.reduce((a,t)=>a+t.pnl,0);
  const totalQty = dayTrades.reduce((a,t)=>a+t.qty,0);
  const avgMae = dayTrades.reduce((a,t)=>a+(t.mae||0),0)/count;
  const avgMfe = dayTrades.reduce((a,t)=>a+(t.mfe||0),0)/count;
  const wins = dayTrades.filter(t=>t.pnl>0);
  const losses = dayTrades.filter(t=>t.pnl<0);
  const avgWinPts = wins.length ? wins.reduce((a,t)=>a+(t.pnl/(t.qty*TRADE_PT_VALUE)),0)/wins.length : 0;
  const avgLossPts = losses.length ? losses.reduce((a,t)=>a+(t.pnl/(t.qty*TRADE_PT_VALUE)),0)/losses.length : 0;
  const gbTrades = dayTrades.filter(t=>t.pnl>0 && (t.mfe||0)>0);
  const avgGiveback = gbTrades.length ? gbTrades.reduce((a,t)=>a+((t.mfe-t.pnl)/t.mfe*100),0)/gbTrades.length : 0;
  const rrTrades = dayTrades.filter(t=>(t.mae||0)<0);
  const avgIdealRR = rrTrades.length ? rrTrades.reduce((a,t)=>a+((t.mfe||0)/Math.abs(t.mae)),0)/rrTrades.length : 0;
  const avgActualRR = rrTrades.length ? rrTrades.reduce((a,t)=>a+(t.pnl/Math.abs(t.mae)),0)/rrTrades.length : 0;
  return {dateStr,count,realizedPnl,totalQty,avgMae,avgMfe,avgWinPts,avgLossPts,avgGiveback,avgIdealRR,avgActualRR,hasRR:rrTrades.length>0,hasGiveback:gbTrades.length>0};
}

// 通用繪圖函式：給定 canvas id 與時間框架，畫出該筆交易的局部K線圖
function renderReplayChartOnCanvas(canvasId, t, tf){
  const dayData = DATA[t.date];
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;
  if(!dayData){ return; }
  const dayBars = dayData[tf];
  if(!dayBars || !dayBars.length){
    const ctx = canvas.getContext('2d');
    canvas.width=canvas.clientWidth; canvas.height=canvas.clientHeight;
    ctx.fillStyle='#0d0d0f';ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#666';ctx.font='12px sans-serif';ctx.textAlign='center';
    ctx.fillText(`此日無 ${tf.toUpperCase()} 資料`, canvas.width/2, canvas.height/2);
    return;
  }

  function findBarPos(idx){
    if(idx === undefined || idx === null) return -1;
    let pos;
    if(tf === '1k'){
      pos = dayBars.findIndex(b => b.idx === idx);
    } else {
      pos = dayBars.findIndex(b => b.idx <= idx && idx <= (b.idx_end||b.idx));
      if(pos < 0) pos = dayBars.findIndex(b => b.idx >= idx);
    }
    return pos;
  }

  // 每一次進場/出場的腳位（若無 legs 細節則退回單一進出場）
  const legs = (t.legs && t.legs.length) ? t.legs : [
    {type:'entry', qty:t.qty, price:t.entryPrice, time:t.entryTime, idx:t.entryIdx},
    {type:'exit', qty:t.qty, price:t.exitPrice, time:t.exitTime, idx:t.exitIdx}
  ];
  const legPositions = legs.map(l => ({...l, pos: findBarPos(l.idx)})).filter(l => l.pos >= 0);
  if(!legPositions.length) return;

  const allPos = legPositions.map(l=>l.pos);
  const minPos = Math.min(...allPos), maxPos = Math.max(...allPos);

  const basePadBars = tf==='1k' ? 150 : (tf==='5k' ? 100 : (tf==='15k' ? 70 : 150));
  const padBars = Math.max(2, Math.round(basePadBars / (replayZoomByTF[tf]||1)));
  const startPos = Math.max(0, minPos - padBars);
  const endPos = Math.min(dayBars.length-1, maxPos + padBars);
  const segment = dayBars.slice(startPos, endPos+1);

  const wrap = canvas.parentElement;
  const dpr = window.devicePixelRatio || 2;
  const W = wrap.clientWidth, H = wrap.clientHeight;
  canvas.width = W*dpr; canvas.height = H*dpr;
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.fillStyle = '#0d0d0f'; ctx.fillRect(0,0,W,H);

  const P = {t:14, r:60, b:24, l:4};
  const cw = (W-P.l-P.r)/segment.length;
  const allP = segment.flatMap(b=>[b.h,b.l]);
  let lo=Math.min(...allP), hi=Math.max(...allP);
  const pad=(hi-lo)*0.1||1; lo-=pad; hi+=pad;
  const rng=hi-lo||1;
  const Y2 = p => P.t + (H-P.t-P.b)*(1-(p-lo)/rng);
  const X2 = i => P.l + i*cw + cw/2;
  canvas._layout = {P, W, H, segment, X: X2, Y: Y2};

  for(let i=0;i<=4;i++){
    const y=P.t+(H-P.t-P.b)*i/4, price=hi-rng*i/4;
    ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(W-P.r,y);ctx.stroke();
    ctx.fillStyle='#999';ctx.font='9px monospace';ctx.textAlign='left';
    ctx.fillText(price.toFixed(1),W-P.r+4,y+3);
  }

  segment.forEach((b,i)=>{
    const x=X2(i), up=b.c>=b.o, col=up?UP:DN;
    ctx.strokeStyle=col;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x,Y2(b.h));ctx.lineTo(x,Y2(b.l));ctx.stroke();
    const ty=Math.min(Y2(b.o),Y2(b.c)), bh=Math.max(Math.abs(Y2(b.c)-Y2(b.o)),1.2);
    ctx.fillStyle=col;ctx.fillRect(x-Math.max(cw*0.35,2),ty,Math.max(cw*0.7,4),bh);
  });

  const rmk=['m5','m10','m20','m60'];
  maConfig.forEach((ma,mi)=>{
    if(!ma.on) return;
    ctx.strokeStyle=ma.c;ctx.lineWidth=mi===3?1.8:1.2;ctx.beginPath();
    let st=false;
    segment.forEach((b,i)=>{
      const v=b[rmk[mi]]??null;if(v==null) return;
      st?(ctx.lineTo(X2(i),Y2(v))):(ctx.moveTo(X2(i),Y2(v)),st=true);
    });
    ctx.stroke();
  });

  // 畫出每一次進場/出場（若同一根K棒有多腳，用小偏移避免完全重疊）
  // 標籤位置：多單在箭頭右邊，空單在箭頭左邊；平倉沿用該筆交易原本的多/空方向
  const seenAtRelPos = {};
  const labelGap = 9;
  legPositions.forEach(l => {
    const relPos = l.pos - startPos;
    if(relPos < 0 || relPos >= segment.length) return;
    const b = segment[relPos];
    const stackKey = relPos+'_'+l.type;
    const stackN = seenAtRelPos[stackKey] || 0;
    seenAtRelPos[stackKey] = stackN + 1;
    const x = X2(relPos);
    const stackOffset = stackN * 13;
    const onRight = t.dir === 'long';
    const labelX = onRight ? x+labelGap : x-labelGap;

    if(l.type === 'entry'){
      const label = `${t.dir==='long'?'多':'空'}${l.qty}`;
      if(t.dir==='long'){
        const ey=Y2(b.l)+14+stackOffset;
        ctx.fillStyle=UP;ctx.beginPath();ctx.moveTo(x,ey);ctx.lineTo(x-6,ey+10);ctx.lineTo(x+6,ey+10);ctx.closePath();ctx.fill();
        ctx.fillStyle='#fff';ctx.font='bold 9px sans-serif';ctx.textAlign=onRight?'left':'right';ctx.fillText(label,labelX,ey+8);
      } else {
        const ey=Y2(b.h)-14-stackOffset;
        ctx.fillStyle=DN;ctx.beginPath();ctx.moveTo(x,ey);ctx.lineTo(x-6,ey-10);ctx.lineTo(x+6,ey-10);ctx.closePath();ctx.fill();
        ctx.fillStyle='#fff';ctx.font='bold 9px sans-serif';ctx.textAlign=onRight?'left':'right';ctx.fillText(label,labelX,ey-6);
      }
    } else {
      const label = `平${l.qty}`;
      // 出場一律用箭頭（倒三角），從上方指向出場價位，避免跟進場的三角形混淆但同樣是箭頭而非圓點
      const ey=Y2(b.c)-14-stackOffset;
      ctx.fillStyle='#a855f7';ctx.beginPath();ctx.moveTo(x,ey+10);ctx.lineTo(x-6,ey);ctx.lineTo(x+6,ey);ctx.closePath();ctx.fill();
      ctx.fillStyle='#fff';ctx.font='bold 9px sans-serif';ctx.textAlign=onRight?'left':'right';ctx.fillText(label,labelX,ey+3);
    }
  });

  ctx.fillStyle='#999';ctx.font='8px sans-serif';ctx.textAlign='center';
  segment.forEach((b,i)=>{if(i%5===0) ctx.fillText(b.ts,X2(i),H-6);});

  // 預設顯示區段最後一根K棒的漲跌/上下影線（尚未移動滑鼠時）
  if(segment.length) updateReplayChdrPrice(tf, segment[segment.length-1]);
}

// 共用：逐根K棒重播一筆交易(含分批進出場)的實際持倉口數與浮動損益
// onBar(hFloatDollar, lFloatDollar) 會在每根有實際持倉的K棒被呼叫一次
function walkTradeFloatingPnl(t, onBar){
  const dayBars = DATA[t.date] ? DATA[t.date]['1k'] : null;
  if(!dayBars) return;
  const entryPos = dayBars.findIndex(b => b.idx === t.entryIdx);
  const exitPos = dayBars.findIndex(b => b.idx === t.exitIdx);
  if(entryPos < 0 || exitPos < 0 || exitPos < entryPos) return;
  const segment = dayBars.slice(entryPos, exitPos+1);
  const legs = (t.legs && t.legs.length) ? t.legs.slice().sort((a,b)=>a.idx-b.idx) : [
    {type:'entry', qty:t.qty, price:t.entryPrice, idx:t.entryIdx},
    {type:'exit', qty:t.qty, price:t.exitPrice, idx:t.exitIdx}
  ];
  let openQty = 0, avgPrice = 0, legPtr = 0;
  segment.forEach(b => {
    // ★ 修正：進場要在「算這根K棒的浮動損益」之前套用（新增口數從這根開始要算風險）
    while(legPtr < legs.length && legs[legPtr].idx <= b.idx && legs[legPtr].type === 'entry'){
      const l = legs[legPtr];
      const newQty = openQty + l.qty;
      avgPrice = newQty > 0 ? (avgPrice*openQty + l.price*l.qty)/newQty : l.price;
      openQty = newQty;
      legPtr++;
    }
    if(openQty > 0){
      const hPts = t.dir === 'long' ? (b.h - avgPrice) : (avgPrice - b.l);
      const lPts = t.dir === 'long' ? (b.l - avgPrice) : (avgPrice - b.h);
      onBar(hPts * openQty * TRADE_PT_VALUE, lPts * openQty * TRADE_PT_VALUE);
    }
    // ★ 修正：出場要在「算完這根K棒的浮動損益」之後才套用，不然出場當根K棒的價格波動會被漏算，
    //   導致出場損益比記錄到的MAE還差這種矛盾的情況
    while(legPtr < legs.length && legs[legPtr].idx <= b.idx && legs[legPtr].type === 'exit'){
      const l = legs[legPtr];
      openQty = Math.max(0, openQty - l.qty);
      legPtr++;
    }
  });
}

// 精確版：逐根K棒模擬「當下實際持倉口數」隨加碼/減碼變化的浮動損益
// 修正原本 calcMaeMfe/calcSingleTradeMDD 的問題：分批進出場的交易不應該假裝從第一根K棒
// 就扛著「最終總口數」去承受整段期間的價格波動，而是要用當下實際口數去算每個時間點的風險
function calcMaeMfeAccurate(t){
  let bestFloat = -Infinity, worstFloat = Infinity;
  let peakFloat = -Infinity, mdd = 0;
  walkTradeFloatingPnl(t, (hFloat, lFloat) => {
    if(hFloat > bestFloat) bestFloat = hFloat;
    if(lFloat < worstFloat) worstFloat = lFloat;
    if(hFloat > peakFloat) peakFloat = hFloat;
    const dd1 = peakFloat - lFloat;
    const dd2 = peakFloat - hFloat;
    if(dd1 > mdd) mdd = dd1;
    if(dd2 > mdd) mdd = dd2;
  });
  return {
    mfe: Math.max(0, Math.round((bestFloat===-Infinity?0:bestFloat)*100)/100),
    mae: Math.min(0, Math.round((worstFloat===Infinity?0:worstFloat)*100)/100),
    singleMDD: Math.round((mdd<0?0:mdd)*100)/100
  };
}

// 簡化版：用於單一進出場(單一口數不隨時間變化)的區段，例如「每口明細」拆解後的單筆lot
// 這種情況沒有分批加碼問題，跟精確版算出來的結果會一致，保留給 decomposeTradeToLots 使用
function calcMaeMfe(t){
  // 用entryIdx到exitIdx之間的1K bars，計算持倉期間的MFE(最大有利)/MAE(最大不利)
  const dayBars = DATA[t.date] ? DATA[t.date]['1k'] : null;
  if(!dayBars) return {mfe:0, mae:0};
  const entryPos = dayBars.findIndex(b => b.idx === t.entryIdx);
  const exitPos = dayBars.findIndex(b => b.idx === t.exitIdx);
  if(entryPos < 0 || exitPos < 0 || exitPos < entryPos) return {mfe:0, mae:0};
  const segment = dayBars.slice(entryPos, exitPos+1);
  let bestPrice = t.dir === 'long' ? -Infinity : Infinity;
  let worstPrice = t.dir === 'long' ? Infinity : -Infinity;
  segment.forEach(b => {
    if(t.dir === 'long'){
      if(b.h > bestPrice) bestPrice = b.h;
      if(b.l < worstPrice) worstPrice = b.l;
    } else {
      if(b.l < bestPrice) bestPrice = b.l;
      if(b.h > worstPrice) worstPrice = b.h;
    }
  });
  const mfePts = t.dir === 'long' ? (bestPrice - t.entryPrice) : (t.entryPrice - bestPrice);
  const maePts = t.dir === 'long' ? (worstPrice - t.entryPrice) : (t.entryPrice - worstPrice);
  const mfe = Math.round(mfePts * t.qty * TRADE_PT_VALUE * 100) / 100;
  const mae = Math.round(maePts * t.qty * TRADE_PT_VALUE * 100) / 100;
  return {mfe: Math.max(0,mfe), mae: Math.min(0,mae)};
}

let _fullTradesCache = []; // 全部交易（未篩選）
let _dateRangeFilter = {from:null, to:null};

// 精確版：逐根K棒模擬「整個帳戶」的浮動權益曲線（已實現損益+當下這筆交易的即時浮動損益）
// 峰值會持續追蹤，包含單筆交易「盤中創新高後才回落」的情況，不再只用進場前的已實現損益當峰值
function calcUnrealizedGroupMDD(group){
  if(!group.length) return 0;
  const sorted = group.slice().sort((a,b)=>(a.date+a.exitTime).localeCompare(b.date+b.exitTime));
  let cumRealized = 0, peak = 0, mdd = 0;
  sorted.forEach(t => {
    walkTradeFloatingPnl(t, (hPts, lPts) => {
      const hFloat = cumRealized + hPts;
      const lFloat = cumRealized + lPts;
      if(hFloat > peak) peak = hFloat;   // 盤中創的新高也會被抓到
      const dd1 = peak - lFloat;
      const dd2 = peak - hFloat;
      if(dd1 > mdd) mdd = dd1;
      if(dd2 > mdd) mdd = dd2;
    });
    cumRealized += t.pnl;
    if(cumRealized > peak) peak = cumRealized; // 已實現損益本身創新高也要更新峰值
  });
  return Math.round((mdd<0?0:mdd)*100)/100;
}

function getTradesInRange(allTrades, from, to){
  if(!from && !to) return allTrades;
  return allTrades.filter(t => {
    if(from && t.date < from) return false;
    if(to && t.date > to) return false;
    return true;
  });
}

function renderTradeResultWithTrades(trades){
  _allClosedTradesCache = trades;
  const overlay = document.getElementById('tresultOverlay');
  const card = document.getElementById('pageStats');
  const hasAny = _fullTradesCache.length > 0;
  document.getElementById('tresultTabs').style.display = hasAny ? 'flex' : 'none';
  document.getElementById('tresultDateRange').style.display = hasAny ? 'flex' : 'none';
  switchTResultTab('stats');
  overlay.classList.add('show');

  if(!trades.length){
    card.innerHTML = '<div class="tresult-empty">此區間內尚無交易紀錄<br><span style="font-size:11px">請調整統計範圍，或完成買進/賣出後按平倉產生紀錄</span></div>';
    return;
  }

  const wins = trades.filter(t => t.pnl > 0);
  const losses = trades.filter(t => t.pnl <= 0);
  const totalPnl = trades.reduce((a,t) => a+t.pnl, 0);
  const totalCommission = trades.reduce((a,t) => a+(t.commission||0), 0);
  const winRate = (wins.length / trades.length * 100).toFixed(1);
  const avgWin = wins.length ? wins.reduce((a,t)=>a+t.pnl,0)/wins.length : 0;
  const avgLoss = losses.length ? losses.reduce((a,t)=>a+t.pnl,0)/losses.length : 0;
  const maxWin = wins.length ? Math.max(...wins.map(t=>t.pnl)) : 0;
  const maxLoss = losses.length ? Math.min(...losses.map(t=>t.pnl)) : 0;
  const expectancy = totalPnl / trades.length;
  const profitFactor = losses.length ? Math.abs(wins.reduce((a,t)=>a+t.pnl,0) / losses.reduce((a,t)=>a+t.pnl,0)) : (wins.length ? Infinity : 0);

  // 最大回撤：純已實現損益計算（跟下方累積損益曲線一致）
  trades.sort((a,b) => (a.date+a.exitTime).localeCompare(b.date+b.exitTime));
  let peak=0, mdd=0, running=0;
  const curve=[0];
  const curveHigh=[0], curveLow=[0]; // 盤中最高/最低浮動損益曲線
  trades.forEach(t => {
    curveHigh.push(running + (t.mfe||0));
    curveLow.push(running + (t.mae||0));
    running += t.pnl;
    curve.push(running);
    if(running > peak) peak = running;
    const dd = peak - running;
    if(dd > mdd) mdd = dd;
  });
  const overallUnrealizedMDD = calcUnrealizedGroupMDD(trades);

  // Long/Short breakdown
  const longTrades = trades.filter(t => t.dir === 'long');
  const shortTrades = trades.filter(t => t.dir === 'short');
  const sharedQtyRange = {min: Math.min(...trades.map(t=>t.qty)), max: Math.max(...trades.map(t=>t.qty))};
  const longWins = longTrades.filter(t => t.pnl > 0);
  const shortWins = shortTrades.filter(t => t.pnl > 0);
  const longPnl = longTrades.reduce((a,t)=>a+t.pnl,0);
  const shortPnl = shortTrades.reduce((a,t)=>a+t.pnl,0);
  const longExpectancy = longTrades.length ? longPnl/longTrades.length : 0;
  const shortExpectancy = shortTrades.length ? shortPnl/shortTrades.length : 0;

  // 多空各自完整統計（平均/最大獲利虧損、最大/平均口數、總體MDD、單筆MDD）
  function getTradePts(t){
    return t.dir==='long' ? (t.exitPrice-t.entryPrice) : (t.entryPrice-t.exitPrice);
  }

  function calcGroupStats(group){
    if(!group.length) return {
      avgWin:0, avgLoss:0, maxWin:0, maxLoss:0, maxQty:0, avgQty:0,
      groupMDD:0, avgSingleMDD:0, maxSingleMDD:0,
      netPnl:0, winRate:0, totalProfit:0, totalLoss:0, profitFactor:0, payoffRatio:0, expectancy:0,
      avgWinPts:0, avgLossPts:0,
      avgMFE:0, avgMAE:0, giveBackRate:0, avgMAEpts:0, idealRR:0, actualRR:0
    };
    const gWins = group.filter(t=>t.pnl>0);
    const gLosses = group.filter(t=>t.pnl<=0);
    const avgWin = gWins.length ? gWins.reduce((a,t)=>a+t.pnl,0)/gWins.length : 0;
    const avgLoss = gLosses.length ? gLosses.reduce((a,t)=>a+t.pnl,0)/gLosses.length : 0;
    const maxWin = gWins.length ? Math.max(...gWins.map(t=>t.pnl)) : 0;
    const maxLoss = gLosses.length ? Math.min(...gLosses.map(t=>t.pnl)) : 0;
    const maxQty = Math.max(...group.map(t=>t.qty));
    const avgQty = group.reduce((a,t)=>a+t.qty,0)/group.length;

    const sorted = group.slice().sort((a,b)=>(a.date+a.exitTime).localeCompare(b.date+b.exitTime));
    let peak=0, mdd=0, running=0;
    sorted.forEach(t=>{running+=t.pnl;if(running>peak)peak=running;const dd=peak-running;if(dd>mdd)mdd=dd;});

    const singleMDDs = group.map(t=>t.singleMDD||0);
    const avgSingleMDD = singleMDDs.length ? singleMDDs.reduce((a,v)=>a+v,0)/singleMDDs.length : 0;
    const maxSingleMDD = singleMDDs.length ? Math.max(...singleMDDs) : 0;

    // 基本績效指標
    const netPnl = group.reduce((a,t)=>a+t.pnl,0);
    const winRate = group.length ? gWins.length/group.length*100 : 0;
    const totalProfit = gWins.reduce((a,t)=>a+t.pnl,0);
    const totalLoss = gLosses.reduce((a,t)=>a+t.pnl,0); // 負值
    const profitFactor = totalLoss!==0 ? Math.abs(totalProfit/totalLoss) : (totalProfit>0?Infinity:0);
    const payoffRatio = avgLoss!==0 ? Math.abs(avgWin/avgLoss) : (avgWin>0?Infinity:0);
    const expectancy = group.length ? netPnl/group.length : 0;

    // 點數統計
    const ptsArr = group.map(t=>getTradePts(t));
    const winPtsArr = gWins.map(t=>getTradePts(t));
    const lossPtsArr = gLosses.map(t=>getTradePts(t));
    const avgWinPts = winPtsArr.length ? winPtsArr.reduce((a,v)=>a+v,0)/winPtsArr.length : 0;
    const avgLossPts = lossPtsArr.length ? lossPtsArr.reduce((a,v)=>a+v,0)/lossPtsArr.length : 0;

    // MFE/MAE 統計（風控面）
    const mfeArr = group.map(t=>t.mfe||0);
    const maeArr = group.map(t=>t.mae||0); // 負值
    const avgMFE = mfeArr.length ? mfeArr.reduce((a,v)=>a+v,0)/mfeArr.length : 0;
    const avgMAE = maeArr.length ? maeArr.reduce((a,v)=>a+v,0)/maeArr.length : 0;
    // 獲利回吐率：獲利單中，(MFE-實際獲利)/MFE，越低越好（代表沒有把浮動獲利吐回去太多）
    const profitGiveBacks = gWins.filter(t=>t.mfe>0).map(t=>(t.mfe-t.pnl)/t.mfe*100);
    const giveBackRate = profitGiveBacks.length ? profitGiveBacks.reduce((a,v)=>a+v,0)/profitGiveBacks.length : 0;
    // 虧損單的平均MAE點數（換算成點數，不是金額）
    const lossMAEpts = gLosses.length ? gLosses.reduce((a,t)=>{
      const qty = t.qty||1;
      return a + Math.abs(t.mae||0)/(qty*TRADE_PT_VALUE);
    },0)/gLosses.length : 0;
    // 理想R:R = 最大獲利/最大虧損(絕對值)；實際R:R = 出場淨損益/最大虧損(絕對值)
    const idealRR = maxLoss!==0 ? maxWin/Math.abs(maxLoss) : 0;
    const actualRR = maxSingleMDD!==0 ? netPnl/maxSingleMDD : 0;

    const unrealizedMDD = calcUnrealizedGroupMDD(group);

    return {
      avgWin, avgLoss, maxWin, maxLoss, maxQty, avgQty, groupMDD:mdd, avgSingleMDD, maxSingleMDD,
      netPnl, winRate, totalProfit, totalLoss, profitFactor, payoffRatio, expectancy,
      avgWinPts, avgLossPts,
      avgMFE, avgMAE, giveBackRate, avgMAEpts: lossMAEpts, idealRR, actualRR,
      unrealizedMDD
    };
  }
  const longStats = calcGroupStats(longTrades);
  const shortStats = calcGroupStats(shortTrades);

  // 基本績效卡片（圖2樣式）：淨損益/勝率/總獲利/總虧損/賺賠比/獲利因子/期望值/最大回撤
  function buildDirCard(dirLabel, group, stats, color){
    const winsCount = group.filter(t=>t.pnl>0).length;
    const lossCount = group.length - winsCount;
    return `
    <div class="tresult-ls-card ${dirLabel==='長'?'long':'short'}">
      <div class="tresult-ls-title" style="color:${color}">${dirLabel==='長'?'📈 做多':'📉 做空'} (${group.length}筆)</div>
      <div class="ls-metric-grid">
        <div class="ls-metric"><span class="ls-metric-lbl">淨損益</span><b style="color:${stats.netPnl>=0?'var(--up)':'var(--dn)'}">${fmtMoneyFull(stats.netPnl)}</b></div>
        <div class="ls-metric"><span class="ls-metric-lbl">勝率</span><b>${stats.winRate.toFixed(1)}%</b></div>
        <div class="ls-metric"><span class="ls-metric-lbl">總獲利</span><b style="color:var(--up)">${fmtMoneyFull(stats.totalProfit)}</b></div>

        <div class="ls-metric"><span class="ls-metric-lbl">期望值</span><b style="color:${stats.expectancy>=0?'var(--up)':'var(--dn)'}">${fmtMoneyFull(stats.expectancy)}</b></div>
        <div class="ls-metric"><span class="ls-metric-lbl">最大回撤(已實現)</span><b style="color:#f59e0b">$${stats.groupMDD.toFixed(0)}</b></div>
        <div class="ls-metric" style="grid-column:span 2;"><span class="ls-metric-lbl">最大回撤(含影線/未實現)</span><b style="color:#f59e0b">$${stats.unrealizedMDD.toFixed(0)}</b></div>
      </div>
      <div class="ls-subgroup-lbl">口數統計</div>
      <div class="ls-metric-grid cols2">
        <div class="ls-metric"><span class="ls-metric-lbl">最大口數</span><b>${stats.maxQty}</b></div>
        <div class="ls-metric"><span class="ls-metric-lbl">平均口數</span><b>${stats.avgQty.toFixed(1)}</b></div>
      </div>
      <div class="ls-subgroup-lbl">點數明細</div>
      <div class="ls-metric-grid cols2">
        <div class="ls-metric"><span class="ls-metric-lbl">均獲(pt)</span><b style="color:var(--up)">${stats.avgWinPts>=0?'+':''}${stats.avgWinPts.toFixed(1)}</b></div>
        <div class="ls-metric"><span class="ls-metric-lbl">均虧(pt)</span><b style="color:var(--dn)">${stats.avgLossPts.toFixed(1)}</b></div>
      </div>
      <div class="ls-subgroup-lbl">風控</div>
      <div class="ls-metric-grid cols2">
        <div class="ls-metric"><span class="ls-metric-lbl">獲利回吐率</span><b>${stats.giveBackRate.toFixed(1)}%</b></div>
        <div class="ls-metric"><span class="ls-metric-lbl">平均MAE(pt)</span><b style="color:var(--dn)">${stats.avgMAEpts.toFixed(1)}</b></div>
        <div class="ls-metric"><span class="ls-metric-lbl">理想R:R</span><b style="color:${stats.idealRR>=1?'var(--up)':'var(--dn)'}">${stats.idealRR.toFixed(2)}x</b></div>
        <div class="ls-metric"><span class="ls-metric-lbl">實際R:R</span><b style="color:${stats.actualRR>=0?'var(--up)':'var(--dn)'}">${stats.actualRR.toFixed(2)}x</b></div>
      </div>
    </div>`;
  }

  // 效率統計卡片（圖1樣式）
  // 計算交易持有時間（分鐘）：用idx差距估算(每1K=1分鐘)
function getHoldMinutes(t){
  return Math.max(1, (t.exitIdx - t.entryIdx));
}

// 通用散佈圖：X軸=qty或holdMin，Y軸=pnl
function buildBubbleChart(tradesArr, color, qtyRange){
  if(!tradesArr.length) return '<div class="treplay-empty" style="padding:30px;">無資料</div>';
  const W = 560, H = 260, P = {l:55, r:20, t:16, b:36};
  const xVals = tradesArr.map(t => getHoldMinutes(t));
  const yVals = tradesArr.map(t => t.pnl);
  let xMin = Math.min(...xVals), xMax = Math.max(...xVals);
  let yMin = Math.min(0, ...yVals), yMax = Math.max(0, ...yVals);
  const qtyMin = qtyRange.min, qtyMax = qtyRange.max;
  const xPad = (xMax-xMin)*0.12 || 1; xMin = Math.max(0,xMin-xPad); xMax += xPad;
  const yPad = (yMax-yMin)*0.15 || 50; yMin -= yPad; yMax += yPad;
  const xRng = (xMax-xMin)||1, yRng = (yMax-yMin)||1;
  const X = v => P.l + (W-P.l-P.r)*((v-xMin)/xRng);
  const Y = v => P.t + (H-P.t-P.b)*(1-(v-yMin)/yRng);
  const zeroY = Y(0);

  // 口數 → 泡泡半徑（面積法比較符合視覺直覺，範圍固定在 5~22px；多空共用同一組口數範圍，同口數兩邊大小一致）
  const RMIN = 5, RMAX = 22;
  const qtyRng = (qtyMax-qtyMin) || 1;
  const qtyToR = q => qtyMax===qtyMin ? (RMIN+RMAX)/2 : RMIN + Math.sqrt((q-qtyMin)/qtyRng) * (RMAX-RMIN);

  const yStep = smartGridStep(yMax-yMin, 5);
  let grid = '';
  const gStart = Math.ceil(yMax/yStep)*yStep, gEnd = Math.floor(yMin/yStep)*yStep;
  for(let gv=gStart; gv>=gEnd; gv-=yStep){
    const gy = Y(gv);
    if(gy<P.t-5||gy>H-P.b+5) continue;
    grid += `<line x1="${P.l}" y1="${gy.toFixed(1)}" x2="${W-P.r}" y2="${gy.toFixed(1)}" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>`;
    grid += `<text x="2" y="${(gy+3).toFixed(1)}" fill="#777" font-size="9" font-family="monospace">$${gv.toFixed(0)}</text>`;
  }
  // X軸刻度
  const xStep = smartGridStep(xMax-xMin, 5);
  let xTicks = '';
  const xStart = Math.ceil(xMin/xStep)*xStep, xEnd = Math.floor(xMax/xStep)*xStep;
  for(let xv=xStart; xv<=xEnd; xv+=xStep){
    const gx = X(xv);
    xTicks += `<text x="${gx.toFixed(1)}" y="${H-P.b+16}" fill="#888" font-size="9" font-family="monospace" text-anchor="middle">${xv.toFixed(0)}</text>`;
  }

  // 依半徑由大到小排序畫，避免大泡泡蓋住小泡泡完全點不到
  const ordered = tradesArr.map((t,i)=>({t,i})).sort((a,b)=> qtyToR(b.t.qty)-qtyToR(a.t.qty));

  let bubbles = '';
  ordered.forEach(({t}) => {
    const xv = getHoldMinutes(t);
    const px = X(xv), py = Y(t.pnl), r = qtyToR(t.qty);
    const bubbleColor = t.pnl>=0 ? '#22c55e' : '#ef4444';
    const tipText = `${t.dir==='long'?'多':'空'} ・ ${t.date} ・ ${t.qty}口 ・ 持有${xv}分鐘 ・ 損益 ${t.pnl>=0?'+':''}$${t.pnl.toFixed(0)}`;
    bubbles += `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${(r+7).toFixed(1)}" fill="transparent" style="cursor:pointer;" onclick="showSimpleTip(event,'${tipText}')"/>`;
    bubbles += `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${r.toFixed(1)}" fill="${bubbleColor}" fill-opacity="0.35" stroke="${bubbleColor}" stroke-width="1.5" style="pointer-events:none;"/>`;
  });

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block;">
    ${grid}
    <line x1="${P.l}" y1="${zeroY.toFixed(1)}" x2="${W-P.r}" y2="${zeroY.toFixed(1)}" stroke="rgba(255,255,255,0.3)" stroke-width="1.2" stroke-dasharray="4,3"/>
    <line x1="${P.l}" y1="${P.t}" x2="${P.l}" y2="${H-P.b}" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    ${xTicks}
    ${bubbles}
    <text x="${(W+P.l-P.r)/2}" y="${H-4}" fill="#999" font-size="10" font-weight="700" text-anchor="middle">持有分鐘（泡泡大小＝口數，多空共用比例尺）</text>
  </svg>`;
}

  const maxBucketCount = Math.max(1, ...allBucketKeys.map(k => Math.max((longBuckets[k]||[]).length, (shortBuckets[k]||[]).length)));

  // Build equity curve SVG
// 共用函數：給定一組累積損益曲線數值，產生SVG圖
// 產生平滑曲線路徑（Catmull-Rom 近似，視覺更柔順）
function smoothPath(points){
  if(points.length < 2) return '';
  if(points.length === 2) return `M${points[0][0]},${points[0][1]} L${points[1][0]},${points[1][1]}`;
  let d = `M${points[0][0]},${points[0][1]}`;
  for(let i=0;i<points.length-1;i++){
    const p0 = points[i-1] || points[i];
    const p1 = points[i];
    const p2 = points[i+1];
    const p3 = points[i+2] || p2;
    const cp1x = p1[0] + (p2[0]-p0[0])/6;
    const cp1y = p1[1] + (p2[1]-p0[1])/6;
    const cp2x = p2[0] - (p3[0]-p1[0])/6;
    const cp2y = p2[1] - (p3[1]-p1[1])/6;
    d += ` C${cp1x.toFixed(1)},${cp1y.toFixed(1)} ${cp2x.toFixed(1)},${cp2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d;
}

// 智慧計算適合的格線級距：依資料範圍自動挑選漂亮的間距(避免擠在一起)
function smartGridStep(range, targetLines){
  targetLines = targetLines || 6;
  const rough = range / targetLines;
  const pow10 = Math.pow(10, Math.floor(Math.log10(rough)));
  const candidates = [1, 2, 2.5, 5, 10];
  let best = pow10*10;
  for(const c of candidates){
    const step = c * pow10;
    if(step >= rough){ best = step; break; }
  }
  return best;
}

function buildEquityCurveSVG(curveArr, customColor, datesArr, highArr, lowArr, chartId){
  const W=720, H=320, PAD=30;
  const allVals = [0, ...curveArr, ...(highArr||[]), ...(lowArr||[])];
  const minV = Math.min(...allVals), maxV = Math.max(...allVals);
  const pd = (maxV-minV)*0.1 || 100;
  const rng = (maxV - minV + pd*2) || 1;
  const dispMin = minV - pd, dispMax = maxV + pd;
  const xStep = (W - 2*PAD) / (curveArr.length - 1 || 1);
  const yPos = v => PAD + (H - 2*PAD) * (1 - (v - dispMin) / rng);
  const zeroY = yPos(0);
  const lastVal = curveArr[curveArr.length-1] || 0;
  const curveColor = customColor || (lastVal >= 0 ? '#22c55e' : '#ef4444');

  const pts = curveArr.map((v,i) => [PAD+i*xStep, yPos(v)]);
  const pathD = pts.map((p,i)=>`${i===0?'M':'L'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  const areaD = pathD + ` L${pts[pts.length-1][0].toFixed(1)},${zeroY.toFixed(1)} L${pts[0][0].toFixed(1)},${zeroY.toFixed(1)} Z`;

  // 盤中最高/最低浮動損益線（虛線，不填色）— 這兩條線的圓點只做視覺呈現，點擊統一交給下面的整欄熱區處理
  const HIGH_COLOR = '#22d3ee', LOW_COLOR = '#fb7185';
  let highPathD = '', lowPathD = '';
  if(highArr && highArr.length === curveArr.length){
    const hPts = highArr.map((v,i) => [PAD+i*xStep, yPos(v)]);
    highPathD = hPts.map((p,i)=>`${i===0?'M':'L'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  }
  if(lowArr && lowArr.length === curveArr.length){
    const lPts = lowArr.map((v,i) => [PAD+i*xStep, yPos(v)]);
    lowPathD = lPts.map((p,i)=>`${i===0?'M':'L'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  }

  const GRID_STEP = smartGridStep(dispMax-dispMin, 6);
  let gridLinesH = '';
  const gridStart = Math.ceil(dispMax/GRID_STEP)*GRID_STEP;
  const gridEnd = Math.floor(dispMin/GRID_STEP)*GRID_STEP;
  for(let gv=gridStart; gv>=gridEnd; gv-=GRID_STEP){
    const gy = yPos(gv);
    if(gy < PAD-5 || gy > H-PAD+5) continue;
    gridLinesH += `<line x1="${PAD}" y1="${gy.toFixed(1)}" x2="${W-PAD}" y2="${gy.toFixed(1)}" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>`;
    gridLinesH += `<text x="2" y="${(gy+3).toFixed(1)}" fill="#777" font-size="9" font-family="monospace" font-weight="600">$${gv.toFixed(0)}</text>`;
  }
  // ★ 效能：不再畫「每筆交易一條」的垂直網格線，交易筆數一多(好幾個月的回測常常上百筆)
  //   單張圖就會多出上百個SVG節點，累積損益/多/空三張圖加起來就是好幾百個，是造成匯出報告滾動卡頓的主因之一。
  //   改成固定畫5條大致平均分布的垂直參考線，純粹當視覺分隔，不用逐筆畫。
  let gridLinesV = '';
  const V_LINES = 5;
  for(let k=1; k<V_LINES; k++){
    const idx = Math.round((curveArr.length-1) * k / V_LINES);
    const gx = PAD + idx*xStep;
    gridLinesV += `<line x1="${gx.toFixed(1)}" y1="${PAD}" x2="${gx.toFixed(1)}" y2="${H-PAD}" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>`;
  }

  let pointDots = '';
  const DOT_DENSE_THRESHOLD = 150; // 交易筆數超過這個門檻，個別圓點在視覺上已經看不清楚了，乾脆不畫，只留線本身+點擊熱區
  if(curveArr.length <= DOT_DENSE_THRESHOLD){
    curveArr.forEach((v,i) => {
      if(i===0){
        pointDots += `<circle cx="${pts[0][0].toFixed(1)}" cy="${pts[0][1].toFixed(1)}" r="4" fill="${curveColor}" stroke="#0d0d0f" stroke-width="2"/>`;
        return;
      }
      const [px,py] = pts[i];
      const isWin = v >= curveArr[i-1];
      const dotColor = isWin ? '#22c55e' : '#ef4444';
      pointDots += `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="4" fill="${dotColor}" stroke="#0d0d0f" stroke-width="2" style="pointer-events:none;"/>`;
    });
  }

  // ★ 整欄點擊熱區：不用再精準點在小圓點上，點這一整條欄位任何地方，
  //   一次顯示「盤中最高、出場(累積)、盤中最低」三筆資料，平板點小圓點太密集時特別好用
  let hitZones = '';
  curveArr.forEach((v,i) => {
    if(i===0) return;
    const gx = PAD+i*xStep;
    const delta = v - curveArr[i-1];
    const dLbl = (datesArr && datesArr[i-1]) ? ` ・ ${datesArr[i-1]}` : '';
    const items = [];
    if(highArr && highArr[i]!==undefined) items.push({label:'最高', value:'$'+highArr[i].toFixed(0), color:HIGH_COLOR});
    items.push({label:'累積', value:'$'+v.toFixed(0), color:'#fff'});
    if(lowArr && lowArr[i]!==undefined) items.push({label:'最低', value:'$'+lowArr[i].toFixed(0), color:LOW_COLOR});
    items.push({label:'本筆', value:(delta>=0?'+':'')+'$'+delta.toFixed(0), color: delta>=0?'#22c55e':'#ef4444'});
    const dataStr = chartClickData(`第${i}筆${dLbl}`, items);
    const hw = Math.max(10, xStep*0.9);
    hitZones += `<rect x="${(gx-hw/2).toFixed(1)}" y="${PAD}" width="${hw.toFixed(1)}" height="${H-2*PAD}" fill="transparent" style="cursor:pointer;" onclick="showChartPoint(event,'${chartId}',${gx.toFixed(1)},'${dataStr}')"/>`;
  });

  const idSuffix = Math.random().toString(36).slice(2,8);
  const legend = (highArr || lowArr) ? `
    <div style="display:flex;gap:14px;font-size:10px;color:var(--t2);margin-bottom:6px;flex-wrap:wrap;">
      <span><span style="display:inline-block;width:14px;height:2px;background:${curveColor};margin-right:4px;vertical-align:middle;"></span>已實現累積損益</span>
      <span><span style="display:inline-block;width:14px;height:2px;background:${HIGH_COLOR};margin-right:4px;vertical-align:middle;border-top:2px dashed ${HIGH_COLOR};height:0;"></span>盤中最高浮動損益</span>
      <span><span style="display:inline-block;width:14px;height:2px;background:${LOW_COLOR};margin-right:4px;vertical-align:middle;border-top:2px dashed ${LOW_COLOR};height:0;"></span>盤中最低浮動損益</span>
    </div>` : '';

  return `<div class="chart-info-panel" id="${chartId}_info">👆 點擊圖上的點查看該筆交易詳細資料</div>${legend}<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block;">
    <defs>
      <linearGradient id="grad-${idSuffix}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${curveColor}" stop-opacity="0.35"/>
        <stop offset="60%" stop-color="${curveColor}" stop-opacity="0.08"/>
        <stop offset="100%" stop-color="${curveColor}" stop-opacity="0"/>
      </linearGradient>
    </defs>
    ${gridLinesV}
    ${gridLinesH}
    <line x1="${PAD}" y1="${zeroY}" x2="${W-PAD}" y2="${zeroY}" stroke="rgba(255,255,255,0.4)" stroke-width="1.3" stroke-dasharray="5,3"/>
    <path d="${areaD}" fill="url(#grad-${idSuffix})"/>
    ${highPathD ? `<path d="${highPathD}" fill="none" stroke="${HIGH_COLOR}" stroke-width="1.5" stroke-dasharray="4,3" stroke-linejoin="round" stroke-linecap="round" opacity="0.85"/>` : ''}
    ${lowPathD ? `<path d="${lowPathD}" fill="none" stroke="${LOW_COLOR}" stroke-width="1.5" stroke-dasharray="4,3" stroke-linejoin="round" stroke-linecap="round" opacity="0.85"/>` : ''}
    <path d="${pathD}" fill="none" stroke="${curveColor}" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" opacity="0.18"/>
    <path d="${pathD}" fill="none" stroke="${curveColor}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <line id="${chartId}_vline" class="chart-vline" x1="0" y1="${PAD}" x2="0" y2="${H-PAD}" stroke="#facc15" stroke-width="1.5" stroke-dasharray="5,4" visibility="hidden" style="pointer-events:none;"/>
    ${pointDots}
    ${hitZones}
    <text x="${PAD}" y="${zeroY-8}" fill="rgba(255,255,255,0.6)" font-size="10" font-family="monospace" font-weight="700">$0</text>
  </svg>`;
}

// 全部交易曲線
const overallSVG = buildEquityCurveSVG(curve, '#facc15', trades.map(t=>t.date), curveHigh, curveLow, 'eqOverall');

// 做多曲線（只算多單交易，依時間序累加）
const longTradesSorted = longTrades.slice().sort((a,b)=>(a.date+a.exitTime).localeCompare(b.date+b.exitTime));
let longRunning=0; const longCurve=[0], longCurveHigh=[0], longCurveLow=[0];
longTradesSorted.forEach(t=>{
  longCurveHigh.push(longRunning + (t.mfe||0));
  longCurveLow.push(longRunning + (t.mae||0));
  longRunning+=t.pnl; longCurve.push(longRunning);
});
const longSVG = buildEquityCurveSVG(longCurve, '#ef4444', longTradesSorted.map(t=>t.date), longCurveHigh, longCurveLow, 'eqLong');

// 做空曲線
const shortTradesSorted = shortTrades.slice().sort((a,b)=>(a.date+a.exitTime).localeCompare(b.date+b.exitTime));
let shortRunning=0; const shortCurve=[0], shortCurveHigh=[0], shortCurveLow=[0];
shortTradesSorted.forEach(t=>{
  shortCurveHigh.push(shortRunning + (t.mfe||0));
  shortCurveLow.push(shortRunning + (t.mae||0));
  shortRunning+=t.pnl; shortCurve.push(shortRunning);
});
const shortSVG = buildEquityCurveSVG(shortCurve, '#22c55e', shortTradesSorted.map(t=>t.date), shortCurveHigh, shortCurveLow, 'eqShort');

  // MAE/MFE 柱狀圖（共用函數，可供整體/多單/空單分別呼叫）
  function buildMaeMfeChart(tradesArr, chartId){
    if(!tradesArr.length) return '<div class="treplay-empty" style="padding:30px;">無資料</div>';
    const mmW = Math.max(500, tradesArr.length*26+40), mmH = 240, mmPad = {l:50, r:14, t:14, b:30};
    const allVals = tradesArr.flatMap(t => [t.mfe, t.mae, t.pnl]);
    let mmMax = Math.max(0, ...allVals), mmMin = Math.min(0, ...allVals);
    const mmPd = (mmMax-mmMin)*0.08 || 50; mmMax += mmPd; mmMin -= mmPd;
    const mmRng = (mmMax-mmMin) || 1;
    const mmY = v => mmPad.t + (mmH-mmPad.t-mmPad.b)*(1-(v-mmMin)/mmRng);
    const mmBarW = (mmW-mmPad.l-mmPad.r)/tradesArr.length;
    const mmX = i => mmPad.l + i*mmBarW + mmBarW/2;
    const mmZeroY = mmY(0);

    const MM_GRID_STEP = smartGridStep(mmMax-mmMin, 6);
    let mmGrid = '';
    const mmGridStart = Math.ceil(mmMax/MM_GRID_STEP)*MM_GRID_STEP;
    const mmGridEnd = Math.floor(mmMin/MM_GRID_STEP)*MM_GRID_STEP;
    for(let gv=mmGridStart; gv>=mmGridEnd; gv-=MM_GRID_STEP){
      const gy = mmY(gv);
      if(gy < mmPad.t-5 || gy > mmH-mmPad.b+5) continue;
      mmGrid += `<line x1="${mmPad.l}" y1="${gy.toFixed(1)}" x2="${mmW-mmPad.r}" y2="${gy.toFixed(1)}" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>`;
      mmGrid += `<text x="2" y="${(gy+3).toFixed(1)}" fill="#777" font-size="9" font-family="monospace">$${gv.toFixed(0)}</text>`;
    }

    let mmBars = '';
    const MM_LABEL_THRESHOLD = 150; // 筆數太多時，省略每根bar下面的編號文字，減少節點數（點擊還是能看到完整資訊）
    tradesArr.forEach((t,i) => {
      const x = mmX(i);
      const mfeY = mmY(t.mfe), maeY = mmY(t.mae);
      const dataStr = chartClickData(`#${i+1} ${t.dir==='long'?'多':'空'} ・ ${t.date}`, [
        {label:'MFE', value:'$'+t.mfe.toFixed(0), color:'#22c55e'},
        {label:'出場', value:(t.pnl>=0?'+':'')+'$'+t.pnl.toFixed(0), color: t.pnl>=0?'#22c55e':'#ef4444'},
        {label:'MAE', value:'$'+t.mae.toFixed(0), color:'#ef4444'},
      ]);
      mmBars += `<rect x="${(x-10).toFixed(1)}" y="${mmPad.t}" width="20" height="${mmH-mmPad.t-mmPad.b}" fill="transparent" style="cursor:pointer;" onclick="showChartPoint(event,'${chartId}',${x.toFixed(1)},'${dataStr}')"/>`;
      mmBars += `<rect x="${(x-3).toFixed(1)}" y="${Math.min(mfeY,mmZeroY).toFixed(1)}" width="6" height="${Math.abs(mfeY-mmZeroY).toFixed(1)}" fill="#22c55e" rx="1.5" style="pointer-events:none;"/>`;
      mmBars += `<rect x="${(x-3).toFixed(1)}" y="${Math.min(maeY,mmZeroY).toFixed(1)}" width="6" height="${Math.abs(maeY-mmZeroY).toFixed(1)}" fill="#ef4444" rx="1.5" style="pointer-events:none;"/>`;
      const pnlY = mmY(t.pnl);
      mmBars += `<rect x="${(x-5).toFixed(1)}" y="${(pnlY-5).toFixed(1)}" width="10" height="10" fill="#fff" stroke="${t.pnl>=0?'#22c55e':'#ef4444'}" stroke-width="2" transform="rotate(45 ${x.toFixed(1)} ${pnlY.toFixed(1)})" style="pointer-events:none;"/>`;
      if(tradesArr.length <= MM_LABEL_THRESHOLD){
        mmBars += `<text x="${x.toFixed(1)}" y="${mmH-mmPad.b+14}" fill="#888" font-size="9" text-anchor="middle">#${i+1}</text>`;
      }
    });

    return `<div class="chart-info-panel" id="${chartId}_info">👆 點擊圖上的長條查看該筆交易詳細資料</div><div style="width:100%;overflow-x:auto;"><svg viewBox="0 0 ${mmW} ${mmH}" style="width:${mmW}px;height:${mmH}px;display:block;min-width:100%;">
      ${mmGrid}
      <line x1="${mmPad.l}" y1="${mmZeroY.toFixed(1)}" x2="${mmW-mmPad.r}" y2="${mmZeroY.toFixed(1)}" stroke="rgba(255,255,255,0.3)" stroke-width="1.2"/>
      ${mmBars}
      <line id="${chartId}_vline" class="chart-vline" x1="0" y1="${mmPad.t}" x2="0" y2="${mmH-mmPad.b}" stroke="#facc15" stroke-width="1.5" stroke-dasharray="5,4" visibility="hidden" style="pointer-events:none;"/>
    </svg></div>`;
  }

  const maeMfeChart = buildMaeMfeChart(trades, 'mmOverall');
  const longMaeMfeChart = buildMaeMfeChart(longTrades, 'mmLong');
  const shortMaeMfeChart = buildMaeMfeChart(shortTrades, 'mmShort');

  card.innerHTML = `
    <div class="tresult-header">
      <div class="tresult-title">📊 模擬單績效報告</div>
      <div class="tresult-sub">${trades[0].date} ~ ${trades[trades.length-1].date} ・ 共 ${trades.length} 筆交易</div>
    </div>

    <div class="tresult-hero">
      <div class="tresult-hero-card">
        <div class="tresult-hero-lbl">總損益</div>
        <div class="tresult-hero-val" style="color:${pnlColor}">${fmtMoneyFull(totalPnl)}</div>
        <div class="tresult-hero-sub">已扣除手續費</div>
      </div>
      <div class="tresult-hero-card">
        <div class="tresult-hero-lbl">手續費</div>
        <div class="tresult-hero-val" style="color:#f59e0b">-$${totalCommission.toFixed(0)}</div>
        <div class="tresult-hero-sub">$${TRADE_COMMISSION_PER_LOT.toFixed(1)}/口(來回)</div>
      </div>
      <div class="tresult-hero-card">
        <div class="tresult-hero-lbl">勝率</div>
        <div class="tresult-hero-val" style="color:#fff">${winRate}<span style="font-size:16px">%</span></div>
      </div>
    </div>

    <div class="tresult-grid">
      <div class="tresult-stat"><div class="tresult-stat-lbl">交易次數</div><div class="tresult-stat-val" style="color:#fff">${trades.length}</div></div>
      <div class="tresult-stat"><div class="tresult-stat-lbl">獲利/虧損</div><div class="tresult-stat-val" style="color:#fff">${wins.length}/${losses.length}</div></div>
      <div class="tresult-stat"><div class="tresult-stat-lbl">最大獲利</div><div class="tresult-stat-val" style="color:var(--up)">${fmtMoney(maxWin)}</div></div>
      <div class="tresult-stat"><div class="tresult-stat-lbl">最大虧損</div><div class="tresult-stat-val" style="color:var(--dn)">${fmtMoney(maxLoss)}</div></div>
      <div class="tresult-stat"><div class="tresult-stat-lbl">平均獲利</div><div class="tresult-stat-val" style="color:var(--up)">${fmtMoney(avgWin)}</div></div>
      <div class="tresult-stat"><div class="tresult-stat-lbl">平均虧損</div><div class="tresult-stat-val" style="color:var(--dn)">${fmtMoney(avgLoss)}</div></div>
      <div class="tresult-stat"><div class="tresult-stat-lbl">最大回撤<br><span style="font-size:7.5px;color:var(--t3);font-weight:400;">(已實現)</span></div><div class="tresult-stat-val" style="color:#f59e0b">$${mdd.toFixed(0)}</div></div>
      <div class="tresult-stat" style="border-color:rgba(245,158,11,0.3);"><div class="tresult-stat-lbl">最大回撤<br><span style="font-size:7.5px;color:#f59e0b;font-weight:600;">(含影線/未實現)</span></div><div class="tresult-stat-val" style="color:#f59e0b">$${overallUnrealizedMDD.toFixed(0)}</div></div>
      <div class="tresult-stat"><div class="tresult-stat-lbl">單筆期望值</div><div class="tresult-stat-val" style="color:${expectancy>=0?'var(--up)':'var(--dn)'}">${fmtMoney(expectancy)}</div></div>
    </div>

    <div class="tresult-section">
      <div class="tresult-section-title">📈 累積損益曲線（整體）<span style="font-size:9px;color:var(--t3);font-weight:400;margin-left:6px;">(已實現損益)</span></div>
      ${overallSVG}
    </div>

    <div class="tresult-curve-split">
      <div class="tresult-section" style="flex:1;min-width:280px;">
        <div class="tresult-section-title"><span style="color:#fb923c;">✔ 做多</span> 累積損益</div>
        ${longSVG}
      </div>
      <div class="tresult-section" style="flex:1;min-width:280px;">
        <div class="tresult-section-title"><span style="color:#22c55e;">✔ 做空</span> 累積損益</div>
        ${shortSVG}
      </div>
    </div>

    <div class="tresult-section">
      <div class="tresult-section-title" style="justify-content:space-between;display:flex;">
        <span>📊 MAE/MFE 分析（每筆交易盤中波動）<span style="font-size:9px;color:#f59e0b;font-weight:600;margin-left:6px;">⚠ 含影線、未實現</span></span>
      </div>
      <div style="display:flex;gap:14px;font-size:10px;color:var(--t2);margin-bottom:8px;">
        <span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#22c55e;margin-right:3px;"></span>MFE 最大獲利</span>
        <span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#ef4444;margin-right:3px;"></span>MAE 最大虧損</span>
        <span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#fff;border:1.5px solid #888;margin-right:3px;"></span>出場損益</span>
      </div>
      ${maeMfeChart}
    </div>

    <div class="tresult-section">
      <div class="tresult-section-title">🦋 多空點數分布蝴蝶圖（每${bucketSize}點）</div>
      <div class="butterfly-hdr">
        <span style="color:#fb923c;font-weight:700;">做多</span>
        <span style="color:var(--t3);font-size:10px;">點數區間</span>
        <span style="color:#22c55e;font-weight:700;">做空</span>
      </div>
      <div class="butterfly-rows">
        ${allBucketKeys.map(b => {
          const lt = longBuckets[b]||[], st = shortBuckets[b]||[];
          const lw = lt.filter(t=>t.pnl>0).length, ll = lt.length-lw;
          const sw = st.filter(t=>t.pnl>0).length, sl = st.length-sw;
          const lPct = (lt.length/maxBucketCount*100).toFixed(0);
          const sPct = (st.length/maxBucketCount*100).toFixed(0);
          const isPos = b >= 0;
          return `
          <div class="butterfly-row">
            <div class="butterfly-side left">
              ${lt.length ? `<span class="butterfly-count">${lt.length}</span><div class="butterfly-bar long" style="width:${lPct}%;background:#ef4444;" onclick="showSimpleTip(event,'做多 ${isPos?'+':''}${b}~${b+bucketSize}點 ・ ${lt.length}筆 ・ 勝${lw}/敗${ll}')"></div>` : '<span class="butterfly-count dim">0</span>'}
            </div>
            <div class="butterfly-label ${isPos?'pos':'neg'}">${isPos?'+':''}${b}</div>
            <div class="butterfly-side right">
              ${st.length ? `<div class="butterfly-bar short" style="width:${sPct}%;background:#22c55e;" onclick="showSimpleTip(event,'做空 ${isPos?'+':''}${b}~${b+bucketSize}點 ・ ${st.length}筆 ・ 勝${sw}/敗${sl}')"></div><span class="butterfly-count">${st.length}</span>` : '<span class="butterfly-count dim">0</span>'}
            </div>
          </div>`;
        }).join('')}
      </div>
      <div style="font-size:9px;color:var(--t3);margin-top:8px;text-align:center;">滑鼠懸停柱狀圖可查看勝/敗筆數 ・ 橘/紅=虧損區間 黃/綠=獲利區間</div>
    </div>

    <div class="tresult-section">

function buildDayTradesSummary(trades){
  const byDate = {};
  trades.forEach(t => {
    if(!byDate[t.date]) byDate[t.date] = {date:t.date, totalQty:0, totalPnl:0};
    byDate[t.date].totalQty += t.qty;
    byDate[t.date].totalPnl += t.pnl;
  });
  return Object.values(byDate).sort((a,b)=>a.date.localeCompare(b.date));
}

// 將一筆交易(可能含多次進場/出場)依 FIFO 拆成一筆一筆「口」的明細
// 例如同一根K棒分3次各下1口、但最後價位/時間都相同，會先拆开配對再合併回同一列（qty加總）
// 只有當進場或出場的時間/價位真的不同時，才會分成不同列
function decomposeTradeToLots(t){
  const entryLegs = (t.legs && t.legs.length) ? t.legs.filter(l=>l.type==='entry') : [{qty:t.qty, price:t.entryPrice, time:t.entryTime, idx:t.entryIdx}];
  const exitLegs = (t.legs && t.legs.length) ? t.legs.filter(l=>l.type==='exit') : [{qty:t.qty, price:t.exitPrice, time:t.exitTime, idx:t.exitIdx}];
  const entryQueue = entryLegs.map(l => ({...l, remaining:l.qty}));
  const rawLots = [];
  let entryPtr = 0;
  exitLegs.forEach(exitLeg => {
    let exitRemaining = exitLeg.qty;
    while(exitRemaining > 0 && entryPtr < entryQueue.length){
      const eu = entryQueue[entryPtr];
      const matchQty = Math.min(eu.remaining, exitRemaining);
      rawLots.push({
        date: t.date, dir: t.dir, qty: matchQty,
        entryTime: eu.time, entryPrice: eu.price, entryIdx: eu.idx,
        exitTime: exitLeg.time, exitPrice: exitLeg.price, exitIdx: exitLeg.idx
      });
      eu.remaining -= matchQty;
      exitRemaining -= matchQty;
      if(eu.remaining <= 0) entryPtr++;
    }
  });
  // 合併「進場時間+進場價+出場時間+出場價」完全相同的拆分結果，口數直接加總
  const merged = {};
  const order = [];
  rawLots.forEach(lot => {
    const key = `${lot.dir}_${lot.entryTime}_${lot.entryPrice}_${lot.exitTime}_${lot.exitPrice}`;
    if(!merged[key]){ merged[key] = {...lot}; order.push(key); }
    else merged[key].qty += lot.qty;
  });
  const lots = order.map(k => merged[k]);
  lots.forEach(lot => {
    const pts = lot.dir==='long' ? (lot.exitPrice-lot.entryPrice) : (lot.entryPrice-lot.exitPrice);
    const grossPnl = pts * lot.qty * TRADE_PT_VALUE;
    const commission = lot.qty * TRADE_COMMISSION_PER_LOT;
    lot.pnl = Math.round((grossPnl - commission) * 100) / 100;
    lot.commission = Math.round(commission * 100) / 100;
    lot.holdMin = Math.max(1, lot.exitIdx - lot.entryIdx);
    const mm = calcMaeMfe(lot);
    lot.mfe = mm.mfe; lot.mae = mm.mae;
  });
  return lots;
}

function computeDayLots(dateStr){
  const dayTrades = _allClosedTradesCache.filter(t => t.date === dateStr);
  let lots = [];
  dayTrades.forEach(t => { lots = lots.concat(decomposeTradeToLots(t)); });
  lots.sort((a,b)=> a.entryIdx - b.entryIdx);
  return lots;
}

let storyNotes = {};   // {date:[{id,idx,ts,price,tf,text,folder}]}  分類單位＝單一時間點

// 一次性遷移：舊筆記的時間是「bucket最後一根1K」的時間(x9結尾)，
// 依筆記所屬格局換算成該K棒的起始時間。需在 DATA 載入後呼叫。
function migrateStoryNoteTs(){
  if(localStorage.getItem('nqStoryTsMigrated')==='1') return;
  let changed=false;
  Object.keys(storyNotes).forEach(day=>{
    const d=DATA[day];
    if(!d) return;
    (storyNotes[day]||[]).forEach(n=>{
      const tf=n.tf||'1k';
      if(tf==='1k'||!d[tf]||!d[tf].length) return;
      const bucket=d[tf].find(k=>k.idx<=n.idx && n.idx<=(k.idx_end||k.idx));
      if(bucket && bucket.ts && n.ts!==bucket.ts){ n.ts=bucket.ts; changed=true; }
    });
  });
  if(changed) saveStoryStorage();
  localStorage.setItem('nqStoryTsMigrated','1');
}

function exportStoryNotes(){
  const payload={type:'nq-story-backup',version:2,exportedAt:new Date().toISOString(),notes:storyNotes,folders:storyFolders};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='NQ故事線備份_'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function importStoryNotes(input){
  const f=input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const p=JSON.parse(r.result);
      const notes=p.notes||{}; const folders=p.folders||[];
      let added=0;
      Object.keys(notes).forEach(d=>{
        if(!Array.isArray(notes[d])) return;
        if(!storyNotes[d]) storyNotes[d]=[];
        const ids=new Set(storyNotes[d].map(n=>n.id));
        notes[d].forEach(n=>{ if(n&&n.id&&!ids.has(n.id)){storyNotes[d].push(n);added++;} });
        storyNotes[d].sort((a,b)=>a.idx-b.idx);
      });
      (folders||[]).forEach(f2=>{ if(f2&&!storyFolders.includes(f2)) storyFolders.push(f2); });
      saveStoryStorage(); renderStoryTimeline(); renderAll();
      alert('匯入完成：新增 '+added+' 則筆記');
    }catch(e){ alert('匯入失敗：'+e.message); }
    input.value='';
  };
  r.readAsText(f);
}

// 📖 故事線 · 常駐輸入視窗
// 開網頁就自動跳出；時間／價格跟著目前K棒走（以1分K為準）
// ============================================================
const SNE_GROUPS = [
  {title:'盤面發生什麼事？', c:'#38bdf8', subs:[
    {k:'ma', mark:'均線', label:'均線', c:'#38bdf8',
     ph:'例：\n60MA 由平轉上彎，5MA 與 20MA 黃金交叉後開口擴大。\n第一次回測 20MA 沒有跌破，收在均線上方。'},
    {k:'ps', mark:'價格', label:'價格', c:'#facc15',
     ph:'例：\n前高被帶量突破，回測突破點不破，形成更高的低點。\n日內從箱型震盪轉為上升結構，但量能沒有同步放大。'}
  ]},
  {title:'計畫是什麼？', c:'#a78bfa', subs:[
    {k:'plan', mark:'計畫', label:'', c:'#a78bfa',
     ph:'例：\n回測 20MA 分兩批進場，停損放前低下方。\n第一目標前高，到價先出一半，剩下移動停利。\n若跳空直接過高就不追。'}
  ]},
  {title:'反向的看法是什麼？', c:'#fb7185', subs:[
    {k:'rev', mark:'反向', label:'', c:'#fb7185',
     ph:'例：\n量其實是縮的，這個突破可能是誘多。\n跌回突破點之下就代表失敗，計畫直接作廢。\n空方會說這只是反彈到大格局的壓力區。'}
  ]}
];
const SNE_FIELDS = [];
SNE_GROUPS.forEach(g=>g.subs.forEach(s=>SNE_FIELDS.push(s)));
const SNE_MARK_TO_KEY = {'均線':'ma','價格':'ps','結構':'ps','計畫':'plan','反向':'rev','補充':'legacy'};

function sneEmpty(){ return {ma:'',ps:'',plan:'',rev:''}; }
function sneSerialize(f){
  const out=[];
  SNE_FIELDS.forEach(fd=>{
    const v=String(f[fd.k]||'').trim();
    if(v) out.push('【'+fd.mark+'】\n'+v);
  });
  return out.join('\n\n');
}
function sneParse(text){
  const f={ma:'',ps:'',plan:'',rev:'',legacy:''};
  const s=String(text||'');
  const re=/【(均線|價格|結構|計畫|反向|補充)】/g;
  const hits=[]; let m;
  while((m=re.exec(s))!==null) hits.push({k:SNE_MARK_TO_KEY[m[1]], i:m.index, len:m[0].length});
  if(!hits.length){ f.legacy=s.trim(); return f; }
  const pre=s.slice(0,hits[0].i).trim();
  if(pre) f.legacy=pre;
  hits.forEach((h,i)=>{
    const end=(i+1<hits.length)?hits[i+1].i:s.length;
    const val=s.slice(h.i+h.len,end).trim();
    if(!val) return;
    f[h.k]= f[h.k] ? (f[h.k]+'\n'+val) : val;
  });
  return f;
}
function sneIsStructured(text){ return /【(均線|價格|結構|計畫|反向)】/.test(String(text||'')); }
function sneLoad(text){
  const p=sneParse(text);
  const had=!!p.legacy;
  if(p.legacy) p.ps = p.ps ? (p.legacy+'\n'+p.ps) : p.legacy;
  delete p.legacy;
  return {fields:p, hadLegacy:had};
}
function storyNotePreviewHtml(n, full){
  if(!sneIsStructured(n.text)) return '<div class="story-note-text">'+escapeHtml(n.text)+'</div>';
  const f=sneLoad(n.text).fields;
  let h='<div class="sne-mini'+(full?' full':'')+'">';
  SNE_FIELDS.forEach(fd=>{
    if(!f[fd.k]) return;
    h+='<div class="sne-mini-row"><span class="sne-mini-tag" style="color:'+fd.c+';border-color:'+fd.c+'55;background:'+fd.c+'1a;">'+fd.mark+'</span>'
      +'<span class="sne-mini-txt">'+escapeHtml(f[fd.k])+'</span></div>';
  });
  return h+'</div>';
}

let sneWatch = null;

const SNE_GEO_KEY = 'nqSneWinGeo';

function sneDraftKey(){
  if(!sneState) return 'nqSneDraft:none';
  return 'nqSneDraft:'+sneState.mode+':'+(sneState.d||'')+':'+(sneState.id||sneState.meta.idx);
}
function sneSaveDraft(){ if(sneState) try{ localStorage.setItem(sneDraftKey(), JSON.stringify(sneState.fields)); }catch(e){} }
function sneClearDraft(){ try{ localStorage.removeItem(sneDraftKey()); }catch(e){} }
function sneDirty(){ return !!sneState && sneSerialize(sneState.fields)!==sneState.orig && !!sneSerialize(sneState.fields).trim(); }

// 記住視窗的螢幕位置與大小 → 每次都固定開在同一個地方
function sneGeo(){
  const g={w:1500,h:900,x:null,y:null};
  try{

    if(r && r.w>400 && r.h>300){ g.w=r.w; g.h=r.h; g.x=r.x; g.y=r.y; }

function sneRememberGeo(){

// ---- 目前K棒（一律以1分K為準）----
const SNE_TF_MIN = {'1k':1,'5k':5,'15k':15,'60k':60};
// 主畫面現在看的是哪個格局 → 取最小的那個當基準
function sneTfUnit(){
  try{
    if(typeof selectedTFs!=='undefined' && selectedTFs && selectedTFs.length){
      const u=Math.min.apply(null, selectedTFs.map(t=>SNE_TF_MIN[t]||1));
      if(u>0) return u;
    }
  }catch(e){}
  return 1;
}
function sneTfKey(u){
  let k='1k';
  Object.keys(SNE_TF_MIN).forEach(x=>{ if(SNE_TF_MIN[x]===u) k=x; });
  return k;
}
// 1分K的時間 → 捨去到所屬格局的開盤分鐘（5分K：23:14 → 23:10）
function sneSnapTs(ts, unit){
  const m=/^(\d{1,2}):(\d{2})/.exec(String(ts||''));
  if(!m || unit<=1) return ts;
  let h=+m[1], mi=Math.floor((+m[2])/unit)*unit;
  if(mi>=60){ h+=Math.floor(mi/60); mi=mi%60; }
  h=h%24;
  return String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0');
}
function sneCurrentMeta(){
  const b=(typeof mode1kBars!=='undefined') ? mode1kBars[cur1] : null;
  if(!b) return null;
  const u=sneTfUnit();
  return {idx:b.idx, ts:sneSnapTs(b.ts,u), price:b.c, tf:sneTfKey(u)};
}
function sneNewState(){
  const m=sneCurrentMeta()||{idx:0, ts:'—', price:0, tf:'1k'};
  return {mode:'new', d:currentDay, id:null, meta:m,
    fields:sneEmpty(), folder:'', orig:'', locked:false, hadLegacy:false};
}

// ---- 開窗 / 聚焦 ----
function sneFocusOrOpen(){
  if(sneWin && !sneWin.closed){
    if(!sneState){ sneState=sneNewState(); sneRemount(); }
    try{ sneWin.focus(); }catch(e){}
    return;
  }
  if(!sneState) sneState=sneNewState();
  sneOpenWindow();
}
function sneAutoOpen(){
  if(sneWin && !sneWin.closed) return;
  sneState=sneNewState();
  sneOpenWindow(true);
}
function sneOpenWindow(silent){
  const g=sneGeo();
  let feat='width='+g.w+',height='+g.h+',menubar=no,toolbar=no,location=no,status=no,scrollbars=yes,resizable=yes';
  if(g.x!==null && g.y!==null) feat+=',left='+g.x+',top='+g.y;
  let w=null;
  try{ w=window.open('','nqStoryEditor',feat); }catch(e){ w=null; }
  if(!w){ sneBlocked(silent); return; }
  sneWin=w;
  const cssEl=document.querySelector('style');
  const css=cssEl?cssEl.textContent:'';
  w.document.open();
  w.document.write('<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><title>📖 交易故事線 · 輸入</title><style>'
    +css+'</style></head><body class="sne-popup"><div class="sne-ov show" id="sneOv"></div></body></html>');
  w.document.close();
  const boot=()=>{
    if(!sneWin || sneWin.closed) return;
    const ov=w.document.getElementById('sneOv');
    if(!ov){ setTimeout(boot,40); return; }
    sneMount(w.document, ov);
    try{ w.focus(); }catch(e){}
    const ta=w.document.getElementById('sne_ta_ma'); if(ta) ta.focus();
    sneUpdateOpenBtn();
  };
  setTimeout(boot, 40);
  sneStartWatch(w);
  sneUpdateOpenBtn();
}
function sneRemount(){
  if(!sneWin || sneWin.closed) return;
  const ov=sneWin.document.getElementById('sneOv');
  if(ov) sneMount(sneWin.document, ov);
}
function sneBlocked(silent){
  sneWin=null; sneDoc=null;
  sneUpdateOpenBtn(true);
  if(!silent) alert('瀏覽器擋掉了輸入視窗。\n請按網址列右側的圖示，選「一律允許快顯視窗」，再點一次「開啟輸入視窗」。');
}
function sneStartWatch(w){
  clearInterval(sneWatch);
  sneWatch=setInterval(()=>{
    if(w.closed){
      clearInterval(sneWatch); sneWatch=null;
      if(sneWin===w){
        if(sneDirty()) sneSaveDraft();
        sneWin=null; sneUnbindDocs(); sneDoc=null; sneState=null;
        sneUpdateOpenBtn();
      }
      return;
    }
    if(sneWin===w) sneRememberGeo();
  }, 1000);
}
function sneUpdateOpenBtn(blocked){
  const b=document.getElementById('storyOpenBtn');
  if(!b) return;
  const open = !!(sneWin && !sneWin.closed);
  b.textContent = blocked ? '⚠ 被擋住了，點我開啟輸入視窗'
                : (open ? '🗗 輸入視窗（點我切過去）' : '🗗 開啟輸入視窗');
  b.classList.toggle('on', open);
}

// ---- 主畫面換K棒時，視窗標題跟著動 ----
function sneSyncBar(){
  sneUpdateOpenBtn();

    const m=sneCurrentMeta();

// ---- UI ----
function sneGroupHtml(g){

function sneMarkup(){
  const st=sneState;
  let folderOpts='<option value="">未分類</option>';
  storyFolders.forEach((f,i)=>{ folderOpts+='<option value="'+i+'"'+(st.folder===f?' selected':'')+'>📁 '+escapeHtml(f)+'</option>'; });
  folderOpts+='<option value="__new__">＋新增分類…</option>';

function sneMount(doc, container){
  sneDoc=doc;
  container.innerHTML=sneMarkup();
  const $ = id => doc.getElementById(id);

  SNE_FIELDS.forEach(fd=>{
    const ta=$('sne_ta_'+fd.k);
    ta.value=sneState.fields[fd.k]||'';
    ta.addEventListener('input', ()=>{
      sneState.fields[fd.k]=ta.value;
      if(sneState.mode==='new'){
        const any=SNE_FIELDS.some(x=>String(sneState.fields[x.k]||'').trim());
        if(any && !sneState.locked){ sneState.locked=true; sneRenderHead(); }
        else if(!any && sneState.locked){ sneState.locked=false; sneSyncBar(); }
      }
      sneRefreshMeters();
      const sb=$('sneSavedBar'); if(sb) sb.classList.remove('show');
      clearTimeout(sneDraftTimer);
      sneDraftTimer=setTimeout(sneSaveDraft, 400);
    });
    ta.addEventListener('keydown', e=>{
      e.stopPropagation();
      if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){ e.preventDefault(); sneCommit(); }
    });
  });
  $('sneFolder').addEventListener('change', e=>{
    const v=e.target.value;
    if(v==='__new__'){
      const name=(doc.defaultView||window).prompt('新分類名稱：');
      if(name&&name.trim()){
        const nn=name.trim();
        if(!storyFolders.includes(nn)) storyFolders.push(nn);
        sneState.folder=nn; saveStoryStorage();
        let o='<option value="">未分類</option>';
        storyFolders.forEach((f,i)=>{ o+='<option value="'+i+'"'+(sneState.folder===f?' selected':'')+'>📁 '+escapeHtml(f)+'</option>'; });
        o+='<option value="__new__">＋新增分類…</option>';
        e.target.innerHTML=o;
      } else {
        e.target.value = sneState.folder ? String(storyFolders.indexOf(sneState.folder)) : '';
      }
    } else if(v===''){ sneState.folder=''; }
    else { sneState.folder=storyFolders[parseInt(v)]||''; }
  });
  $('sneSave').addEventListener('click', sneCommit);
  $('sneResetBtn').addEventListener('click', sneBackToLive);
  $('sneCancel').addEventListener('click', ()=>sneCloseWin(false));

  doc.addEventListener('keydown', sneKeyHandler, true);
  if(sneBoundDocs.indexOf(doc)<0) sneBoundDocs.push(doc);

  if(sneState.hadLegacy) $('sneLegacyBar').classList.add('show');
  try{
    const raw=localStorage.getItem(sneDraftKey());
    if(raw){
      const dft=JSON.parse(raw);
      if(sneSerialize(dft) && sneSerialize(dft)!==sneSerialize(sneState.fields)){
        $('sneDraftBar').classList.add('show');
        $('sneDraftUse').addEventListener('click', ()=>{
          sneState.fields=Object.assign(sneEmpty(),dft);
          SNE_FIELDS.forEach(fd=>{ $('sne_ta_'+fd.k).value=sneState.fields[fd.k]||''; });
          if(sneState.mode==='new') sneState.locked=true;
          $('sneDraftBar').classList.remove('show');
          sneRefreshMeters(); sneRenderHead();
        });
        $('sneDraftDrop').addEventListener('click', ()=>{ sneClearDraft(); $('sneDraftBar').classList.remove('show'); });
      }
    }
  }catch(e){}

  sneRenderHead();
  sneRefreshMeters();
}

function sneKeyHandler(e){
  if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); sneCloseWin(false); }
  else if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){ e.preventDefault(); e.stopPropagation(); sneCommit(); }
}
function sneRefreshMeters(){
  if(!sneDoc||!sneState) return;
  let total=0;
  SNE_FIELDS.forEach(fd=>{ total += String(sneState.fields[fd.k]||'').replace(/\s/g,'').length; });
  const done=SNE_FIELDS.filter(fd=>String(sneState.fields[fd.k]||'').trim()).length;
  const c=sneDoc.getElementById('sneCount');
  if(c) c.textContent=total+' 字 · 已寫 '+done+'/'+SNE_FIELDS.length;
  SNE_FIELDS.forEach(fd=>{
    const d=sneDoc.getElementById('sne_dot_'+fd.k);
    if(!d) return;
    const on=!!String(sneState.fields[fd.k]||'').trim();
    d.style.background=on?fd.c:'transparent';
    d.style.borderColor=on?fd.c:'var(--b2)';
    d.style.boxShadow=on?('0 0 7px '+fd.c+'88'):'none';
  });
}

// ---- 回到「跟著K棒的新筆記」----
function sneBackToLive(){
  const w=(sneDoc&&sneDoc.defaultView)||window;
  if(sneDirty() && !w.confirm('目前的內容還沒儲存，要清掉並回到目前K棒嗎？\n（會先存成草稿）')) return;
  if(sneDirty()) sneSaveDraft();
  sneState=sneNewState();
  sneRemount();
}

// ---- 從時間軸點「✏ 編輯」----
function editStoryNote(d,id){
  const n=findStoryNote(d,id); if(!n) return;
  if(sneDirty()) sneSaveDraft();
  const ld=sneLoad(n.text);
  sneState={mode:'edit', d:d, id:id,
    meta:{idx:n.idx, ts:n.ts, price:n.price},
    fields:ld.fields, folder:n.folder||'',
    orig:String(n.text||''), locked:true, hadLegacy:ld.hadLegacy};
  if(sneWin && !sneWin.closed){ sneRemount(); try{ sneWin.focus(); }catch(e){} }
  else sneOpenWindow();
}

// ---- 關閉視窗 ----
function sneUnbindDocs(){
  sneBoundDocs.forEach(d=>{ try{ d.removeEventListener('keydown', sneKeyHandler, true); }catch(e){} });
  sneBoundDocs=[];
}
function sneCloseWin(force){
  const w=(sneDoc&&sneDoc.defaultView)||window;
  if(!force && sneDirty()){
    if(!w.confirm('有還沒儲存的修改，確定要關閉嗎？\n（內容已存成草稿，下次開啟可以還原）')) return;
    sneSaveDraft();
  }
  sneRememberGeo();
  clearInterval(sneWatch); sneWatch=null;
  sneUnbindDocs();
  const win=sneWin;
  sneWin=null; sneDoc=null; sneState=null;
  if(win && !win.closed){ try{ win.close(); }catch(e){} }
  sneUpdateOpenBtn();
}

// ---- 儲存 ----
function sneCommit(){
  if(!sneState) return;
  const txt=sneSerialize(sneState.fields);
  const w=(sneDoc&&sneDoc.defaultView)||window;
  if(!txt.trim()){ w.alert('至少要寫一段內容再儲存。'); return; }
  if(sneState.mode==='edit'){
    const n=findStoryNote(sneState.d, sneState.id);
    if(!n){ w.alert('找不到這則筆記（可能已被刪除）'); }
    else { n.text=txt; n.folder=sneState.folder; }
  } else {
    const d=sneState.d;
    if(!storyNotes[d]) storyNotes[d]=[];
    storyNotes[d].push({
      id: Date.now()+'_'+Math.random().toString(36).slice(2,7),
      idx: sneState.meta.idx, ts: sneState.meta.ts, price: sneState.meta.price,
      tf: sneState.meta.tf||'1k', text: txt, folder: sneState.folder
    });
    storyNotes[d].sort((a,b)=>a.idx-b.idx);
  }
  saveStoryStorage();
  sneClearDraft();

  renderStoryTimeline();
  renderAll();
  refreshStoryClsIfOpen();

  // 存完自動回到「跟著K棒的新筆記」，視窗留著繼續寫
  const folder=sneState.folder;
  sneState=sneNewState();
  sneState.folder=folder;
  sneRemount();
  if(sneDoc){
    const sb=sneDoc.getElementById('sneSavedBar');
    if(sb){
      sb.classList.add('show');
      clearTimeout(sneSavedTimer);
      sneSavedTimer=setTimeout(()=>{ try{ sb.classList.remove('show'); }catch(e){} }, 2600);
    }
  }
}

function addStoryFolder(){
  const name=prompt('新分類名稱（例如：開盤急殺V轉）：');
  if(name===null) return;
  const nn=name.trim();
  if(!nn) return;
  if(storyFolders.includes(nn)){alert('已有同名分類');return;}
  storyFolders.push(nn);
  saveStoryStorage();
  renderStoryClsChips(); renderStoryClsList();
}
function deleteStoryFolderByIdx(i){
  const name=storyFolders[i];
  if(name===undefined) return;
  let cnt=0;
  Object.keys(storyNotes).forEach(d=>storyNotes[d].forEach(n=>{if(n.folder===name)cnt++;}));
  if(!confirm('確定刪除分類「'+name+'」？\n裡面的 '+cnt+' 個時間點會變回「未分類」（筆記本身不會被刪除）')) return;
  Object.keys(storyNotes).forEach(d=>storyNotes[d].forEach(n=>{if(n.folder===name)n.folder='';}));
  storyFolders.splice(i,1);
  if(sclsFilter==='f:'+i) sclsFilter='__all__';
  else if(sclsFilter.startsWith('f:')){
    const fi=parseInt(sclsFilter.slice(2));
    if(fi>i) sclsFilter='f:'+(fi-1);
  }
  saveStoryStorage();
  renderStoryClsChips(); renderStoryClsList(); renderSmktList(); renderStoryTimeline();
}

function getFilteredStoryNotes(){
  const out=[];
  Object.keys(storyNotes).sort().reverse().forEach(d=>{

      if(sclsFilter==='__none__' && n.folder) return;

  });
  return out;

function renderSmktChartOnCanvas(canvasId, date, note, tf){
  const canvas=document.getElementById(canvasId);
  if(!canvas) return;
  const dayData=DATA[date];
  const paint=(msg)=>{
    const ctx=canvas.getContext('2d');
    canvas.width=canvas.clientWidth||300; canvas.height=canvas.clientHeight||150;
    ctx.fillStyle='#0d0d0f';ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#666';ctx.font='12px sans-serif';ctx.textAlign='center';
    ctx.fillText(msg, canvas.width/2, canvas.height/2);
  };
  if(!dayData){ paint('此日無資料'); return; }
  const dayBars=dayData[tf];
  if(!dayBars||!dayBars.length){ paint('此日無 '+tf.toUpperCase()+' 資料'); return; }

  // 找到筆記時間點對應的K棒
  let pos;
  if(tf==='1k') pos=dayBars.findIndex(b=>b.idx===note.idx);
  else {
    pos=dayBars.findIndex(b=>b.idx<=note.idx && note.idx<=(b.idx_end||b.idx));
    if(pos<0) pos=dayBars.findIndex(b=>b.idx>=note.idx);
  }
  if(pos<0) pos=dayBars.length-1;

  const basePadBars = tf==='1k' ? 150 : (tf==='5k' ? 100 : (tf==='15k' ? 70 : 150));
  const padBars=Math.max(2, Math.round(basePadBars/(smktZoomByTF[tf]||1)));
  const startPos=Math.max(0,pos-padBars);
  const endPos=Math.min(dayBars.length-1,pos+padBars);
  const segment=dayBars.slice(startPos,endPos+1);

  const wrapEl=canvas.parentElement;
  const dpr=window.devicePixelRatio||2;
  const W=wrapEl.clientWidth,H=wrapEl.clientHeight;
  canvas.width=W*dpr;canvas.height=H*dpr;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.fillStyle='#0d0d0f';ctx.fillRect(0,0,W,H);

  const P={t:16,r:60,b:24,l:4};
  const cw=(W-P.l-P.r)/segment.length;
  const allP=segment.flatMap(b=>[b.h,b.l]);
  let lo=Math.min(...allP),hi=Math.max(...allP);
  const pad=(hi-lo)*0.1||1; lo-=pad; hi+=pad;
  const rng=hi-lo||1;
  const Y2=p=>P.t+(H-P.t-P.b)*(1-(p-lo)/rng);
  const X2=i=>P.l+i*cw+cw/2;
  canvas._layout={P,W,H,segment,X:X2,Y:Y2};

  for(let i=0;i<=4;i++){
    const y=P.t+(H-P.t-P.b)*i/4, price=hi-rng*i/4;
    ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(W-P.r,y);ctx.stroke();
    ctx.fillStyle='#999';ctx.font='9px monospace';ctx.textAlign='left';
    ctx.fillText(price.toFixed(1),W-P.r+4,y+3);
  }

  segment.forEach((b,i)=>{
    const x=X2(i),up=b.c>=b.o,col=up?UP:DN;
    ctx.strokeStyle=col;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x,Y2(b.h));ctx.lineTo(x,Y2(b.l));ctx.stroke();
    const ty=Math.min(Y2(b.o),Y2(b.c)),bh=Math.max(Math.abs(Y2(b.c)-Y2(b.o)),1.2);
    ctx.fillStyle=col;ctx.fillRect(x-Math.max(cw*0.35,2),ty,Math.max(cw*0.7,4),bh);
  });

  const rmk=['m5','m10','m20','m60'];
  maConfig.forEach((ma,mi)=>{
    if(!ma.on) return;
    ctx.strokeStyle=ma.c;ctx.lineWidth=mi===3?1.8:1.2;ctx.beginPath();
    let st=false;
    segment.forEach((b,i)=>{
      const v=b[rmk[mi]]??null;if(v==null)return;
      st?(ctx.lineTo(X2(i),Y2(v))):(ctx.moveTo(X2(i),Y2(v)),st=true);
    });
    ctx.stroke();
  });

  // 📌 筆記時間點標記：金黃虛線 + 圖釘 + 價格點
  const relPos=pos-startPos;
  if(relPos>=0 && relPos<segment.length){
    const b=segment[relPos], x=X2(relPos);
    ctx.strokeStyle='rgba(250,204,21,0.55)';ctx.lineWidth=1.2;ctx.setLineDash([5,4]);
    ctx.beginPath();ctx.moveTo(x,P.t);ctx.lineTo(x,H-P.b);ctx.stroke();
    ctx.setLineDash([]);
    const py=Y2(+note.price);
    ctx.fillStyle='#facc15';
    ctx.beginPath();ctx.arc(x,py,3.5,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#000';ctx.lineWidth=1;ctx.stroke();
    ctx.font='12px sans-serif';ctx.textAlign='center';
    ctx.fillText('📌',x,Y2(b.h)-6);
    const lblW=44,lblX=Math.max(lblW/2+P.l,Math.min(W-P.r-lblW/2,x));
    ctx.fillStyle='rgba(250,204,21,0.95)';ctx.fillRect(lblX-lblW/2,H-P.b,lblW,14);
    ctx.fillStyle='#000';ctx.font='bold 9px sans-serif';
    ctx.fillText(note.ts,lblX,H-P.b+10);
  }
}
function attachSmktCrosshair(tf){
  const bodyEl=document.getElementById('smktCanvasBody_'+tf);
  if(!bodyEl) return;
  bodyEl.addEventListener('mousemove',e=>{
    const r=bodyEl.getBoundingClientRect();
    handleSmktCross(tf,(e.clientX-r.left)/r.width);
  });
  bodyEl.addEventListener('mouseleave',()=>clearAllSmktCross());
  bodyEl.addEventListener('touchmove',e=>{
    if(e.touches.length!==1) return;
    e.preventDefault();
    const t=e.touches[0],r=bodyEl.getBoundingClientRect();
    handleSmktCross(tf,(t.clientX-r.left)/r.width);
  },{passive:false});
  bodyEl.addEventListener('touchend',()=>clearAllSmktCross());
}
function handleSmktCross(tf,xFrac){
  const main=document.getElementById('smktCanvas_'+tf);
  if(!main||!main._layout) return;
  const {W,segment,X}=main._layout;
  const mx=xFrac*W;
  let bi=0,bd=1e9;
  segment.forEach((_,i)=>{const dd=Math.abs(X(i)-mx);if(dd<bd){bd=dd;bi=i;}});
  const bar=segment[bi];
  if(!bar) return;
  syncSmktCrossFromIdx(bar.idx);
}
function syncSmktCrossFromIdx(idx){
  selectedSmktTFs.forEach(tf=>{
    const main=document.getElementById('smktCanvas_'+tf);
    if(!main||!main._layout) return;
    const {segment}=main._layout;
    if(!segment.length) return;
    let best=segment.length-1;
    for(let i=0;i<segment.length;i++){
      const b=segment[i], bEnd=b.idx_end||b.idx;
      if(b.idx<=idx && idx<=bEnd){best=i;break;}
      if(b.idx>idx){best=Math.max(0,i-1);break;}
    }
    drawSmktCross(tf,best);
    updateSmktChdrPrice(tf,segment[best]);
  });
}
function drawSmktCross(tf,bi){
  const main=document.getElementById('smktCanvas_'+tf);
  const cv=document.getElementById('smktCanvas_'+tf+'_cross');
  if(!cv||!main||!main._layout) return;
  const L=main._layout,dpr=window.devicePixelRatio||2;
  cv.width=main.width;cv.height=main.height;cv.style.width=main.style.width;cv.style.height=main.style.height;
  const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);ctx.clearRect(0,0,L.W,L.H);
  const {P,W,H,segment,X,Y}=L;
  if(bi<0||bi>=segment.length) return;
  const bar=segment[bi],sx=X(bi),closeY=Y(bar.c);
  ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=1;ctx.setLineDash([4,4]);
  ctx.beginPath();ctx.moveTo(sx,P.t);ctx.lineTo(sx,H-P.b);ctx.stroke();
  ctx.beginPath();ctx.moveTo(P.l,closeY);ctx.lineTo(W-P.r,closeY);ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='rgba(255,255,255,0.95)';ctx.fillRect(W-P.r+1,closeY-9,P.r-3,18);
  ctx.fillStyle='#000';ctx.font='bold 10px monospace';ctx.textAlign='left';
  ctx.fillText(bar.c.toFixed(1),W-P.r+4,closeY+4);
  const tlW=36,tlH=14,tlX=Math.max(tlW/2+P.l,Math.min(W-P.r-tlW/2,sx));
  ctx.fillStyle='rgba(255,255,255,0.95)';ctx.fillRect(tlX-tlW/2,H-P.b,tlW,tlH);
  ctx.fillStyle='#000';ctx.font='bold 9px sans-serif';ctx.textAlign='center';
  ctx.fillText(bar.ts,tlX,H-P.b+10);
}
function clearAllSmktCross(){
  selectedSmktTFs.forEach(tf=>{
    const cv=document.getElementById('smktCanvas_'+tf+'_cross');
    if(cv) cv.getContext('2d').clearRect(0,0,cv.width,cv.height);
    const main=document.getElementById('smktCanvas_'+tf);
    if(main&&main._layout&&main._layout.segment.length){
      updateSmktChdrPrice(tf,main._layout.segment[main._layout.segment.length-1]);
    }
  });
}
function updateSmktChdrPrice(tf,bar){
  const priceEl=document.getElementById('sprice_'+tf);
  const priceValEl=document.getElementById('spriceVal_'+tf);
  if(!priceEl||!priceValEl||!bar) return;
  const chg=bar.c-bar.o,up=chg>=0;
  priceEl.className='chdr-price '+(up?'up':'dn');
  priceValEl.textContent=(up?'+':'')+chg.toFixed(2);
  priceValEl.style.color=up?'var(--up)':'var(--dn)';
}

</script>
</body>
