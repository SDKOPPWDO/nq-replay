<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="複盤">
<title>複盤</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#0d0d0f;overflow:hidden;}
/* 外框：NQ／台指 各自是一個完整的 app（app.html），切換只是顯示/隱藏，兩邊的進度都保留 */
iframe.mkt{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:#0d0d0f;}
iframe.mkt.on{display:block;}
</style>
</head>
<body>
<script>
// ============================================================
// NQ／台指 頁簽外框
// - 第一次切到某個商品才載入它（台指資料小，NQ 資料大，互不拖累）
// - 載入過的商品會保留在背景，切回來是瞬間的、停在原本的K棒
// ============================================================
const frames = {};
const NAMES = {nq:'NQ', tx:'台指'};
function showMarket(m){
  if(m!=='nq' && m!=='tx') m='nq';
  if(!frames[m]){
    const f=document.createElement('iframe');
    f.className='mkt';
    f.src='app.html?m='+m;
    f.setAttribute('allow','fullscreen; clipboard-write');
    document.body.appendChild(f);
    frames[m]=f;
  }
  Object.keys(frames).forEach(k=>frames[k].classList.toggle('on', k===m));
  document.title = NAMES[m]+' 複盤';
  try{ localStorage.setItem('replayMarket', m); }catch(e){}
  try{ history.replaceState(null, '', location.pathname+'?m='+m); }catch(e){}
  // 從隱藏切回來時，請 app 重新量尺寸畫圖，並把鍵盤焦點交給它（← → 空白鍵 可直接用）
  setTimeout(()=>{
    try{
      const w=frames[m].contentWindow;
      w.dispatchEvent(new Event('resize'));
      w.focus();
    }catch(e){}
  }, 30);
}
window.addEventListener('message', e=>{
  if(e.origin!==location.origin) return;
  if(e.data && e.data.type==='switchMarket') showMarket(e.data.m);
});
let first = new URLSearchParams(location.search).get('m');
if(first!=='nq' && first!=='tx'){ try{ first=localStorage.getItem('replayMarket'); }catch(e){} }
showMarket(first||'nq');
</script>
</body>
</html>
